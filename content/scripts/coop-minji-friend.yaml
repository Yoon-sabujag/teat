id: coop-minji-friend
entry: intro
nodes:
  intro:
    id: intro
    lines:
      - speaker: narration
        text: 민지가 친구 소연을 센터로 데려왔다. 같이 앉아 있다.
      - speaker: companion
        text: 소연아, 내가 말했던 그 선생님이야.
      - speaker: npc
        text: 음… 민지가 하도 좋다고 해서 왔어요.
        expression: neutral
    choices:
      - id: soft
        label: 민지 씨 표정이 요즘 많이 밝아졌죠?
        next: soft-follow
      - id: hard
        label: 소연 씨도 꿈자리가 사납지 않으세요?
        next: hard-follow
        effects:
          - kind: suspicion
            delta: 2

  soft-follow:
    id: soft-follow
    lines:
      - speaker: companion
        text: 맞아요 소연아. 나 진짜 요즘 마음이 편해.
      - speaker: npc
        text: 어… 그건 맞긴 한데.
        expression: neutral
    choices:
      - id: close
        label: 그럼 한 번만 들어보시겠어요?
        next: success
        effects:
          - kind: end
            outcome: success

  hard-follow:
    id: hard-follow
    lines:
      - speaker: npc
        text: 저… 민지야, 나 먼저 갈게.
        expression: afraid
        effects:
          - kind: end
            outcome: flee

  success:
    id: success
    lines:
      - speaker: narration
        text: 소연도 명부에 이름을 올렸다.
