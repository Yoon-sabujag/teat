  tongyeong-hotel-room: "통영 작은 호텔 방, 저녁, 열려 있는 창으로 포구 불빛, 린넨 커튼, 나무 바닥, 미니 책상 위 키 한 개"
  seongsu-warehouse: "성수동 폐창고 내부, 새벽, 얼어붙은 공기, 철골 지붕, 바닥 물 자국, 낡은 형광등 한 줄만 켜짐"
