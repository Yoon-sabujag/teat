id: c9-office
title: "다시 을지로 7층"
background: euljiro-office
cast: []
entry: morning-prelude

nodes:
  morning-prelude:
    id: morning-prelude
    cast: []
    lines:
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: sooyeon_count_2, value: true }
        text: 카페 자리 닷새 뒤 새벽. 이수연한테서 카톡 한 줄. "오늘 밤 마포로 와요. 거실 한 자리, 빈 책상 하나, 미리 비워 둘게요. 같이 살자는 자리예요."
      - speaker: thought
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: sooyeon_count_2, value: true }
        text: 마포 13평. 빈 책상 하나. 같이 산다는 단어를 그쪽이 먼저 박았다. 답을 어떻게 보내느냐로 다음 몇 년의 방향이 정해진다.
    choices:
      - id: sooyeon-accept
        label: (답을 보낸다.) 가요. 이번 주 안에 짐 옮길게요.
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: sooyeon_count_2, value: true }
        check: { stat: yangsim, dc: 11 }
        success:
          next: morning
          effects:
            - kind: flag
              key: sooyeon_count_3
              value: true
            - kind: flag
              key: sooyeon_intimacy
              value: cohabit
            - kind: memory
              text: 이수연의 마포 결합 제안 수락. 이번 주 안에 짐 옮긴다.
        failure:
          next: morning
          effects:
            - kind: flag
              key: sooyeon_count_3
              value: hesitated
            - kind: flag
              key: sooyeon_intimacy
              value: cohabit_shaky
      - id: sooyeon-counter
        label: (답을 보낸다.) 자리는 자리대로 두고, 일주일에 두어 번씩 가는 걸로.
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: sooyeon_count_2, value: true }
        next: morning
        effects:
          - kind: flag
            key: sooyeon_intimacy
            value: tentative
          - kind: memory
            text: 이수연 결합 제안에 횟수 줄여 역제안. 천천히 가는 자세.
      - id: sooyeon-decline
        label: (답을 보낸다.) 같이 사는 자리는 못 받겠어요. 마포는 마포 그대로.
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: sooyeon_count_2, value: true }
        next: morning
        effects:
          - kind: flag
            key: sooyeon_intimacy
            value: declined_commit
          - kind: memory
            text: 이수연 마포 결합 제안 거절. 동등한 동료 관계 유지.
      - id: skip-prelude
        label: (계속)
        next: morning

  morning:
    id: morning
    lines:
      - speaker: narration
        text: 광화문 카페 자리 이후로 며칠이 지났다. 을지로 3가의 인쇄 골목 아침 공기는 같은 각도로 같은 온도로 돌아왔고, 빌딩 앞 공영주차장의 차 번호판은 오늘은 평범한 번호였다.
      - speaker: narration
        text: 7층 사무실 문을 열고 들어왔다. 창 블라인드 틈으로 지난 주 시점 그대로의 겨울 햇빛이 책상 위에 얹혀 있었고, 책상 위엔 재민이 지난주에 두고 간 포스트잇이 먼지가 얇게 덮인 채로 그 자리에 있었다.

      # ─────────────────────────────────────────
      # 엔딩 A — 폭로 (public)
      # ─────────────────────────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 아침 여섯 시 반. 주간 <이북>이 일요일 특별호 1면에 단독 기사를 걸었다. 싱가포르 법인 천팔백억, 차 상무와 오 감사 구속영장 청구. 장 전무는 개인 변호사 라인으로 즉시 방어막을 올렸고, 언론 대응은 그룹 지주 쪽에서 일관된 톤으로 내려왔다. 주식 시장은 장 초반 6퍼센트 구간을 열었다가 이틀 만에 절반을 다시 올렸다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 이수연이 오후 두 시에 사무실에 올라왔다. 커피도 안 받고 오 분이 안 됐다. 한 줄. "도현 씨 남쪽에서 얼굴 봤다는 연락은 저희 쪽 라인에서 왔어요. 생사 확인, 저는 95퍼센트로 봅니다. 오퍼센트는 제 책임이에요." 그리고 한 줄 더. "저 다음 주 월요일부로 다른 데스크로 옮겨요. 이 건 이번 주까지가 제 몫이에요."
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 오후 늦게 민영에게서 짧은 문자 한 통. '오늘은 일찍 들어와요.' 일곱 시에 집에 들어갔더니 식탁은 이미 정리되어 있었고, 하진이 방문은 닫혀 있었다. 민영은 방에서 한 번 나오지 않았고, 불이 꺼진 쪽에서 잠이 들어 있는지 아닌지는 확인하지 않았다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 위쪽은 못 잡혔고, 기자는 옮겨가고, 집 안의 두 사람은 문을 닫은 채 각자 자고 있다. 이 건의 공식 승리와 내 개인 계산서 사이에 오늘 밤 처음으로 한 줄이 그어졌다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: sooyeon_bond, value: deepened }
        text: 이수연한테서 한 줄 카톡 — '오늘 밤 우리 집 안 와도 돼요. 자리 맞춰지면 그때.' 답을 보내지 못한 채 휴대폰을 책상에 엎어 놓았다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: miyoung_bond, value: deepened }
        text: 미영의 이름은 기사 둘째 줄에서 한 칸 옆으로 빠져 있었다. 본인 쪽 라인에서 한 번 더 정리한 결과였고, 그 정리가 어떤 자세에서 나온 건지는 오늘 밤 묻지 않기로 했다.

      # ── 미영 결합 단계별 후일담 ──
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: miyoung_count_3, value: true }
        text: 다음 달 첫째 주, 청담 미영 오피스텔 침실 옆 작은 방에 책상 한 개를 들였다. 책상 위에 도현이 남긴 편지 원본을 가장 안쪽에 두었다. 일주일에 사흘은 그 책상에서 하루를 끝내는 사람이 됐고, 나머지 나흘은 을지로 사무실 책상에서 끝냈다. 두 책상의 무게가 같진 않았지만, 둘 중 하나가 더 가벼워지지도 않았다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: miyoung_count_2, value: true }
          flagNotEquals:
            key: miyoung_count_3
            value: true
        text: 미영과 한 달에 두세 번씩 청담 카페에서 만났다. 도현 얘기는 한 번도 꺼내지 않았고, 우리 둘 얘기도 거의 꺼내지 않았다. 잔이 비워지면 한쪽이 먼저 일어났고, 다른 쪽이 따라 일어났다.

      # ── 수연 결합 단계별 후일담 ──
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: sooyeon_count_3, value: true }
        text: 마포 13평 오피스텔로 짐을 옮긴 건 그 주 토요일이었다. 책장 한 면을 비워 둔 자리에 내 책을 꽂았고, 식탁 끝의 잔이 두 개에서 한 짝으로 정리됐다. 이수연은 새 데스크로 출근하는 첫 주에도 마포 거실에서 노트북을 폈다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: public }
            - { key: sooyeon_count_2, value: true }
          flagNotEquals:
            key: sooyeon_count_3
            value: true
        text: 이수연과는 일주일에 한 번 마포에서 만났다. 처음 몇 번은 같이 식사했고, 그 다음부터는 노트북 두 대 사이에서 같은 기사 톤을 다듬는 자리가 됐다. 이 사람의 부재가 가장 단단한 자리에서 부재가 자리로 바뀌는 데 한 달이 걸렸다.

      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 을지로 7층 사무실로 다시 올라가 창 밖을 봤다. 간판 시트지 '백승재 리서치' 여섯 글자 위로 밤 비가 한 번 지나갔고, 그 물 자국 안쪽에서 글자들은 평소보다 얇아 보였다.
        effects:
          - kind: end
            outcome: public

      # ─────────────────────────────────────────
      # 엔딩 B — 거래 (deal / deal_tainted)
      # ─────────────────────────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 그룹 공식 홈페이지 임원 동정 코너에 '백승재 부본부장 보직 복귀' 한 줄이 올라왔다. 소속은 해외사업본부. 해외사업본부장 자리는 아직 공석이 아니었다. 본부장은 오전 내내 자리에 앉아 있던 차 상무 그 사람이었다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: 그룹 사이트엔 아무 것도 올라오지 않았다. 계약서 최종본은 본사 경영지원 쪽 외주 서류 양식으로 와 있었고, 직함 칸엔 '본부장급 고문'. 주 이틀 비상근, 연봉 없는 성과형, 퇴사 시 그룹 측 자유 해지, 공식 임직원 명부 외. 한 줄로 요약하면, 자리처럼 보이는 자리가 아니라는 뜻이었다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 차 상무에게서 오후 한 통. 안부 문장은 없었다. "승재씨, 월요일 아침 여덟 시 본사 17층 회의실. 자료 한 묶음 제가 미리 깔아 두겠습니다. 오래 서 계시진 마시고요." 저쪽이 먼저 끊었고, 이 통화는 오늘의 첫 업무 지시로 분류됐다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: 차 상무에게서 오후 한 통. "승재씨, 잘 살고 계시죠." 한 마디 뒤에. "이번 건 마무리는 저희 쪽 계산서대로 가는 게 맞으니까요. 승재씨 쪽에서 한 번 더 확인해 주실 건 없고요." 저쪽이 먼저 끊었다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 미영은 로펌 쪽 다른 건으로 해외 출장을 잡았다. 출국 전 짧은 문자 한 줄. '도현 씨는 제가 기다리는 쪽으로 남겨 둘게요.' 그 문자 이후 한 달 뒤, 같은 번호로 전화는 더 이상 연결되지 않게 된다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: 미영은 연락이 닿지 않았다. 재민이 사무실에 올라와 한 줄 전해 주었다. "형, 미영이 지난 주 말레이시아 쪽으로 떠났대요. 로펌 소송팀 한 명 같이 간 건이라 본인 의사로 간 건지 본인 의사가 아닌 건지는 저도 모르겠어요."
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 녹음기는 사무실 소형 금고 안쪽에서 아예 본사 임원실 서랍 쪽으로 옮겨질 거다. 월요일 아홉 시 전까지. 도현이라는 이름은 내 서랍이 아니라 차 상무의 서랍 쪽으로 올라간다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: 자리처럼 보이는 자리. 구조상 '실체 없는 자리'가 내 오늘 이후의 직함이 됐다. 녹음기는 여전히 내 쪽에 있지만, 오늘 이후 그 물건은 내 카드가 아니라 내 짐이 된다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: deal }
            - { key: miyoung_bond, value: deepened }
        text: 미영한테서 카톡 한 줄 — '이제 답 안 하실 거잖아요. 받았어요.' 두 줄째는 없었다. 답을 찍다가 지웠다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: deal }
            - { key: sooyeon_bond, value: deepened }
        text: 이수연 쪽엔 카톡도 안 왔다. 그쪽이 보내지 않은 부재가 오늘 밤 가장 단단한 한 줄이었다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: deal }
            - { key: miyoung_count_2, value: true }
        text: 미영과는 두 번이 마지막이었다. 청담 오피스텔 도어록 번호는 한 달 만에 바뀌어 있었고, 그 사실을 카톡으로 묻지 않은 채 알았다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: deal }
            - { key: sooyeon_count_2, value: true }
        text: 이수연은 한 달 뒤 다른 데스크로 옮겼다. 마포 오피스텔 주소는 그대로였지만 문 앞까지 가지는 않았다. 일이 가까워질수록 라인이 분리됐다는 사실을 양쪽 다 자기 책상에서 받아들였다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 집 현관문이 열렸을 때 하진이가 거실에서 고개 한 번만 들고 인사 한 자 없이 방으로 돌아갔다. 식탁 앞에 앉자 민영이 한 번만 물었다. "이제 좀 편해졌어." 내 답은 한 글자. "응." 그 한 글자 뒤에 두 사람이 다시 식기 소리 쪽으로 돌아갔다.
        effects:
          - kind: end
            outcome: deal
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: deal_tainted }
            - { key: miyoung_count_2, value: true }
        text: 미영한테는 한 달 동안 답이 가지 않았고, 그 한 달이 지난 뒤로는 답을 보내야 할 자리가 더 이상 남아 있지 않았다. 청담 위스키 바 그 카운터 한 자리는 그 사이에 한 번도 다시 가지 않았다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: deal_tainted }
            - { key: sooyeon_count_2, value: true }
        text: 이수연 쪽에선 카톡도 전화도 오지 않았다. 마포 합정 사거리는 그 사이에 두 번 지나갔지만 4층 창문 쪽으로는 고개를 들지 않았다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: 집에 들어가지 않았다. 을지로 사무실 책상 위에 코트를 덮고 그 위로 얼굴을 한 번 가렸다. 창 밖 공영주차장으로 검은 세단 한 대가 한 번 들어왔다 나갔고, 그 지나감을 확인할 힘은 오늘 밤엔 남아 있지 않았다.
        effects:
          - kind: end
            outcome: deal_tainted

      # ─────────────────────────────────────────
      # 엔딩 C — 침묵 (silence / silence_leak)
      # ─────────────────────────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 아무 일도 일어나지 않았다. 신문 1면엔 다른 뉴스가 올라왔고, 그룹 주가는 평소 변동 범위 안으로 움직였고, 차 상무 이름은 어느 지면에도 안 나왔다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 공식적으론 아무 일도 일어나지 않았다. 다만 그룹 내부 감사 라인에서 '일부 보직 재정비' 한 줄이 사내 게시판에 뜬 것이, 그 뒷정리의 시작을 내 쪽에도 한 줄로 알려 주었다.
      - speaker: narration
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence
        text: 을지로 사무실엔 그 주 내내 의뢰 전화 한 통 들어오지 않았다. 재민이 수요일에 올라와서 커피 한 잔 마시고, '형, 그쪽 라인 조용히 정리 중이래요.' 한 마디만 남기고 다시 내려갔다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 재민이 이틀에 한 번씩 올라왔다. '형, 그쪽에서 한 번 더 문의 오면 형 쪽에서 안 열어 주셔도 될 거예요.' 그 한 줄이 두 번째 왔을 때, 나는 오늘 이후로 그쪽 문을 한 번 더 안 열겠다는 쪽으로 의자에 한 번 더 기대 앉았다.
      - speaker: narration
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence
        text: 금요일 저녁, 로펌 쪽 주소가 찍힌 봉투 한 장이 우편함에 들어왔다. 미영의 글씨였다. '도현 씨가 남긴 편지 복사본 한 장 동봉합니다. 원본은 제 쪽에 있습니다.' 편지의 마지막 한 줄 — "저는 돌아옵니다. 단지 시간을 받으셔야 할 것 같아요. 실장님이 그 시간을 받으시는 동안 저는 살아 있을 확률을 내일로 미뤄 두고요."
        effects:
          - kind: flag
            key: dohyun_letter
            value: true
      - speaker: narration
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 우편함엔 아무것도 들어오지 않았다. 미영 쪽에서 전화도 문자도 오지 않았고, 편지 한 장도 책상 위에 얹히지 않았다.
      - speaker: narration
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence
        text: 어느 밤 공영주차장 쪽을 블라인드 틈으로 살폈더니 어제까지 없던 검은 세단 한 대가 다시 시동을 끈 채 서 있었다. 운전석 안쪽 담배 불빛이 느리게 밝아졌다 어두워졌다.
      - speaker: thought
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence
        text: 오늘 이후로 그 차는 한 번씩 같은 자리에 돌아온다. 내 쪽에서 문을 한 번 더 안 열더라도, 저쪽에서 문을 한 번씩 두드려 확인하러 오는 자리. 그 대칭이 오늘 이후의 기본값이다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: silence }
            - { key: miyoung_count_3, value: true }
        text: 다음 달 첫째 주 토요일, 청담 미영 오피스텔 침실 옆 작은 방에 책상 한 개를 옮겨 들였다. 책상 위에 도현이 남긴 친필 편지 원본을 가장 안쪽 칸에. 일주일에 사흘은 그 책상에서 하루를 끝냈고, 나머지 나흘은 을지로 사무실에서 끝냈다. 미영도 나도 도현 얘기는 한 달이 지나도록 한 번도 꺼내지 않았다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: silence }
            - { key: miyoung_count_2, value: true }
          flagNotEquals:
            key: miyoung_count_3
            value: true
        text: 미영과 청담 카페에서 한 달에 두세 번씩 만났다. 도현 얘기도 우리 둘 얘기도 거의 꺼내지 않았다. 잔이 비워지면 한쪽이 먼저 일어났다.
      - speaker: narration
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence
        text: 하진이 카톡 한 줄이 늦은 밤 다시 올라왔다. '아빠 잘 지내?' 답을 찍어 보냈다. '잘 지낸다. 너도 잘 자라.' 보낸 뒤 휴대폰을 책상 위에 엎어 두었다.
        effects:
          - kind: end
            outcome: silence
      - speaker: narration
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 어느 밤 공영주차장 쪽으로 검은 세단 한 대가 먼저 도착해 있었고, 그 다음 날 사무실 문고리에 낯선 명함 한 장이 꽂혀 있었다. 앞면엔 이름 없이 02로 시작하는 전화번호 하나. 뒷면엔 연필로 '지난 달'이라고만 한 글자.
      - speaker: narration
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 명함을 두 번 뒤집어 책상 위에 내려놓고, 서랍에서 녹음기를 한 번 꺼내 다시 손바닥에 얹었다 내려놓았다. 재생 버튼은 누르지 않았고, 그 자리에 한 번 더 서랍 안으로 밀어 넣었다.
      - speaker: narration
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 블라인드 틈으로 다시 살폈더니 어제의 그 검은 세단은 오늘 저 자리에 없었다. 대신 한 블록 떨어진 길가에, 앞 번호판 흙자국까지 똑같은 각도로 다른 세단 한 대가 깜빡이를 켜지 않은 채 서 있었다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: silence_leak }
            - { key: miyoung_count_2, value: true }
        text: 미영한테서는 한 줄 카톡이 한 번 더 왔다. '실장님이 흘리신 한 줄, 저쪽 라인이 저한테까지 들고 왔어요. 한 번만 만나서 정리하시죠.' 그 한 번 만남이 마지막이었고, 그 자리는 카페가 아니라 로펌 미팅룸 4호였다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: silence_leak }
            - { key: sooyeon_count_2, value: true }
        text: 이수연은 한 주 뒤 짧은 톡으로 정리했다. '실장님 쪽 흘림이 우리 데스크 라인까지 들어왔어요. 이번 자리는 여기까지가 맞을 것 같습니다.' 마포 4층은 다음 주에 다른 기자가 입주했다는 얘기를 다른 라인으로 들었다.
      - speaker: thought
        requires:
          flag: c7_end
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 같은 차가 번호만 바꿔 들어왔는지, 같은 라인의 다른 차가 교대로 들어왔는지는 오늘 밤 안엔 확인이 안 된다. 다만 그 구분이 오늘 이후로 내 쪽에선 필요하지 않은 구분이다.
        effects:
          - kind: end
            outcome: silence_leak

      # ─────────────────────────────────────────
      # 엔딩 D — 자멸 / 드리프트 (defer)
      # ─────────────────────────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 카페 자리 이후 '다음 자리 제가 정하겠다' 고 선언했지만, 그 다음 자리는 내 쪽에서 먼저 정해지지 않았다. 하루가 이틀로 늘어졌고, 일주일이 되자 이수연 쪽에서 한 번 '기다리고 있습니다' 라는 한 줄이 왔고, 그 한 줄에 대한 내 답은 '곧' 이라는 두 글자였다. 그 두 글자는 다음 주에도 재전송되었다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 이 주 뒤, 이수연이 다른 데스크로 옮겨 갔다는 소식이 업계 메일링에 한 줄 올라왔다. 세 번째 주부터 미영의 번호는 전원이 꺼져 있거나 잠시 꺼져 있는 쪽으로 안내 멘트가 바뀌었고, 재민은 여전히 올라왔지만 오래 앉지 않았다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 한 달이 지나자 민영이 문자 한 줄을 남겼다. '하진이 방학 계획 내가 알아서 잡았어요. 당신은 다른 일들 먼저.' 다른 일이라는 그 두 글자 앞에 내가 답할 수 있는 문장을 일주일 동안 찾지 못했고, 일주일이 지나자 그 문자 자체가 답이 필요 없는 문장이 되어 있었다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 하진이 카톡 프로필이 바뀌었다. 예전 강아지 사진 대신 검은 배경 한 장. 내 쪽에서 보낸 마지막 문자 — '아빠 오늘 늦어.' — 아래에 읽음 표시만 찍혀 있었고, 그 읽음 표시 옆에 답이 없는 날들이 그 이후로 세 줄로 쌓였다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 녹음기는 아직 내 책상 서랍 안에 있다. 열 사람이 없는 물건은 시간이 지나면 그 물건 자체가 사람을 알아보지 못하게 된다. 내가 오늘 이 서랍을 한 번 열지 않으면, 내일 이 서랍은 더 안 열린다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: defer }
            - { key: miyoung_count_2, value: true }
        text: 미영한테서 카톡 알림이 한 달에 한 번씩 깜빡였다. 답을 보낸 적은 없었고, 어느 시점부터 알림 자체가 멈췄다. 청담 위스키 바 그 카운터 자리에 누구의 잔 두 개가 다음으로 놓이고 있는지는 끝까지 모르고 살게 됐다.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: defer }
            - { key: sooyeon_count_2, value: true }
        text: 이수연은 다른 데스크로 옮긴 뒤 다른 기자 라인으로 사라졌다. 마포 4층 창문에 한밤중 불이 켜져 있는지 어떤지는 오늘 밤도 확인하지 않은 채로 한 해가 지났다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 어느 겨울 저녁 사무실 간판 시트지 한 귀퉁이가 떨어진 걸 발견했다. 칼로 '백승재 리서치' 여섯 자를 한 번에 정리해 떼어 냈고, 떼어 낸 시트지는 버리지 않았다. 책상 서랍 제일 안쪽, 녹음기 옆 자리에 접어서 얹어 두었다. 언젠가 다시 붙일 자리가 벽 위에 한 칸 남아 있었고, 그 한 칸은 오늘 이후로도 그 자리에 그대로 있을 예정이었다.
        effects:
          - kind: end
            outcome: damned
