id: c7-defer
title: "을지로 사무실, 오전"
background: euljiro-office
cast: []
entry: arrive

# 유예 라인. c6_decision = postpone. PC가 광화문 자리에 안 가고 사무실로 돌아와
# 결정을 미룬다. 짧은 씬, 가능 c7_end: silence / silence_leak / defer.
nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 광화문 가는 택시를 을지로로 다시 돌렸다. 사무실 문을 열자 어제 저녁에 두고 간 공기 그대로. 형광등을 켰고, 커피 머신을 켰다. 아홉 시 사십 분.
      - speaker: thought
        text: 차 상무가 광화문 카페에 한 시간 일찍 와서 한 시간 늦게 일어날 거다. 그 두 시간 동안 그쪽이 어떻게 움직일지가 오늘 오후의 첫 변수다.
      - speaker: narration
        text: 책상 위 휴대폰이 두 번 짧게 진동했다. 모르는 번호 한 통, 차 상무 한 통. 둘 다 받지 않았다.
    next: midmorning
  midmorning:
    id: midmorning
    lines:
      - speaker: narration
        text: 열 시 십오 분. 차 상무한테서 두 번째 부재중. 곧이어 카톡. "승재씨, 오늘 자리 미루시는 거 받습니다. 다만 오후 안에 답 한 번은 주시죠."
      - speaker: thought
        text: 약속을 펑크 낸 건 그쪽이 자기 룰로 처리한다. 오늘 안에 내 답이 안 가면 내일 아침엔 본사 쪽이 먼저 움직인다.
    choices:
      - id: defer-final
        label: (휴대폰을 엎어 놓고 책상에 앉는다.) 오늘은 답 안 한다.
        check: { stat: ttuksim, dc: 12 }
        success:
          next: close-defer
          effects:
            - kind: flag
              key: c7_end
              value: defer
            - kind: memory
              text: 7장 유예 결정. 오늘 약속 미루고 오후 내내 사무실에서 시간만 끌었다.
        failure:
          next: close-silence-leak
          effects:
            - kind: flag
              key: c7_end
              value: silence_leak
            - kind: memory
              text: 미루기로 했는데 오후 늦게 짧게 답을 보냈고, 그 답이 저쪽 카드로 남았다.
      - id: send-silence
        label: 카톡 한 줄 보낸다. "오늘 만남은 없던 걸로 하시죠."
        next: close-silence
        effects:
          - kind: flag
            key: c7_end
            value: silence
          - kind: memory
            text: 차 상무한테 카톡 한 줄로 약속 취소. 짧고 깔끔.
      - id: leak-bait
        label: 이수연 쪽에 톡. "다음 주 화요일에 한 번 봅시다."
        check: { stat: gwonmo, dc: 12 }
        requires:
          flag: tape_duplicated_plan
        success:
          next: close-leak-success
          effects:
            - kind: flag
              key: c7_end
              value: silence_leak
            - kind: memory
              text: 차 상무 약속은 펑크. 이수연한테는 다음 주 미팅 한 줄 던짐. 한쪽은 식히고 한쪽은 살린다.
        failure:
          next: close-silence-leak
          effects:
            - kind: flag
              key: c7_end
              value: silence_leak

  close-defer:
    id: close-defer
    lines:
      - speaker: narration
        text: 정오까지 휴대폰이 한 번 더 짧게 울렸고, 한 번 더 받지 않았다. 점심엔 김밥 한 줄 사 와 책상에서 먹었고, 저녁까지 다른 의뢰 잡고 있었다. 차 상무한테서 카톡 두 통이 더 들어왔지만 답하지 않았다.
      - speaker: thought
        text: 오늘 만남은 통째로 사라졌다. 다음 만남을 언제 어디서 잡을지는 이제 그쪽 손에 있다. 그게 오늘 이 사무실에서 가장 무겁다.
    next: depart

  close-silence:
    id: close-silence
    lines:
      - speaker: narration
        text: 카톡 보냄. 두 번째 체크 표시까지 십 초쯤. 그 사이에 차 상무 답이 돌아왔다. "그러시죠. 좋은 하루 되세요." 더 이상 진동은 없었다.
      - speaker: thought
        text: 한 줄로 끊어 낸 만큼 다음에 어떤 연락이 올지에 대한 단서도 남지 않았다.
    next: depart

  close-leak-success:
    id: close-leak-success
    lines:
      - speaker: narration
        text: 이수연 답이 곧장 돌아왔다. "화요일 좋습니다. 자리는 제가 잡을게요. 오늘 차 상무한테 한 마디도 안 보내셨다는 거, 그것도 저쪽이 알아챕니다."
      - speaker: thought
        text: 내가 오늘 약속을 펑크 냈다는 사실이 기자 쪽에도 박혔다. 다음 주 화요일까지 그 사실이 어디로 굴러갈지가 다음 변수다.
    next: depart

  close-silence-leak:
    id: close-silence-leak
    lines:
      - speaker: narration
        text: 정오 즈음 차 상무한테 짧은 답을 보냈다. 보내고 나서 후회했다. 오후 두 시쯤 답이 돌아왔다. "받았습니다. 다음 자리는 제가 잡을게요."
      - speaker: thought
        text: 미루기로 했는데 한 마디 흘렸다. 그 한 마디가 다음 만남을 그쪽이 잡는 명분이 됐다.
    next: depart

  depart:
    id: depart
    cast: []
    lines:
      - speaker: narration
        text: 저녁 일곱 시. 형광등을 끄기 전에 책상 위 시계를 봤다. 광화문 카페에 안 나타난 시간으로부터 정확히 열 시간이 지나 있었고, 그 열 시간 동안 내가 내려야 했던 결정의 무게가 의자에 그대로 가라앉아 있었다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 유예. 다음 약속은 내가 잡지 않는다. 그 약속에 내가 어떤 자세로 들어갈지만 오늘 사무실에서 정해 두었다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 없던 일로 했다. 오늘 한 번에 끊어낸 만큼 내 쪽이 좁아진다는 사실은 내일 아침에 확인된다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 한 마디 흘린 채로 오늘이 끝난다. 그 한 마디가 다음 만남의 모양을 정한다는 점에서, 오늘 나는 카드 한 장을 떨어뜨리고 떠난 셈이다.
      - speaker: narration
        text: 빌딩 1층 회전문을 나오자 을지로 골목 추운 공기가 정면으로 닿았다. 다음 며칠은 누구의 페이스로 흐를지를, 회전문 도는 사이에 한 번 더 정리했다.
        effects:
          - kind: chapterComplete
            chapter: chapter-7
            nextChapter: chapter-8
