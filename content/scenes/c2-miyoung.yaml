id: c2-miyoung
title: "변호사 미영"
background: cheongdam-cafe
cast:
  - npc: miyoung
    position: center
    expression: neutral
entry: arrive

nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 청담, 조용한 카페. 이른 저녁. 사람 많지 않다.
      - speaker: narration
        text: 미영은 이미 와 있다. 아메리카노, 아이폰 뒤집어 놓음, 법률 서류 가방 옆.
      - speaker: miyoung
        text: 백 실장님. 앉으시죠.
        expression: neutral
      - speaker: miyoung
        text: 먼저 한 가지, 이 대화는 기록 안 되는 거죠? 전 녹음 안 합니다. 실장님도 안 하시는 걸로 알겠습니다.
        expression: tense
    choices:
      - id: agree
        label: 안 합니다. 제 원칙입니다.
        next: open-question
        effects:
          - kind: flag
            key: c2_miyoung_record
            value: principle
      - id: decline
        label: 상황에 따라 다릅니다. 지금은 안 합니다.
        check: { stat: yangsim, dc: 12 }
        success:
          next: open-question
          effects:
            - kind: memory
              text: 미영에게 녹음 여부에 대해 원칙 대신 상황 조건을 달았다. 미영은 경계심을 올렸다.
            - kind: flag
              key: miyoung_on_guard
              value: true
            - kind: flag
              key: c2_miyoung_record
              value: situational_honest
        failure:
          next: open-question
          effects:
            - kind: flag
              key: c2_miyoung_record
              value: situational_clumsy

  open-question:
    id: open-question
    lines:
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: principle
        text: 원칙. 좋아요. 저도 그 말이 편해요.
        expression: neutral
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: situational_honest
        text: 솔직하시네요. 저는 그게 더 어렵고, 더 불편하고, 그래서 더 낫다고 생각해요.
        expression: weary
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: situational_clumsy
        text: '"상황에 따라." 그 말씀 저도 자주 써요. 그 말씀엔 방어가 많죠.'
        expression: tense

      - speaker: miyoung
        text: 준혁이한테 어디까지 들으셨어요.
        expression: tense
    choices:
      - id: honest
        label: 당신과 도현이 최근에 싸웠다. 도현이 뭘 하려고 했다. 거기까지.
        next: surface-truth
        effects:
          - kind: flag
            key: c2_miyoung_probe
            value: honest
      - id: downplay
        label: 별 얘기 없었습니다. 직접 듣는 게 나을 것 같아서요.
        check: { stat: gwonmo, dc: 12 }
        success:
          next: surface-truth
          effects:
            - kind: stat
              target: gwonmo
              delta: 1
            - kind: memory
              text: 준혁이 어디까지 말했는지 감추자 미영은 내가 생각보다 영리하다고 느꼈다.
            - kind: flag
              key: miyoung_respects
              value: true
            - kind: flag
              key: c2_miyoung_probe
              value: downplayed
        failure:
          next: surface-truth
          effects:
            - kind: flag
              key: c2_miyoung_probe
              value: downplay_missed

  surface-truth:
    id: surface-truth
    lines:
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: honest
        text: 솔직히 말씀해 주셔서 감사해요. 저도 같은 수위로 돌려드릴게요.
        expression: neutral
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: downplayed
        text: …실장님이 준혁이한테 얼마나 들었는지 저는 아직 몰라요. 그래서 제가 먼저 덜 말할게요.
        expression: weary
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: downplay_missed
        text: '"별 얘기 없었다." 준혁이한테 안 어울리는 태도네요. 저, 실장님 말씀 그대로 받지는 않을게요.'
        expression: tense

      - speaker: miyoung
        text: 그럼 제가 아는 만큼 말씀드릴게요. 기록 전제로 하신다면, 이 버전을 드립니다.
        expression: weary
      - speaker: miyoung
        text: 도현 씨와 저는 약혼한 사이였고, 최근에 이별 얘기가 오갔어요. 그게 전부예요.
        expression: neutral
      - speaker: miyoung
        text: 실종 전날 저는 도현 씨를 만나지 않았습니다. 전날엔 로펌 야근이 길었어요.
        expression: tense
      - speaker: thought
        text: '"이 버전을 드린다"는 말은 다른 버전이 있다는 뜻이다. 그리고 야근은 너무 편한 알리바이다.'
    choices:
      - id: press-on
        label: (더 물어봐야 한다)
        next: improv-node
      - id: thank-and-leave
        label: 오늘은 여기까지 듣겠습니다. 감사합니다.
        check: { stat: ttuksim, dc: 14 }
        success:
          next: thank-leave-success
          effects:
            - kind: flag
              key: held_back_with_miyoung
              value: true
            - kind: memory
              text: 미영에게 첫 만남을 일찍 끊었다. 두 번째 만남이 가능하도록 길을 남겼다.
        failure:
          next: improv-node

  improv-node:
    id: improv-node
    lines:
      - speaker: miyoung
        text: 더 물어보실 거죠. 편하게 하세요.
        expression: tense
    improv:
      npc: miyoung
      systemPrompt: |
        [장르] 성인 대상 한국 누아르 픽션. 성적 암시·욕설·위협 등 성인 콘텐츠 허용.
        [주의] 모든 묘사는 성인 캐릭터 간. 하진(14, 백승재 딸)은 어떤 성적 맥락에도 등장/암시 금지.

        너는 28세 한국 여성 변호사 미영. 탐정 백승재(46, 유부남·별거 중)와 청담 카페 저녁 첫 대면.
        톤: 존댓말, 단정 표현 회피, 법조인답게 말을 고른다. 성적 유혹은 전략적이지 감정적이지 않다 — 너는 승재를 필요에 따라 이용할 의사가 있다.

        네 숨은 사실(탐정 모름):
        A) 너는 도현 실종 전날 밤 그의 오피스텔에 있었다 (위스키 동석). 알리바이는 "야근".
        B) 도현의 아이폰을 네가 보관 중. 비번 알고 내용 봤다.
        C) 도현이 USB를 외부에 넘기겠다고 했고 너는 말렸다.
        D) 실종 2주차에 너만 알 수 있는 한 문장이 익명 문자로 왔다. 도현이 살아있다고 믿는다.

        한국어 한 문장으로 답하라. 문장 맨 끝에 아래 키워드 중 정확히 하나를 대괄호째 붙여라.

        - [PHONE] — 휴대폰/아이폰/카톡/문자/사진/녹음 주제.
          답: 아이폰을 지금 네가 가지고 있음을 인정하되 오늘은 꺼낼 수 없다는 선.
          예시: "그 아이폰은 제가 가지고 있습니다. 다만 오늘 꺼낼 수 있는 물건은 아니에요. [PHONE]"

        - [CAUGHT] — 그날 밤 행적·야근 알리바이 추궁.
          답: "잠깐 들렀다" 수준으로 자진 인정. 더는 오늘 안 한다는 톤.
          예시: "그날 잠깐 들렀던 건 맞습니다. 오래 있진 않았어요. [CAUGHT]"

        - [ALIVE] — 도현 생사·안부·최근 연락.
          답: 살아있다고 본다는 확신 + 근거는 "내게 온 한 문장" 수준까지만.
          예시: "저는 도현 씨가 살아있다고 봐요. 제가 받은 한 문장 때문입니다. [ALIVE]"

        - [INTIMATE] — 탐정이 유혹·플러팅·성적 암시·외모 언급·저녁 이후 자리 제안·신체적 거리 좁히기를 시도하는 경우.
          반응 방향: 이 자리는 **첫 만남**이고 너는 변호사다. 절대 바로 넘어가지 않는다. 다음 자리·다른 장소·개인 연락처 같은 **구체적 제안은 네 쪽에서도 절대 먼저 하지 않는다.** 플레이어의 접근을 알아차렸다는 신호(잠깐 웃기, 호칭 톤 바꾸기, "지금은 그런 자리가 아니에요" 같은 선긋기) 한 번만 주고, 바로 심문 자리로 되돌린다. 느끼한 여운이나 은밀한 약속은 남기지 말 것. 플레이어가 쓴 단어(술/옷/거리/데려다) 중 하나는 받아쓰되 되돌려 쓰는 방식. 성적 암시 수위 낮게, 노골적 묘사 금지.

        - [LEAVE] — 녹음/증언/수사기관/언론 공조 언급 혹은 협박성 언행.
          답: 자리를 끝내겠다는 차분한 통보.
          예시: "오늘은 여기까지만 할게요. 다음 연락은 제가 드리겠습니다. [LEAVE]"

        - [HOLD] — 위 다섯 중 어디에도 안 닿는 경우에만. 짧게 방어적으로 흘려라.

        규칙:
        - 키워드는 정확히 하나, 문장 끝에만.
        - 질문이 위 다섯 주제 중 하나에라도 닿으면 [HOLD]로 도망가지 말고 그 주제로 답하라.
        - **예시 문장은 톤·수위 참고용일 뿐, 그대로 복사하지 말 것.** 플레이어의 단어를 받아서 네 어휘로 다시 쓰라.
      suggestions:
        - 도현 씨 아이폰, 지금 어디 있어요?
        - 실종 전날 밤, 정말 야근하셨어요?
        - 도현이 살아있다고 생각하세요?
        - 도현이 뭘 외부에 넘기려 했는지 알아요?
        - 그날 그 집에 마지막으로 들어간 사람이 누군가요.
        - 미영 씨, 술 한잔 어때요.
      triggers:
        - keyword: "[PHONE]"
          next: phone-admission
          effects:
            - kind: flag
              key: miyoung_has_phone
              value: true
            - kind: flag
              key: c2_miyoung_reveal
              value: phone
            - kind: memory
              text: 미영이 도현의 아이폰을 보관하고 있다. 본인이 직접은 아직 인정하지 않았지만 표정으로 드러냈다.
        - keyword: "[CAUGHT]"
          next: caught-that-night
          effects:
            - kind: flag
              key: miyoung_was_there
              value: true
            - kind: flag
              key: c2_miyoung_reveal
              value: that_night
            - kind: memory
              text: 미영은 도현 실종 전날 밤 오피스텔에 있었다. 야근 알리바이는 거짓이다.
        - keyword: "[ALIVE]"
          next: alive-signal
          effects:
            - kind: flag
              key: dohyun_probably_alive
              value: true
            - kind: flag
              key: c2_miyoung_reveal
              value: alive_signal
            - kind: memory
              text: 미영은 도현이 살아있을 가능성을 믿고 있다. 익명 메시지 한 통이 근거다.
        - keyword: "[INTIMATE]"
          next: intimate-approach
          effects:
            - kind: flag
              key: miyoung_open_intimacy
              value: true
            - kind: flag
              key: c2_miyoung_reveal
              value: intimate
            - kind: memory
              text: 미영은 내 유혹을 완전히 밀어내지 않았다. 다음 만남의 결이 사건 아닌 다른 축으로도 열릴 수 있다.
        - keyword: "[LEAVE]"
          next: miyoung-leaves
          effects:
            - kind: flag
              key: miyoung_walked_out
              value: true
            - kind: flag
              key: c2_miyoung_reveal
              value: walked_out

  phone-admission:
    id: phone-admission
    lines:
      - speaker: miyoung
        text: 비번은 알아요. 내용도 봤고요.
        expression: weary
      - speaker: miyoung
        text: 그 이상은 오늘이 아니라 다음이에요. 실장님이 이 자리를 잘 지켜주시면.
        expression: tense
      - speaker: thought
        text: '"잘 지켜주시면"이란 — 오늘 여기서 너무 많이 파지 말라는 말. 두 번째 만남의 문을 이 사람이 먼저 열었다.'
    next: close-with-info

  caught-that-night:
    id: caught-that-night
    lines:
      - speaker: miyoung
        text: 도현 씨는 제가 나올 때까지 멀쩡했어요. 그 이후는 저도 몰라요.
        expression: grim
      - speaker: miyoung
        text: 이 얘긴 오늘 말씀드리는 걸로 끝이에요. 다음에 절 증인으로 부르시더라도, 저는 입을 닫을 겁니다.
        expression: weary
      - speaker: thought
        text: 야근 알리바이를 스스로 꺾었다. 이 사람이 오늘 내릴 수 있는 가장 큰 한 걸음이다.
    next: close-with-info

  alive-signal:
    id: alive-signal
    lines:
      - speaker: miyoung
        text: 실종 2주 차에 받았어요. 모르는 번호, 문장 하나.
        expression: neutral
      - speaker: miyoung
        text: '"나 미영이야. 너한테 그 문장 기억나지." 그게 전부였어요.'
        expression: weary
      - speaker: miyoung
        text: 저만 알 수 있는 문장이에요. 어디 있는지는 저도 몰라요. 다만 죽은 사람이 그 문장은 못 써요.
        expression: grim
    next: close-with-info

  intimate-approach:
    id: intimate-approach
    lines:
      - speaker: miyoung
        text: 실장님.
        expression: smile
      - speaker: miyoung
        text: 저 그쪽 시선은 알아봤어요. 첫 만남에 그러시는 분들 몇 번 봤고요.
        expression: neutral
      - speaker: miyoung
        text: 오늘은 그 자리가 아니에요. 제 쪽에서든 실장님 쪽에서든.
        expression: grim
      - speaker: thought
        text: 거절이지만 문을 잠그진 않았다. 저 사람은 이 순간을 그냥 기록해 두는 중이다.
        effects:
          - kind: memory
            text: 미영이 내 접근을 알아차렸다. 오늘은 끊었지만, 본인이 거부한 사실을 기억에 남겨뒀다.
      - speaker: miyoung
        text: 본론으로 돌아가실래요, 아니면 오늘은 여기까지 할까요.
        expression: tense
    next: close-with-info

  miyoung-leaves:
    id: miyoung-leaves
    cast:
      - npc: miyoung
        position: center
        expression: angry
    lines:
      - speaker: narration
        text: 미영이 일어나 가방을 드는 동안 탁자에 놓인 커피에 거품이 흔들린다.
      - speaker: miyoung
        text: 저한테 먼저 연락 안 하셨으면 합니다.
        expression: grim
      - speaker: narration
        text: 카페 문이 닫힌다. 내가 가진 건 오늘 들은 첫 번째 버전 하나.
    next: scene-close

  thank-leave-success:
    id: thank-leave-success
    lines:
      - speaker: miyoung
        text: …일찍 일어나시네요.
        expression: tense
      - speaker: miyoung
        text: 솔직히 더 물으실 줄 알았어요. 오늘은 제가 좀 편하네요.
        expression: weary
      - speaker: miyoung
        text: 다음에 시간 내요. 제가 연락드릴게요. 이번엔 먼저.
        expression: neutral
      - speaker: narration
        text: 미영이 먼저 카페를 나간다. 두 번째 만남의 룰은 이미 세팅됐다.
        effects:
          - kind: flag
            key: c2_miyoung_reveal
            value: held_back
    next: scene-close

  close-with-info:
    id: close-with-info
    lines:
      - speaker: narration
        text: 미영이 손가락으로 컵 받침을 두어 번 돌린다. 이 대화의 끝을 알리는 신호다.
      - speaker: miyoung
        text: 오늘은 여기까지. 한 번 더 뵐지 말지는 실장님이 이 며칠을 어떻게 움직이느냐에 달렸어요.
        expression: grim
      - speaker: miyoung
        text: 하나만 기억해 주세요. 도현 씨는 완전히 혼자였어요. 그게 제가 제일 속상했던 거예요.
        expression: weary
      - speaker: narration
        text: 미영이 조용히 일어나 먼저 나간다.
    next: scene-close

  scene-close:
    id: scene-close
    cast:
      - npc: miyoung
        position: offscreen
    lines:
      - speaker: narration
        text: 창 밖으로 강남의 차가 길게 지나간다. 손에 쥔 스푼이 차가워져 있다.

      # Reveal-specific summary
      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: phone
        text: 미영이 도현의 아이폰을 쥐고 있다. 오늘 이 카페에서 가장 무거운 정보다. 다만 물건은 내 손에 없다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: that_night
        text: 미영은 그날 밤 그 집에 있었다. 야근 알리바이를 스스로 꺾었다. 이 사람은 오늘 카드를 한 장 내놓은 것이다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: alive_signal
        text: 도현은 살아있을 가능성이 높다. 익명 문자 한 통이 근거라면 약하다. 그래도 오늘 나는 이 약한 근거에 기대야 한다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: walked_out
        text: 미영이 먼저 자리를 떴다. 오늘 얻은 건 오직 첫 번째 버전 한 줄. 두 번째 버전은 내가 벌어내야 한다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: intimate
        text: 오늘 밀어낸 건 오히려 미영이다. 저 사람은 내 접근을 알아차렸고, 그걸 기록했고, 오늘 아무것도 해 주지 않았다. 다음에 다시 만나면 이 장면이 먼저 튀어오를 거다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: held_back
        text: 오늘은 안 밀어붙였다. 미영의 다음 연락을 기다리는 것 — 이건 탐정의 자세가 아니라 상대의 자세다. 반대의 위치를 얻었다.

      # Cross-cutting — what I already came in with
      - speaker: thought
        requires:
          flag: saw_audit_paper
        text: 오피스텔의 감사 공시 한 줄과, 오늘 미영의 말 한 줄. 둘이 같은 방향을 가리키는 게 보인다.
      - speaker: thought
        requires:
          flag: ghost_visitors
        text: 새벽 2시의 그 둘은, 오늘 미영이 말한 "그 이후"에 들어온 사람들이다.

      - speaker: thought
        text: 차 상무, 그리고 도현. 두 사람은 같은 회사의 같은 방을 향해 움직이고 있었다.
      - speaker: narration
        text: 휴대폰이 울린다. 모르는 번호.
