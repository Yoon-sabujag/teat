---
# 캐릭터 비주얼 바이블.
# Replicate(Flux Kontext) 또는 다른 이미지 생성 파이프라인에서 "같은 인물"을
# 여러 장에 걸쳐 유지하기 위한 고정 기술서. 표정·의상 변화는 최소한으로,
# 얼굴 구조·골격·머리 스타일·기본 의상 팔레트는 전역 고정이다.
#
# 각 항목의 필드:
#   age            : 연령
#   build          : 체형 한 줄
#   face           : 얼굴 구조·머리 스타일·눈·특징 한두 문장
#   outfit_default : 중립 표정·전신 레퍼런스에 입히는 기본 의상
#   outfit_notes   : 씬·시간대에 따라 바뀌어도 되는 의상 변주 한 줄
#   palette        : 인물 주변 색감 (의상 기준)
#   mood           : 카메라 한 장에 묻어나야 할 분위기 형용사 세트
#   notes          : 기타 연출 지시 (렌즈 길이, 조명, 배경 흐림 정도 등)
#
# 표정 매트릭스는 파일 아래 expressions_prompts 참조.
# 생성 순서:
#   1) age/build/face/outfit_default 로 중립 표정 1장 생성 (레퍼런스)
#   2) Flux Kontext 의 edit 모드에 그 레퍼런스 + expressions_prompts[k] 를
#      입력해 8종 확보
#   3) public/characters/<id>/<expression>.webp 로 저장

characters:
  seungjae:
    age: 46
    build: 170대 중후반, 어깨가 살짝 굽어 가는 회사원 체형. 배는 나왔지만 아직 양복 한 벌은 받친다.
    face: 이마가 살짝 넓고, 관자놀이 위쪽에 흰머리가 섞이기 시작. 짧은 사이드·길게 올린 앞머리의 전형적인 중년 한국 남자 컷. 눈 밑 다크서클이 짙고 눈매는 피로해 보이지만 칼끝이 살아 있다.
    outfit_default: 다크 네이비 투버튼 싱글 수트, 하늘색 셔츠, 무광 다크 그레이 타이. 셔츠 소매가 1 cm쯤 삐져나와 있다.
    outfit_notes: 을지로 사무실에서는 넥타이 풀고 셔츠 단추 한 개 풀림. 카페 아침 씬에서는 셔츠 + 슬림 코트.
    palette: 네이비 · 아이보리 · 그레이. 따뜻한 색은 피한다.
    mood: 피로 / 냉정 / 계산 / 묵힌 분노
    notes: 85mm 인물 샷, 좌우로 약간 기운 삼점광, 배경 흐림, 소품으로 종이 결재판·USB·만년필 어울림.

  cha-sangmu:
    age: 54
    build: 또래 남성 평균보다 한 치 크고 살짝 마른 편. 자세는 곧다.
    face: 회색 머리가 절반 이상, 기름기 없이 뒤로 정돈. 가느다란 은테 안경. 눈매는 부드럽지만 웃을 때 눈 아래 주름이 거의 없다.
    outfit_default: 검은 캐시미어 재킷 위에 차콜 그레이 쓰리피스, 흰 셔츠, 버건디 패턴 타이. 왼손 약지에 플래티넘 결혼반지.
    outfit_notes: 회사 임원실·카페 아침 씬 공통으로 코트를 항상 의자 옆 빈 의자에 개어 놓는다.
    palette: 챠콜 · 검정 · 버건디. 금속류는 은색으로만.
    mood: 품위 / 계산 / 잠깐씩 비치는 피로 / 매너 뒤의 칼
    notes: 50-85mm 인물 샷, 측광 선호. 피부톤은 차갑게, 배경은 검은 그라디언트로 자주 뽑힘.

  kim-sunggi:
    age: 62
    build: 키 크고 당당하지만 요즘은 어깨 한쪽이 살짝 내려앉음. 과거 골프 체형이 남아 있다.
    face: 은백색 머리 완전히 백발에 가까움. 얼굴 골격이 각지고 턱선이 아직 분명. 웃으면 눈이 거의 사라지는 초승달 모양.
    outfit_default: 베이지 캐시미어 가디건 안에 화이트 드레스 셔츠, 다크 네이비 울 트라우저. 분당 쪽 자택 응접실에서 자주 입는 평상복.
    outfit_notes: 공적 자리에서는 쓰리피스 + 타이 없음. 넥타이 없이 셔츠 단추 하나 풀어 여유를 일부러 노출.
    palette: 베이지 · 크림 · 네이비. 액세서리는 금색 (시계 파텍 계열).
    mood: 여유 / 부드러운 압박 / 옅은 피로 / 잘 감춘 불안
    notes: 실내 자연광 씬 선호, 창 쪽 반역광. 소품은 책장·파일철·위스키 잔 어울림.

  miyoung:
    age: 28
    build: 160대 중반, 마른 편. 어깨가 좁고 목이 길다.
    face: 단발에 가까운 블랙 헤어를 한쪽으로 넘김. 쌍꺼풀 없는 길쭉한 눈, 무표정일 때도 입꼬리 한쪽이 미세하게 올라가 있다. 안경은 쓰지 않음.
    outfit_default: 블랙 씬 울 터틀넥 위에 라이트 그레이 테일러드 재킷, 무광 블랙 슬랙스. 플랫 옥스포드 구두.
    outfit_notes: 카페 씬에서 재킷은 의자 등받이 대신 본인 옆 좌석 위에 개어 둠. 가방은 로펌 가죽 브리프. 결혼반지는 하지 않는다.
    palette: 차가운 회색 · 검정 · 화이트. 액세서리는 은색 얇은 체인 한 줄만.
    mood: 침착 / 측정 / 경계 / 한 번씩 드러나는 피곤
    notes: 인물 샷은 중거리, 렌즈 살짝 압축. 주변광 균일하게. 아이폰이 테이블 위에 엎어져 있는 소품 자주 등장.

  soo-yeon:
    age: 35
    build: 165cm 전후, 골반보다 어깨가 더 나간 기자 체형. 전반적으로 단단하다.
    face: 단발 숏컷 한쪽으로 쓸어 넘김. 눈썹 굵고 짙음. 다크 서클 옅게. 립은 버건디 한 톤.
    outfit_default: 블랙 티셔츠 위에 카키 필드 재킷, 스키니 블랙 진, 컴뱃 워커. 주간지 기자의 현장용 세트.
    outfit_notes: OB 노포 씬에서는 재킷 벗고 티만. 담뱃갑(에쎄 수)과 취재 수첩은 항상 탁자 위.
    palette: 카키 · 블랙 · 머스타드. 금속류는 신발 버클과 벨트 버클 정도.
    mood: 냉소 / 지식 / 도발 / 피곤 속의 집요함
    notes: 조명은 저광량, 노포 형광등 색감 혼합. 카메라 위치는 테이블 너머 마주 앉는 각도.

  jaemin:
    age: 32
    build: 짧은 다리 + 어깨만 넓음의 불균형한 체형. 걸을 때 약간 벌어진 자세.
    face: 블랙 쇼트 헤어, 옆은 짧고 위는 살짝 세워 띄움. 턱에 옅은 수염 그림자. 입꼬리가 기본적으로 한쪽만 올라간 장난끼.
    outfit_default: 네이비 맥 재킷 + 가죽 패치, 그레이 기모 후드, 블랙 슬림 팬츠, 닳은 스니커즈. 손목엔 전자식 러닝 워치.
    outfit_notes: 한여름엔 셔츠 오픈 + 골드 가짜 체인. 가을·겨울엔 맥 재킷 고정.
    palette: 네이비 · 회색 · 어두운 녹색. 금속은 실버/페이크 골드 섞임.
    mood: 헐렁함 / 넉살 / 결정적 순간의 정직 / 약간의 졸음
    notes: 을지로 뒷골목 간접광 어울림. 소품으로 저렴한 에너지드링크 캔, 접는 자전거.

  junhyuk:
    age: 29
    build: 키 175 전후, 마른 편. 헬스 초심자 티가 약간 나지만 체력은 모자람.
    face: 살짝 곱슬기 있는 갈색 기 섞인 머리. 눈이 둥근 편, 말을 하기 직전에 눈이 빠르게 한 번 깜빡인다.
    outfit_default: 증권맨 기본 — 차콜 수트, 화이트 셔츠, 스트라이프 블루 타이, 광 나는 옥스포드.
    outfit_notes: 근무 외 늦은 밤 씬에선 재킷 벗고 셔츠 소매 걷음. 조금 흐트러진 상태.
    palette: 차콜 · 블루 · 화이트. 액세서리는 오피셜한 손목시계 하나.
    mood: 불안 / 허세 / 겁 / 친구에 대한 죄책감
    notes: 여의도·강남역 라인 배경 어울림. 밤 씬에선 네온 블루 백라이트 선호.

  wonjang:
    age: 68
    build: 170cm 전후, 마른 체형이지만 손이 크다. 곧은 자세.
    face: 까까머리(승려 삭발), 하얀 눈썹, 깊은 이마 주름 세 줄. 눈은 작지만 눈빛이 고요.
    outfit_default: 회색 승복 상의, 짙은 회색 바지, 낡은 고무신. 손목엔 염주.
    outfit_notes: 마당 평상 씬에서는 승복 위에 거친 면 조끼 덧입음. 겨울엔 누비 조끼.
    palette: 회색 · 올리브 · 갈색. 차가운 색 없음.
    mood: 침묵 / 담담 / 관조 / 한 번씩 드러나는 인간적 피로
    notes: 자연광 순광. 소품으로 곶감 접시, 작은 궤짝, 은행나무 이파리.

  dohyun:
    age: 28
    build: 180cm 전후, 마른 편이지만 어깨 라인 깔끔. 재벌가 3세의 체형.
    face: 다크 브라운 헤어 단정히 올림. 긴 속눈썹, 단단한 턱선. 무표정일 때도 눈매가 살짝 젖어 있어 보인다.
    outfit_default: 6장까지는 직접 등장 없음. 8장에서 — 흰 리넨 셔츠, 베이지 면바지, 맨발 샌들 (남쪽 섬 은신 톤).
    outfit_notes: 5년 전 회상 씬에서는 수트, 녹음실 씬에서는 그레이 후드. 녹음기와 USB가 소품.
    palette: 아이보리 · 크림 · 베이지. 전반적으로 밝고 따뜻.
    mood: 지친 결단 / 회한 / 한 번씩의 안도
    notes: 남해안 섬 배경이면 자연광 + 얕은 해무. 녹음실 씬이면 암실 + 라인으로 빛 한 줄.

  hajin:
    age: 14
    build: 중학교 2학년 여학생 평균. 최근 한 해 키 많이 큼.
    face: 단정한 어깨 길이 단발, 앞머리 없음. 큰 눈, 무표정일 때 살짝 뚱한 기본형.
    outfit_default: 본 게임 내에서는 직접 등장 씬 없음 (카카오톡 UI 내에서만 아바타/이름표). 아바타는 강아지 실루엣 혹은 중학생 일러스트풍 썸네일.
    outfit_notes: 프로필 변경 묘사(9장)용으로 "검은 배경 + 하얀 점 한 개" 예비 아바타 1장.
    palette: 연한 파스텔 그레이. 채도 낮게.
    mood: 조용 / 어린아이 자리와 어른 자리 사이
    notes: |
      ** 규칙: 어떤 형태의 성적·성적 유사 맥락에도 이미지를 배치하지 않는다 (미성년). **
      현 단계에서 하진의 인물 이미지는 생성하지 않는다. 필요한 건 프로필 썸네일 1-2장뿐.

# ── 표정 매트릭스 ────────────────────────────────────────
# 각 표정은 해당 인물의 face/outfit_default 레퍼런스에서 edit-mode로 출력.
# 문장 끝의 "{name}" 은 해당 인물의 이름/별칭으로 치환해서 프롬프트 합성.

expressions_prompts:
  neutral: "{name} 인물 중립 표정, 카메라 직시, 입 다물고 눈빛은 평온, 긴장 0"
  smile: "{name} 인물 옅은 업무용 미소, 입꼬리 한쪽만 약간 올라감, 눈은 따라 웃지 않음"
  tense: "{name} 인물 턱에 미세한 힘, 입 다묾, 한쪽 눈꺼풀 반 박자 느리게 깜빡임"
  weary: "{name} 인물 피곤함, 어깨 한 치 내려감, 눈 밑 다크서클 선명, 고개 한쪽으로 살짝 기울"
  angry: "{name} 인물 억누른 분노, 광대 근육 잡힘, 입 다묾 강함, 눈 한 박자 고정"
  shock: "{name} 인물 짧은 놀람, 눈 크게 떠짐, 숨 반 박자 멎음, 입은 살짝 벌어짐"
  grim: "{name} 인물 어두운 각오, 미간 한 줄, 입꼬리 평평, 시선 먼 곳 한 점"
  amused: "{name} 인물 비웃음 섞인 옅은 흥미, 한쪽 입꼬리만 올라감, 눈썹 한쪽 반 뼘 올라감"

# ── 배경 프롬프트 ────────────────────────────────────────
# 1440x2560 세로. 풀 샷. 인물 없는 로케이션.

backgrounds:
  office-exec: "광화문 오피스 빌딩 임원실, 저녁 일곱 시 이후, 블라인드 사이로 주황 가로등 한 줄, 책상 위 결재판과 봉투, 차가운 형광등 + 창밖 따뜻한 대비, 건축 잡지 인테리어"
  euljiro-office: "을지로 3가 오래된 상가 빌딩 7층 사무실, 나무 책상 한 개, 회전의자, 블라인드 닫힌 창, 형광등 한 개 노란빛, 먼지 떠 있는 공기"
  gwanghwamun-vip: "광화문 본사 VIP 상담실, 넓은 원탁, 가죽 의자 여섯, 차콜 톤 인테리어, 벽 한쪽에 그룹 창립자 초상화 한 점, 조명 낮게"
  dohyun-officetel: "강남 오피스텔 거실, 모던 미니멀, 흰 벽 + 오크 가구, 창밖 강남대로 밤 조명, 재벌 3세의 깔끔하지만 비어있는 공간"
  cheongdam-cafe: "청담 사거리 로펌 지하 카페, 어둡고 좁은 공간, 구리 조명 스팟, 벽엔 재즈 LP 포스터, 저녁 여덟 시 직후"
  bukhansan-amja: "북한산 능선 뒤쪽 작은 암자 마당, 늦가을 초저녁, 은행나무 한 그루, 낡은 기와 지붕, 평상 한 개, 고무신 두 켤레"
  eulji-ob: "을지로 3가 노포 OB맥주집 내부, 녹색 병뚜껑 탑 쌓인 탁자, 연탄불 위 돼지껍데기, 형광등 덜컹, 회식 2차 분위기"
  euljiro-night-alley: "을지로 뒷골목 자정, 주황 가로등, 간판 불빛 한두 개 꺼짐, 젖은 아스팔트, 전봇대 위 김이 올라오는 삼겹살집"
  jugangji-backlot: "시사주간지 편집국 뒷문 주차장, 이른 아침 아홉 시, 회색 시멘트 벽, 취재 차량 두 대, 흐린 하늘"
