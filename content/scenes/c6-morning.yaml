id: c6-morning
title: "복제본"
background: euljiro-office
cast: []
entry: morning-beat

nodes:
  morning-beat:
    id: morning-beat
    lines:
      - speaker: narration
        text: 아침 일곱 시. 을지로 7층 창 블라인드 사이로 들어오는 햇빛은 아직 겨울 낮의 낮은 각도였고, 사무실 바닥의 찬 기운이 양복 바지 끝단까지 한 번 타고 올라왔다. 책상 위엔 어제 밤 정리해 둔 커피컵 그대로. 포트의 물은 어제 저녁 받아둔 그 물 그대로.
      - speaker: narration
        requires:
          flag: followed_to_office
        text: 블라인드 틈으로 건너편 공영주차장 입구를 살폈다. 어젯밤 그 차는 사라졌다. 대신 그 자리에 회사 배송 차량 두 대가 나란히 들어와 있었고, 경비실 불빛이 한 번 깜빡였다. 같은 번호판의 다른 차가 이 골목 어디쯤에 아침 교대조로 자리를 옮겼을 뿐이라는 계산이 먼저 섰다.
      - speaker: narration
        requires:
          flagNotEquals:
            key: followed_to_office
            value: true
        text: 블라인드 틈으로 건너편 골목을 살폈다. 어제 저녁과 같은 톤의 조용함이 그대로였다. 인쇄 골목 쪽에서 첫 시동이 걸리는 트럭 한 대의 소리만 한 번 깔렸다.
      - speaker: thought
        text: 어제 저녁 이수연의 자리에서 올린 카드 무게가, 오늘 아침 이 창 바깥의 정적을 결정하고 있다. 내 쪽에서는 오늘 아침 안에 한 가지 태도를 정해 저 창 아래로 걸어 내려가야 한다.
    next: morning-route

  morning-route:
    id: morning-route
    lines:
      - speaker: thought
        requires:
          flag: tape_duplicated_plan
        text: 이수연이 어제 저녁에 잡아 준 시간표가 오늘 아침 가장 먼저 돌아가는 시계다. 아홉 시 정각, 주간지 편집국 뒷문 주차장. 엔지니어 한 명이 차 번호만 확인하고 통과시킨다.
      - speaker: thought
        requires:
          flag: got_tape
          flagNotEquals:
            key: tape_duplicated_plan
            value: true
        text: 녹음기는 내 쪽에 있지만, 오늘 아침 저 엔진이 돌아 줄 기자 쪽 라인은 어제 내가 걸지 않은 자리에 있다. 재생은 혼자 이 방에서 한 번 듣고 끝내는 쪽으로 간다.
      - speaker: thought
        requires:
          flagNotEquals:
            key: got_tape
            value: true
        text: 오늘 아침엔 틀 것이 없다. 어제 암자에서 못 받아 온 조각이 그대로 비어 있고, 그 빈자리 위에 혼자 앉아 한 번 더 가설을 정리해야 한다.
    choices:
      - id: go-engineer
        label: (주간지 뒷문으로 간다.)
        requires:
          flag: tape_duplicated_plan
        next: engineer-bay
      - id: play-solo
        label: (혼자 녹음기를 꺼내 재생한다.)
        requires:
          flag: got_tape
          flagNotEquals:
            key: tape_duplicated_plan
            value: true
        next: solo-playback
      - id: prep-without
        label: (틀 것 없는 아침을 있는 그대로 맞는다.)
        requires:
          flagNotEquals:
            key: got_tape
            value: true
        next: no-tape-morning

  engineer-bay:
    id: engineer-bay
    background: jugangji-backlot
    cast:
      - npc: soo-yeon
        position: right
        expression: neutral
    lines:
      - speaker: narration
        text: 주간지 편집국 건물 뒷문은 간판도 없이 일반 주택가 골목 안에 박혀 있었다. 차 번호만 확인하고 안쪽 지하 작업실로 들어간 엔지니어는 사십 대 초반의 남자로, 말없이 헤드폰 한 쌍을 내어 주고 녹음기를 받아 두 대의 작업 장비 사이에 꽂았다.
      - speaker: soo-yeon
        text: 복제본 두 개예요. 한 장은 실장님 손에 바로. 한 장은 저희 쪽 금고에. 원본은 지금 이 자리에서 한 번 들으시고 실장님이 다시 가져 가시는 거예요.
        expression: grim
      - speaker: soo-yeon
        text: 엔지니어는 내용 안 들어요. 파형만 봐요. 룰이 그래요.
        expression: amused
      - speaker: thought
        text: 오전 아홉 시 이 작업실의 공기는 어제 저녁 을지 OB 테이블 위 이수연의 얼굴과 똑같은 온도였다. 이 사람은 자기 규칙을 자기 쪽에서 먼저 지킨다는 걸, 오늘 아침 여기서 처음으로 내 눈으로 확인했다.
        effects:
          - kind: flag
            key: c6_route
            value: engineer
          - kind: memory
            text: 주간지 뒷문 지하 작업실. 이수연 쪽 복제본 두 개 제작 완료. 원본 내 손으로 복귀.
    next: playback

  solo-playback:
    id: solo-playback
    lines:
      - speaker: narration
        text: 사무실 문을 한 번 더 잠근 뒤 블라인드를 끝까지 내리고 책상 스탠드만 켰다. 녹음기를 꺼내 평평한 책상 위에 올렸고, 재생 버튼을 누르기 전에 호흡을 한 번 정리했다.
      - speaker: thought
        text: 오늘 이 방에서 듣는 이 오디오는 한 번 들은 사람이 반드시 한 번은 돌려 듣고 싶어지는 종류의 오디오다. 그 두 번째 재생은 오늘 안엔 없게 하기로, 첫 재생을 누르기 전에 먼저 결심해 두었다.
        effects:
          - kind: flag
            key: c6_route
            value: solo
          - kind: memory
            text: 사무실에서 혼자 녹음기 재생. 기자 쪽 체인 없음. 복제본 없음.
    next: playback

  no-tape-morning:
    id: no-tape-morning
    lines:
      - speaker: narration
        text: 재민이 열 시쯤 사무실 문을 한 번 두드리고 들어왔다. 상의는 어제 그대로였다. 주방 쪽에서 커피를 한 잔 타서 내 책상 위에 올려놓고는 본인 몫은 안 탔다.
      - speaker: jaemin
        text: 형, 오늘 진짜로 틀 게 없어도 저한테 말 한 마디 해 주시면 좋겠는데요. 제 쪽에서 오전 중에 붙여 드릴 수 있는 라인 한 두 개는 있어요.
        expression: tense
      - speaker: thought
        text: 녹음기 없는 아침은 아무것도 없는 아침이 아니다. 준혁이한테서 받은 한 문장, 미영이 놓고 간 세 개의 끈, 이수연이 건네 준 세 개의 이름 — 이 조각들이 녹음기 대신 책상 위에 얹혀 있다.
        effects:
          - kind: flag
            key: c6_route
            value: no_tape
          - kind: memory
            text: 녹음기 없이 맞은 아침. 이전 씬들의 조각 정리만으로 광화문으로 향한다.
      - speaker: jaemin
        text: 형, 조심히 다녀오세요. 오늘 형 밖에 나가시면 제가 여기 계속 붙어 있을게요.
        expression: weary
    next: decision

  playback:
    id: playback
    cast:
      - npc: dohyun
        position: center
        expression: grim
    lines:
      - speaker: narration
        text: 재생 버튼이 짧게 삐 소리를 한 번 내고는 도현의 목소리가 시작됐다. 톤은 침착했다. 책상 앞에 앉아 다섯 번쯤 녹화를 다시 한 사람의 침착함이 아니라, 그냥 처음부터 끝까지 이 자리에서 한 번에 녹음한 사람의 침착함이었다.
      - speaker: dohyun
        text: …백승재 실장님. 미영이한테 이 녹음기를 맡겼고, 미영이 아니라 실장님 손으로 이걸 여실 거라는 걸 저는 그 자리에선 몰랐습니다만, 지금 이 문장은 그 자리가 맞아 떨어진 뒤에 쓰는 문장이네요.
        expression: weary
      - speaker: dohyun
        text: 저는 그룹이 지난 오 년 동안 싱가포르 법인 한 개를 껴서 돌린 자금 라인을 알고 있습니다. 누적 규모는 천팔백억 원. 주체는 세 명입니다. 본사 감사실 책임자 오 감사. 지주 쪽 장 전무. 그리고 해외사업본부 차 상무.
        expression: grim
      - speaker: dohyun
        text: 위쪽은 장 전무입니다. 차 상무와 오 감사는 양쪽 날개고요. 세 사람 중 장 전무가 돈의 방향을 정하고, 오 감사가 회계 라인을 치우고, 차 상무가 바깥으로 보이지 않는 부분을 치웁니다.
        expression: grim
      - speaker: dohyun
        text: 이 라인이 바깥에 알려지면 제 쪽 자리가 어떻게 되는지는 제가 계산한 그대로일 겁니다. 그래서 이 녹음을 이 자리에 남깁니다. 제가 스스로 돌아 나가지 못하는 경우에 대비해서요.
        expression: weary
      - speaker: dohyun
        text: 백 실장님께. 두 달 전 실장님 자리를 비우게 한 그 서류 한 장이, 제가 이 녹음을 남기게 된 결정과 같은 책상 위에서 작성됐습니다. 실장님이 이 녹음을 듣고 계시다면, 그 한 가지 사실이 이 사건 전체를 한 줄로 묶어 줍니다.
        expression: grim
      - speaker: dohyun
        text: 마지막. 미영한테는 제가 돌아오겠다고 했습니다. 돌아올 수 있으면 그 한 문장 제가 직접 드릴 거고, 못 돌아오면 실장님이 한 번 대신 전해 주시면 고맙겠습니다. 녹음 여기서 끊겠습니다.
        expression: weary
        effects:
          - kind: flag
            key: heard_dohyun_recording
            value: true
          - kind: flag
            key: knew_three_names
            value: true
          - kind: flag
            key: knew_hierarchy
            value: true
          - kind: flag
            key: dohyun_hailed_me
            value: true
          - kind: flag
            key: dohyun_miyoung_message
            value: true
          - kind: memory
            text: 도현 녹음 청취 완료 — 싱가포르 SPC 1,800억, 장 전무 위/차 상무·오 감사 날개, 내 해고가 이 사건의 인쇄 시작점, 미영에게 돌아오겠다는 약속.
      - speaker: narration
        text: 녹음기가 짧게 한 번 더 삐 소리를 내고 정지했다. 방 안 공기의 온도가 재생 전과 정확히 같았지만, 그 온도 안에 앉아 있는 사람의 무게는 다른 온도가 됐다.
      - speaker: thought
        text: 두 달 전 내 퇴직 합의서와 오늘 아침 이 녹음이 같은 책상 위에서 인쇄됐다. 그 한 줄을 확인하기 위해 김승기가 나를 불렀고, 이수연이 내 옆에 섰고, 원장 스님이 이 녹음기를 사 주일이나 보관해 주셨다. 지금 이 사건의 주변 인물들이 사실은 전부 이 한 줄을 둘러싸고 앉아 있던 거다.
    next: decision

  decision:
    id: decision
    cast: []
    lines:
      - speaker: narration
        text: 광화문까지 차로 이십 분 정도. 혹시 붙는 차 있으면 십 분 더. 오늘 아침 차 상무 앞에 앉을 때 내가 어느 자세로 앉을지를, 이 방을 나가기 전에 한 번 정리해 둬야 한다.
      - speaker: thought
        requires:
          flag: heard_dohyun_recording
        text: 녹음이라는 카드가 오늘 내 코트 주머니 안에 있다. 그 카드를 오늘 꺼내 쓸지, 오늘은 숨겨 두고 다음 자리의 중량을 키울지가, 지금 가장 무거운 한 줄이다.
      - speaker: thought
        requires:
          flagNotEquals:
            key: heard_dohyun_recording
            value: true
        text: 녹음이라는 카드는 내 손에 없다. 내가 가진 건 조각들뿐이고, 그 조각들로 차 상무를 앉혀 놓는 건 카드 한 장 모자라는 판에 앉는 일이다. 그래도 오늘 이 자리는 피할 수 있는 자리가 아니다.
    choices:
      - id: decide-expose
        label: 이수연에게 라이브 피드를 연다. 카페 자리 내내 기자 쪽으로 오디오 보내기.
        requires:
          flag: tape_duplicated_plan
        next: depart
        effects:
          - kind: flag
            key: c6_decision
            value: expose
          - kind: memory
            text: 결정 — 차 상무 카페 자리 내내 이수연 쪽으로 라이브 피드. 오늘 카드를 공개 라인으로 배치.
      - id: decide-leverage
        label: 녹음을 카드로 쓰되 공개는 아직. 거래 제안 쪽으로 간다.
        requires:
          flag: heard_dohyun_recording
        next: depart
        effects:
          - kind: flag
            key: c6_decision
            value: leverage
          - kind: memory
            text: 결정 — 녹음을 공개하지 않고 거래 카드로 소지. 차 상무 앞에서 드러낼지 말지는 자리 안에서 결정.
      - id: decide-confront
        label: 녹음 얘기는 꺼내지 않는다. 정면으로 태도만 밀어붙인다.
        next: depart
        effects:
          - kind: flag
            key: c6_decision
            value: confront
          - kind: memory
            text: 결정 — 오늘 녹음 존재는 감춤. 조각들과 내 태도만으로 차 상무와 마주 앉는다.
      - id: decide-postpone
        label: 오늘은 보고만 받는 자세로 간다. 카드 공개는 다음 자리.
        next: depart
        effects:
          - kind: flag
            key: c6_decision
            value: postpone
          - kind: memory
            text: 결정 — 오늘 자리는 듣기 위주. 내 쪽 카드는 오늘 테이블 위에 올리지 않는다.

  depart:
    id: depart
    cast: []
    lines:
      - speaker: narration
        text: 코트를 걸쳤다. 옷 안쪽의 어느 주머니에 무엇이 들어 있는지, 나가기 직전에 한 번 더 손바닥으로 확인했다.
      - speaker: thought
        requires:
          flagEquals:
            key: c6_decision
            value: expose
        text: 라이브 피드. 오늘 이 한 줄은 내 쪽 결정이지만, 한번 밀어 놓으면 이수연 쪽 편집국과 내 쪽 오전이 같은 시간선 위에 앉는다. 오늘 오후엔 그룹 쪽이 반드시 이 사실을 알게 된다.
      - speaker: thought
        requires:
          flagEquals:
            key: c6_decision
            value: leverage
        text: 거래 카드. 오늘 이 자리에서 꺼낼지 말지를 차 상무의 첫 한 줄이 정해 줄 거다. 내 쪽에서 미리 정해 놓을 문제는 아니다.
      - speaker: thought
        requires:
          flagEquals:
            key: c6_decision
            value: confront
        text: 오늘 들고 가는 건 녹음이 아니라 내 자세 하나다. 조각 몇 개와, 두 달 동안 누적된 내 피로의 두께. 그 두 개로 그 사람의 웃음 뒤를 한 번 뚫어 본다.
      - speaker: thought
        requires:
          flagEquals:
            key: c6_decision
            value: postpone
        text: 오늘은 듣는 자세. 내가 덜 말하면 저 사람이 더 말한다. 그 원칙이 오늘처럼 상대 쪽 페이스가 깔린 자리에선 가장 덜 잃는 자세다.
      - speaker: narration
        text: 사무실 문을 잠갔다. 엘리베이터 대신 계단으로 1층까지 내려갔고, 빌딩 옆 골목에서 잠시 택시를 기다렸다. 겨울 햇빛이 반사판처럼 반대편 인쇄소 간판 위에 얹혀 있었고, 그 빛 아래 걸어가는 내 그림자는 내가 예전에 본 그림자들보다 한 뼘 짧아 보였다.
      - speaker: narration
        text: 광화문행 택시 한 대가 간판 옆에 정차했다. 문을 열고 앉으면서, 오늘 이 자리가 끝나는 시간이 아니라 어떤 자리로 끝나는지를 정해야 하는 순간이 몇 분 안에 있다는 사실을 다시 한 번 책상 위의 기억처럼 앞에 놓았다.
        effects:
          - kind: chapterComplete
            chapter: chapter-6
