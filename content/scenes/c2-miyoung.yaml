id: c2-miyoung
title: "변호사 미영"
background: cheongdam-cafe
cast:
  - npc: miyoung
    position: center
    expression: neutral
entry: arrive

nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 청담 사거리에서 한 블록 안쪽. 로펌들이 드나드는 건물 지하 한 칸을 쓰는 카페였다. 저녁 여덟 시 조금 지나, 창가 두 좌석에만 손님이 있었고, 재즈 기타 솔로가 볼륨을 낮춰 흘러나오고 있었다. 드립 커피 향이 입구에서 한 번, 안쪽 자리에서 한 번 더 결 다르게 번졌다.
      - speaker: narration
        text: 미영은 가장 안쪽 벽 쪽 좌석에 이미 자리 잡고 있었다. 얇은 블랙 니트 위에 밝은 회색 재킷 한 벌, 머리는 한쪽으로 단정하게 모여 있었다. 테이블 위엔 아메리카노 한 잔, 뒤집어 놓은 아이폰, 그리고 사건 번호가 적힌 것 같은 메모지 한 장이 법률 서류 가방 옆에 반듯하게 놓여 있었다.
      - speaker: miyoung
        text: 백 실장님. 앉으시죠.
        expression: neutral
      - speaker: miyoung
        text: 제가 먼저 한 가지만 정리하고 시작할게요. 이 대화는 기록되지 않는 자리입니다. 저는 녹음하지 않고요, 실장님도 안 하시는 걸로 전제하겠습니다.
        expression: tense
    choices:
      - id: agree
        label: 안 합니다. 제 원칙입니다.
        next: open-question
        effects:
          - kind: flag
            key: c2_miyoung_record
            value: principle
      - id: decline
        label: 상황에 따라 다릅니다. 지금은 안 합니다.
        check: { stat: yangsim, dc: 12 }
        success:
          next: open-question
          effects:
            - kind: memory
              text: 미영에게 녹음 여부에 대해 원칙 대신 상황 조건을 달았다. 미영은 경계심을 올렸다.
            - kind: flag
              key: miyoung_on_guard
              value: true
            - kind: flag
              key: c2_miyoung_record
              value: situational_honest
        failure:
          next: open-question
          effects:
            - kind: flag
              key: c2_miyoung_record
              value: situational_clumsy

  open-question:
    id: open-question
    lines:
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: principle
        text: 원칙이시라, 좋네요. 저도 그쪽이 일하기 편한 편이고요. 그럼 서로 보증 한 번씩 걸고 시작하는 걸로 할게요.
        expression: neutral
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: situational_honest
        text: 솔직한 답이시네요. 이 바닥에서 그 말씀 드리는 거 쉬운 건 아니죠. 저는 오히려 그게 더 편한 편이에요.
        expression: weary
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: situational_clumsy
        text: '"상황에 따라서." 저도 현장에서 자주 쓰는 표현이에요. 다만 저희 동종 업계에서 그 말씀은 방어가 절반쯤 섞여 들어간 표현으로 읽히는 편이고요.'
        expression: tense

      - speaker: miyoung
        text: 준혁이한테는 어디까지 들으셨어요.
        expression: tense
    choices:
      - id: honest
        label: 당신과 도현이 최근에 싸웠다. 도현이 뭘 하려고 했다. 거기까지.
        next: surface-truth
        effects:
          - kind: flag
            key: c2_miyoung_probe
            value: honest
      - id: downplay
        label: 별 얘기 없었습니다. 직접 듣는 게 나을 것 같아서요.
        check: { stat: gwonmo, dc: 12 }
        success:
          next: surface-truth
          effects:
            - kind: stat
              target: gwonmo
              delta: 1
            - kind: memory
              text: 준혁이 어디까지 말했는지 감추자 미영은 내가 생각보다 영리하다고 느꼈다.
            - kind: flag
              key: miyoung_respects
              value: true
            - kind: flag
              key: c2_miyoung_probe
              value: downplayed
        failure:
          next: surface-truth
          effects:
            - kind: flag
              key: c2_miyoung_probe
              value: downplay_missed

  surface-truth:
    id: surface-truth
    lines:
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: honest
        text: 그 정도로 솔직하게 깔아 주시는 분은 오랜만이네요. 그럼 저도 같은 수위로 한 번 돌려드릴게요.
        expression: neutral
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: downplayed
        text: …음. 준혁이가 실장님한테 어디까지 깔아 뒀는지 제가 먼저 확인을 못 한 상태이니까, 저는 한 박자 뒤에서 시작할게요.
        expression: weary
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: downplay_missed
        text: '"별 얘기 없었다"는 말은, 사실 준혁이랑은 잘 안 어울리는 태도예요. 걔가 한번 앉으면 최소 이십 분은 깔아 두고 가는 애거든요. 저 오늘 그 말 그대로 받지는 않겠습니다.'
        expression: tense

      - speaker: miyoung
        text: 그럼 제가 아는 만큼, 오늘 이 자리 기준으로 말씀드릴게요. 기록 전제라면 이 버전이 제가 드릴 수 있는 버전입니다.
        expression: weary
      - speaker: miyoung
        text: 도현 씨와 저는 양쪽 집안까지 간 사이였고, 최근 두어 달 동안 관계 정리 얘기가 오갔습니다. 깨끗하게 끝내자는 쪽으로요.
        expression: neutral
      - speaker: miyoung
        text: 실종 전날 저녁엔 사무실에서 야근했어요. 로펌 회의실 2호 예약 기록, 퇴근 카드키 로그, 같은 팀 파트너 세 분 증언까지 전부 남아 있고요.
        expression: tense
      - speaker: thought
        text: '"이 버전" 이라고 토씨 하나 꺼내면서 들어간 말이다. 다른 버전이 있다는 뜻이고, 그 다른 버전은 오늘 이 카페 의자 사이에 놓인 적이 없다는 뜻이다. 야근 알리바이도 너무 깨끗하게 정리돼 있다. 자기가 증언 라인까지 붙여 두는 건 법조인의 본능이기도 하지만, 그만큼 지울 필요가 있었다는 흔적이기도 하다.'
    choices:
      - id: press-on
        label: (더 물어봐야 한다)
        next: improv-node
      - id: thank-and-leave
        label: 오늘은 여기까지 듣겠습니다. 감사합니다.
        check: { stat: ttuksim, dc: 14 }
        success:
          next: thank-leave-success
          effects:
            - kind: flag
              key: held_back_with_miyoung
              value: true
            - kind: memory
              text: 미영에게 첫 만남을 일찍 끊었다. 두 번째 만남이 가능하도록 길을 남겼다.
        failure:
          next: improv-node

  improv-node:
    id: improv-node
    lines:
      - speaker: miyoung
        requires:
          flagNotEquals:
            key: miyoung_turn_taken
            value: true
        text: 더 물어보실 거죠. 편하게 하세요.
        expression: tense
      - speaker: miyoung
        requires:
          flag: miyoung_turn_taken
        text: 또 뭐 있으세요. 오늘 자리에서 나오는 질문은 오늘 자리에서 끝내는 걸로 하죠.
        expression: weary
    choices:
      - id: ask-phone
        label: 도현 씨 아이폰, 지금 어디 있어요?
        requires:
          flagNotEquals:
            key: asked_phone
            value: true
        next: phone-admission
        effects:
          - kind: flag
            key: miyoung_has_phone
            value: true
          - kind: flag
            key: asked_phone
            value: true
          - kind: flag
            key: miyoung_turn_taken
            value: true
          - kind: memory
            text: 미영이 도현의 아이폰을 보관하고 있다고 본인이 인정했다. 당장은 넘길 생각이 없다.
      - id: ask-alibi
        label: 실종 전날 밤, 정말 야근하셨습니까.
        requires:
          flagNotEquals:
            key: asked_alibi
            value: true
        next: caught-that-night
        effects:
          - kind: flag
            key: miyoung_was_there
            value: true
          - kind: flag
            key: asked_alibi
            value: true
          - kind: flag
            key: miyoung_turn_taken
            value: true
          - kind: memory
            text: 미영은 도현 실종 전날 밤 오피스텔에 있었다. 야근 알리바이는 본인이 직접 꺾었다.
      - id: ask-alive
        label: 도현이 살아있다고 생각하세요.
        requires:
          flagNotEquals:
            key: asked_alive
            value: true
        next: alive-signal
        effects:
          - kind: flag
            key: dohyun_probably_alive
            value: true
          - kind: flag
            key: asked_alive
            value: true
          - kind: flag
            key: miyoung_turn_taken
            value: true
          - kind: memory
            text: 미영은 도현이 살아있다고 본다. 실종 2주차에 본인에게 온 익명 문자 한 통이 근거.
      - id: ask-usb-plan
        label: 도현이 뭘 외부에 넘기려고 했는지 아십니까.
        requires:
          flagNotEquals:
            key: asked_usb
            value: true
        next: usb-disclosure
        effects:
          - kind: flag
            key: miyoung_knew_usb_plan
            value: true
          - kind: flag
            key: asked_usb
            value: true
          - kind: flag
            key: miyoung_turn_taken
            value: true
          - kind: memory
            text: 미영은 도현의 외부 유출 계획과 그 상대방 이름을 안다. 상대 이름은 오늘은 꺼내지 않는다.
      - id: end-politely
        label: (오늘은 여기까지 하겠다고 정중히 마무리한다.)
        next: close-with-info
        effects:
          - kind: flag
            key: ended_politely
            value: true
      - id: end-hard
        label: (의자를 한 번 더 끌어당기며) 오늘 끝까지 다 말씀하셔야겠는데요.
        check: { stat: gwonmo, dc: 14 }
        requires:
          flag: miyoung_turn_taken
        success:
          next: hard-push-success
          effects:
            - kind: flag
              key: pushed_hard_with_miyoung
              value: true
        failure:
          next: miyoung-leaves
          effects:
            - kind: flag
              key: miyoung_walked_out
              value: true

  phone-admission:
    id: phone-admission
    lines:
      - speaker: miyoung
        text: 비밀번호는 알아요. 잠금 해제까지 몇 번 했고, 최근 한 달 치 대화는 어느 정도 훑어봤어요.
        expression: weary
      - speaker: miyoung
        text: 그 이상은 오늘 이 자리가 아니라 다음 자리예요. 조건은 한 가지, 실장님이 오늘 이 카페에서 이 대화의 결을 잘 지켜 주시는 것.
        expression: tense
      - speaker: thought
        text: '"잘 지켜 주시면"이라는 표현을 저 사람이 바로 꺼낸 건, 오늘 여기서 더 파 들어오지 말라는 공식 경고다. 동시에 두 번째 자리를 본인 쪽에서 먼저 열어 주는 말이기도 했다. 이 두 가지가 한 문장 안에 같이 있는 법조인의 화법이 낯설지 않았다.'
      - speaker: miyoung
        text: 다른 것도 있으세요.
        expression: neutral
    next: improv-node

  caught-that-night:
    id: caught-that-night
    lines:
      - speaker: miyoung
        text: …도현 씨는 제가 그 방에서 나갈 때까지는 멀쩡했어요. 그 이후에 대해서는 저도 정말 모릅니다.
        expression: grim
      - speaker: miyoung
        text: 이 얘기는 오늘 이 자리에서만 하는 얘기예요. 훗날 저를 증언대에 세우셔도 저는 오늘 드린 이 한 문장만 남기고 입 다물 겁니다.
        expression: weary
      - speaker: thought
        text: 로펌 회의실 2호 예약, 카드키 로그, 파트너 세 명 증언까지 깔아 두었던 알리바이를 본인 손으로 한 번에 꺾었다. 이런 종류의 자백은 법조인이 하는 자백 중 가장 위험한 자백이고, 그래서 가장 계산된 자백이기도 하다.
      - speaker: miyoung
        text: 더 물으실 거 있으시면 지금 물으시는 게 편하실 거예요.
        expression: tense
    next: improv-node

  alive-signal:
    id: alive-signal
    lines:
      - speaker: miyoung
        text: 실종 2주 차쯤 받았어요. 저장 안 된 번호에서 문자 한 통. 사진도 이모티콘도 없이 문장 하나만이요.
        expression: neutral
      - speaker: miyoung
        text: '"나 미영이야. 너한테 그 문장 기억나지." 그게 전부였어요. 전후 맥락 한 줄 없이.'
        expression: weary
      - speaker: miyoung
        text: 그 문장은 저랑 도현 씨만 알 수 있는 문장이에요. 오 년쯤 전 어떤 자리에서 둘이 같이 지어낸 문장이고요. 도현 씨가 어디 있는지는 저도 모릅니다. 다만 죽은 사람이 그 문장은 못 씁니다.
        expression: grim
      - speaker: miyoung
        text: 더 물으실 거 남았으면 말씀하시죠. 이 자리, 저도 한 번에 끝내는 쪽이 낫습니다.
        expression: tense
    next: improv-node

  usb-disclosure:
    id: usb-disclosure
    lines:
      - speaker: miyoung
        text: 도현 씨가 뭘 바깥으로 꺼내려고 준비했는지는 제가 알아요. 어느 방향, 어느 규모까지는 저한테 풀어놓은 상태였고요.
        expression: weary
      - speaker: miyoung
        text: 다만 그 건의 상대방이 누구였는지, 그 이름은 오늘 이 자리에서는 드리지 않을 거예요. 한 번 꺼내면 실장님 쪽 무게추가 같이 얹힙니다.
        expression: tense
      - speaker: miyoung
        text: 그 무게를 드실 준비가 되셨는지를 저는 아직 확인 못 한 상태라서요. 확인이 끝나면, 그때 다시 이 얘기를 할 자리를 만들죠.
        expression: grim
      - speaker: thought
        text: 저 사람은 지금 내 준비 상태를 평가하고 있다. 평가 기준은 오늘 이 카페를 나간 이후 내가 며칠을 어떻게 움직이느냐일 거고, 그 며칠 동안 나는 저 사람의 다음 호출을 기다리는 쪽으로 밀려난다.
      - speaker: miyoung
        text: 다른 방향 질문 있으세요.
        expression: neutral
    next: improv-node

  hard-push-success:
    id: hard-push-success
    lines:
      - speaker: narration
        text: 의자를 한 뼘 앞으로 당기자 탁자 다리 한쪽이 카펫 위를 짧게 긁었다. 창가 자리의 커플이 잠깐 고개를 돌렸다 다시 자기 얘기로 돌아갔다. 미영은 눈을 깔지 않고 내 쪽을 한 박자 더 오래 응시했다.
      - speaker: miyoung
        text: …실장님, 오늘 이 자리 끝까지 갈 수 있는 체력 있으세요.
        expression: tense
      - speaker: miyoung
        text: 그러시면 저도 오늘은 한 번에 정리해 드리죠. 다만 정리한 내용은, 이 카페 문 닫고 나가는 순간부터 실장님 쪽 책임이에요.
        expression: grim
      - speaker: thought
        text: 이 사람이 방어를 푸는 이유는 내 압박이 통해서가 아니다. 오늘 자리에서 한 번에 털어내고 깨끗이 끊는 쪽이 본인한테 더 이득이라고 계산한 거다. 한 번에 다 가져가는 건 편한 일이지만, 그 정보의 무게도 한 번에 다 가져가는 거다.
        effects:
          - kind: flag
            key: miyoung_full_disclosure
            value: true
          - kind: memory
            text: 강하게 밀어붙여 미영이 남은 정보까지 이 자리에서 풀었다. 대신 이후의 움직임과 책임은 전부 내 쪽.
      - speaker: miyoung
        text: 나머지 물으실 거 있으세요. 오늘 자리에서만 드립니다.
        expression: weary
    next: improv-node

  miyoung-leaves:
    id: miyoung-leaves
    cast:
      - npc: miyoung
        position: center
        expression: angry
    lines:
      - speaker: narration
        text: 미영이 자리에서 일어나는 동작은 법정에서 방청석을 떠나는 변호사의 동작이었다. 법률 서류 가방 손잡이가 한 번 탁자 다리를 살짝 스쳤고, 마시다 만 아메리카노의 표면이 거품을 한 번 흔들었다.
      - speaker: miyoung
        text: 오늘 이후로는 제 쪽에서 연락드리겠습니다. 실장님께서 저한테 먼저 연락하시는 건, 앞으로 안 하시는 걸로 부탁드립니다.
        expression: grim
      - speaker: narration
        text: 카페 문이 닫히는 소리는 안쪽 재즈 피아노 한 마디 위로 겹쳐서 사라졌다. 탁자 위엔 결제 완료된 영수증 한 장과 미영이 남겨 둔 메모지 한 장. 메모지는 백지였다.
    next: scene-close

  thank-leave-success:
    id: thank-leave-success
    lines:
      - speaker: miyoung
        text: …일찍 일어나시네요.
        expression: tense
      - speaker: miyoung
        text: 솔직히 말씀드리면, 두세 번 정도 더 치고 들어오실 줄 알고 나왔어요. 오늘은 제가 생각보다 편한 자리로 끝난 거예요.
        expression: weary
      - speaker: miyoung
        text: 다음에 한 번 더 뵙죠. 자리는 제가 잡아 드리겠습니다. 이번엔 제 쪽에서 먼저.
        expression: neutral
      - speaker: narration
        text: 미영이 먼저 일어나 나갔다. 나간 자리에 아직 온기가 있는 잔 하나, 아이폰이 뒤집혀 놓인 자리 한 칸. 두 번째 만남의 룰을 오늘의 내 침묵이 반쯤 짜 주었다.
    next: scene-close

  close-with-info:
    id: close-with-info
    lines:
      - speaker: narration
        text: 미영이 컵 받침 가장자리를 두어 번 검지 끝으로 가볍게 돌렸다. 로펌 협상 테이블에서 파트너들이 자리를 마무리할 때 하는 버릇이었다. 한 번은 신호, 두 번째는 확정.
      - speaker: miyoung
        text: 오늘은 여기까지 할게요. 한 번 더 뵐지 말지는, 실장님이 앞으로 며칠을 어떻게 움직이시느냐에 달렸습니다.
        expression: grim
      - speaker: miyoung
        text: 하나만 기억해 주세요. 도현 씨는 완전히 혼자였어요. 그게 제가 제일 속상했던 거예요.
        expression: weary
      - speaker: narration
        text: 미영이 조용히 일어나 먼저 나간다.
    next: scene-close

  scene-close:
    id: scene-close
    cast:
      - npc: miyoung
        position: offscreen
    lines:
      - speaker: narration
        text: 창 밖으로 청담 사거리를 지나는 택시 행렬이 한 차례 길게 늘어졌다가 신호에 맞춰 다시 풀렸다. 탁자에 남겨진 잔 속 얼음은 이미 녹아 입구 쪽에 가느다란 물방울을 남겼고, 내 손에 쥐어 있던 스푼 자루가 어느 순간부터 차가워져 있었다.

      - speaker: thought
        requires:
          flag: miyoung_has_phone
        text: 도현이의 아이폰이 오늘 저녁 이 로펌 변호사 가방 안 어딘가에 들어 있었다. 이 카페에서 가장 무거운 정보가 오늘 내 손엔 오지 않고 저 사람의 손에 남았다. 다만 그게 내 손에 와야 할 시점이 언제인지, 그건 저 사람이 스스로 먼저 열어 둔 일정이다.

      - speaker: thought
        requires:
          flag: miyoung_was_there
        text: 로펌 야근 알리바이를 본인 손으로 꺾은 사람은 오늘 자리에서 큰 카드 한 장을 기꺼이 버렸다. 그런 자백은 계산 없이는 나오지 않는다. 저 카드의 다음 페이지에 무엇이 적혀 있는지, 그건 나에게 보여 주려고 오늘 버린 카드였다.

      - speaker: thought
        requires:
          flag: dohyun_probably_alive
        text: 도현이가 살아 있을 가능성이 오늘 저녁 소폭 올라갔다. 익명 문자 한 통이라는 근거는 법정에 못 서는 근거이지만, 이 방향으로 몇 걸음 더 나아갈 수 있는 방향타는 된다.

      - speaker: thought
        requires:
          flag: miyoung_knew_usb_plan
        text: 도현이가 준비했던 외부 유출 계획의 상대방 이름이 한 줄짜리 카드로 저 사람 쪽에 남았다. 그 카드를 꺼내 주는 조건이 앞으로 며칠간 내 움직임이라는 건, 오늘 이 자리의 진짜 무게가 오히려 나에게로 건너온 쪽이라는 뜻이기도 하다.

      - speaker: thought
        requires:
          flag: miyoung_full_disclosure
        text: 오늘 한 자리에서 미영이 남은 카드를 다 내놓게 만든 건 내 압박이라기보다 이 사람의 계산이었다. 정보는 한 뭉치로 건너왔고, 그 뭉치의 다음 수 하나하나가 내 쪽의 책임으로 같이 얹혔다.

      - speaker: thought
        requires:
          flag: miyoung_walked_out
        text: 미영이 먼저 일어났고, 남은 건 오늘 들은 것까지 한 장뿐이었다. 이 자리가 이렇게 끝난 건 내 쪽 잘못이라고 하기엔 애매했고, 저 사람 잘못이라고 하기엔 더 애매했다.

      - speaker: thought
        requires:
          flag: held_back_with_miyoung
        text: 오늘 나는 평소보다 이르게 손을 뗐다. 다음 연락을 저 사람이 먼저 잡아 주는 그림을 만들어 둔 셈이고, 이 그림에서 두 번째 자리의 주도권은 이 카페 의자와 함께 저 쪽에 남은 게 아니다.

      - speaker: thought
        requires:
          flag: saw_audit_paper
        text: 오피스텔 서랍 안 붉은 줄과, 오늘 저 사람이 한 번씩 한 박자씩 밀어 준 말들. 두 쪽이 같은 방향의 지도에 찍힌 두 핀이라는 건, 오늘 이 카페를 나가기 전에 이미 분명해졌다.
      - speaker: thought
        requires:
          flag: ghost_visitors
        text: 새벽 두 시의 그 둘은, 오늘 미영이가 조심스럽게 '그 이후' 라고 줄여서 말한 구간 안에 걸어 들어간 사람들이었다. 그들이 쥔 것과 미영이가 쥔 것이, 오늘 내 머릿속에서 처음으로 같은 파일 이름으로 정리됐다.

      - speaker: thought
        text: 차 상무, 그리고 도현. 두 사람이 향하고 있던 자리가 같은 회사의 같은 층, 같은 방이었다는 걸 부정하기엔 오늘 저녁이 이미 너무 길었다.
      - speaker: narration
        text: 코트 안주머니에서 휴대폰이 한 번 울리고 바로 끊겼다. 모르는 번호였고, 국번은 다시 02. 부재중 알림이 잠금 화면 위에 잠깐 떠 있다 사라졌다. 카페 바깥 골목에 대기 중인 택시 트렁크 쪽으로 빗방울이 한두 방울 떨어지기 시작했다.
        effects:
          - kind: chapterComplete
            chapter: chapter-2
