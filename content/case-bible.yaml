      - "도현이 자료 캐고 있다는 사실 (4월에 인지)."
      - "동생 오정훈이 도현 처리에 직접 손을 댔다는 사실."
    leverage_over_pc:
      - "백승재와 직접 만남 거의 없음. 7장에서 이름만 등장."

  oh_team_jang:
    name: 오정훈
    age: 35
    title: 대정그룹 본사 보안실장
    role_in_case: |
      형(오정태) 라인. 도현 실종 새벽 두 시 오피스텔 출입 사인 본인.
      도현 통영 안전가옥 운반·감시 라인 책임자. 미행 차량 운용 책임자.
    pc_intersection: |
