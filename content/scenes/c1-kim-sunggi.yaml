id: c1-kim-sunggi
title: "부회장의 부탁"
background: gwanghwamun-vip
cast:
  - npc: kim-sunggi
    position: center
    expression: neutral
entry: arrive

nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 광화문 본사. VIP 상담실은 임원실 층에서도 가장 안쪽에 있다.
      - speaker: narration
        text: 두 달 전 이 건물을 퇴근이라는 이름으로 나왔다. 다시 들어오는 기분이 이상하다.
      - speaker: kim-sunggi
        text: 어서 오세요, 백 실장님. 편히 앉으세요.
        expression: smile
      - speaker: kim-sunggi
        text: 커피요, 차요.
        expression: neutral
    choices:
      - id: coffee
        label: 커피로 부탁드립니다.
        next: setup
      - id: water
        label: 그냥 물 한 잔이면 충분합니다.
        check: { stat: gwonmo, dc: 11 }
        success:
          next: setup
          effects:
            - kind: stat
              target: gwonmo
              delta: 1
            - kind: memory
              text: 물을 달라고 하자 김승기는 잠깐 웃었다. 무엇이든 쉽게 받지 않는 사람이구나 하는 평가를 내린 것 같다.
        failure:
          next: setup

  setup:
    id: setup
    lines:
      - speaker: narration
        text: 비서가 조용히 커피와 물을 내려놓고 나간다.
      - speaker: kim-sunggi
        text: 실장님 일 그만두신 거, 저도 그룹 공식 메일로 보고받았습니다. 안타까웠어요.
        expression: weary
      - speaker: kim-sunggi
        text: 오늘은 회사 이름으로 온 자리가 아닙니다. 개인적인 부탁이에요.
        expression: neutral
      - speaker: thought
        text: 부회장이 개인 명의로 사람을 부른다. 이 자체가 이미 무거운 일이다.
    next: the-ask

  the-ask:
    id: the-ask
    lines:
      - speaker: kim-sunggi
        text: 제 조카, 김도현을 아시죠. 28살. 현 회장 아들입니다.
        expression: neutral
      - speaker: kim-sunggi
        text: 한 달 전부터 연락이 없어요. 경찰에는 신고 안 했습니다. 공적인 일로 만들 수가 없어요.
        expression: weary
      - speaker: pc
        text: 그룹 내부 조사팀이 있지 않습니까.
      - speaker: kim-sunggi
        text: 있죠. 그런데 그들이 찾으면, 찾은 뒤에 어떻게 될지 제가 보장을 못 해요.
        expression: grim
      - speaker: thought
        text: 부회장이 자기 그룹 조사팀을 못 믿는다고 말한다. 이건 승계 구도 얘기다.
    choices:
      - id: listen
        label: 좀 더 말씀해 주시죠.
        next: motive
      - id: probe-motive
        label: 부회장님, 왜 저입니까.
        check: { stat: jikgam, dc: 13 }
        success:
          next: probe-motive-success
          effects:
            - kind: memory
              text: 내가 선택된 이유는 "전직 내부자이면서 현재는 그룹과 적대 계약 상태"라는 조합 때문이다.
        failure:
          next: motive
      - id: decline-outright
        label: 죄송합니다. 저는 이 건 맡을 수 없습니다.
        check: { stat: ttuksim, dc: 15 }
        success:
          next: decline-success
        failure:
          next: motive
          effects:
            - kind: stat
              target: ttuksim
              delta: -1

  probe-motive-success:
    id: probe-motive-success
    lines:
      - speaker: kim-sunggi
        text: 좋은 질문입니다.
        expression: smile
      - speaker: kim-sunggi
        text: 솔직히 말씀드리면, 현 회장 쪽 사람도 아니고, 완전한 외부인도 아닌 분이 필요했어요.
        expression: neutral
      - speaker: kim-sunggi
        text: 실장님은 그룹을 아시고, 지금은 그룹이 실장님을 경계합니다. 저에겐 그게 적합합니다.
        expression: grim
      - speaker: thought
        text: 이 사람은 나를 쓰는 게 아니라 나의 포지션을 쓰는 거다. 나는 그한테 카드다.
    next: motive

  decline-success:
    id: decline-success
    lines:
      - speaker: kim-sunggi
        text: …그러시군요.
        expression: tense
      - speaker: kim-sunggi
        text: 알겠습니다. 그런데 한 가지만 기억해 주세요.
        expression: grim
      - speaker: kim-sunggi
        text: 실장님이 이 일을 안 맡아도, 이 일은 실장님한테 옵니다. 조금 늦게, 더 불리하게.
        expression: weary
      - speaker: thought
        text: 이 사람은 이미 내 미래까지 계산에 넣고 말하고 있다.
    next: closing

  motive:
    id: motive
    lines:
      - speaker: kim-sunggi
        text: 도현이는 실종 직전에 한 임원을 만났습니다. 그 임원이 누군지는 지금 말씀드리지 않겠습니다.
        expression: grim
      - speaker: thought
        text: 말 안 하는 이름이 제일 중요한 이름이다.
      - speaker: kim-sunggi
        text: 도현이가 무엇을 가지고 있었는지, 어디로 가려 했는지, 살아있는지.
        expression: weary
      - speaker: kim-sunggi
        text: 이 세 가지 중 두 가지만이라도 확인해 주시면 됩니다.
        expression: neutral
    next: terms

  terms:
    id: terms
    lines:
      - speaker: kim-sunggi
        text: 착수금 오천. 성공 보수 따로. 경비는 실비.
        expression: neutral
      - speaker: kim-sunggi
        text: 조건 하나. 보고는 저한테만. 중간에 누구에게 말해도 제가 알게 되면, 그 순간 계약은 끝납니다.
        expression: grim
    choices:
      - id: accept
        label: 맡겠습니다.
        next: accept
        effects:
          - kind: flag
            key: accepted_case
            value: true
          - kind: memory
            text: 김승기 부회장의 의뢰를 수락했다. 조카 김도현 실종 사건. 착수금 오천. 단독 보고.
      - id: negotiate
        label: 조건 하나 조정해 주셔야겠습니다.
        check: { stat: gwonmo, dc: 14 }
        success:
          next: negotiate-success
          effects:
            - kind: flag
              key: accepted_case
              value: true
            - kind: flag
              key: reserved_channel
              value: true
            - kind: memory
              text: 계약에 '생명 위협시 외부 채널 1개 사용 가능' 조항을 넣었다. 이수연 기자를 염두에 둔 안전장치.
        failure:
          next: accept
      - id: sleep-on-it
        label: 하루만 생각해 봐도 되겠습니까.
        check: { stat: ttuksim, dc: 13 }
        success:
          next: sleep-success
          effects:
            - kind: flag
              key: delayed_acceptance
              value: true
        failure:
          next: accept

  negotiate-success:
    id: negotiate-success
    lines:
      - speaker: kim-sunggi
        text: …
        expression: tense
      - speaker: kim-sunggi
        text: 어떤 조건인지 들어보죠.
        expression: neutral
      - speaker: pc
        text: 생명에 직접적인 위협이 감지되면, 외부 언론 한 곳과 최소한의 공조를 할 수 있게 해 주십시오. 단, 실장님과 먼저 상의합니다.
      - speaker: kim-sunggi
        text: …
        expression: grim
      - speaker: kim-sunggi
        text: 좋습니다. 그 조건까지 포함해서, 계약입니다.
        expression: weary
    next: accept

  sleep-success:
    id: sleep-success
    lines:
      - speaker: kim-sunggi
        text: 좋습니다. 내일 낮 열두 시까지 연락 주세요.
        expression: neutral
      - speaker: kim-sunggi
        text: 그 시간을 넘기면 의뢰는 다른 분께 갑니다. 저도 기다릴 여유는 없어서요.
        expression: grim
      - speaker: thought
        text: 하루의 여유를 얻었다. 그러나 하루만큼 상대도 준비한다.
    next: accept

  accept:
    id: accept
    lines:
      - speaker: narration
        text: 서류에 서명한다. 도현의 사진 세 장, 최근 통화 기록, 결제 내역 PDF 링크가 담긴 USB가 건네진다.
      - speaker: kim-sunggi
        text: 고맙습니다, 백 실장님.
        expression: smile
      - speaker: kim-sunggi
        text: 한 가지만요.
        expression: weary
      - speaker: kim-sunggi
        text: 도현이는 누군가의 아들입니다. 조카이기 전에. 그 사실을 가끔 기억해 주세요.
        expression: grim
    next: closing

  closing:
    id: closing
    lines:
      - speaker: narration
        text: VIP 상담실 문을 닫고 엘리베이터에 탄다. 27층에서 1층까지 혼자다.
      - speaker: thought
        text: 조카가 들고 있었던 것, 만난 임원, 생사. 세 가지 중 두 가지.
      - speaker: thought
        text: 두 달 전 내가 서명한 퇴직 합의서와, 오늘 서명한 의뢰 계약서가 같은 방향을 가리키고 있다는 예감이 든다.
        effects:
          - kind: chapterComplete
            chapter: chapter-1
            nextChapter: chapter-2
