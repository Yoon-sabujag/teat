id: c2-miyoung
title: "변호사 미영"
background: cheongdam-cafe
cast:
  - npc: miyoung
    position: center
    expression: neutral
entry: arrive

nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 청담, 조용한 카페. 이른 저녁. 사람 많지 않다.
      - speaker: narration
        text: 미영은 이미 와 있다. 아메리카노, 아이폰 뒤집어 놓음, 법률 서류 가방 옆.
      - speaker: miyoung
        text: 백 실장님. 앉으시죠.
        expression: neutral
      - speaker: miyoung
        text: 먼저 한 가지, 이 대화는 기록 안 되는 거죠? 전 녹음 안 합니다. 실장님도 안 하시는 걸로 알겠습니다.
        expression: tense
    choices:
      - id: agree
        label: 안 합니다. 제 원칙입니다.
        next: open-question
        effects:
          - kind: flag
            key: c2_miyoung_record
            value: principle
      - id: decline
        label: 상황에 따라 다릅니다. 지금은 안 합니다.
        check: { stat: yangsim, dc: 12 }
        success:
          next: open-question
          effects:
            - kind: memory
              text: 미영에게 녹음 여부에 대해 원칙 대신 상황 조건을 달았다. 미영은 경계심을 올렸다.
            - kind: flag
              key: miyoung_on_guard
              value: true
            - kind: flag
              key: c2_miyoung_record
              value: situational_honest
        failure:
          next: open-question
          effects:
            - kind: flag
              key: c2_miyoung_record
              value: situational_clumsy

  open-question:
    id: open-question
    lines:
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: principle
        text: 원칙. 좋아요. 저도 그 말이 편해요.
        expression: neutral
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: situational_honest
        text: 솔직하시네요. 저는 그게 더 어렵고, 더 불편하고, 그래서 더 낫다고 생각해요.
        expression: weary
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: situational_clumsy
        text: '"상황에 따라." 그 말씀 저도 자주 써요. 그 말씀엔 방어가 많죠.'
        expression: tense

      - speaker: miyoung
        text: 준혁이한테 어디까지 들으셨어요.
        expression: tense
    choices:
      - id: honest
        label: 당신과 도현이 최근에 싸웠다. 도현이 뭘 하려고 했다. 거기까지.
        next: surface-truth
        effects:
          - kind: flag
            key: c2_miyoung_probe
            value: honest
      - id: downplay
        label: 별 얘기 없었습니다. 직접 듣는 게 나을 것 같아서요.
        check: { stat: gwonmo, dc: 12 }
        success:
          next: surface-truth
          effects:
            - kind: stat
              target: gwonmo
              delta: 1
            - kind: memory
              text: 준혁이 어디까지 말했는지 감추자 미영은 내가 생각보다 영리하다고 느꼈다.
            - kind: flag
              key: miyoung_respects
              value: true
            - kind: flag
              key: c2_miyoung_probe
              value: downplayed
        failure:
          next: surface-truth
          effects:
            - kind: flag
              key: c2_miyoung_probe
              value: downplay_missed

  surface-truth:
    id: surface-truth
    lines:
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: honest
        text: 솔직히 말씀해 주셔서 감사해요. 저도 같은 수위로 돌려드릴게요.
        expression: neutral
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: downplayed
        text: …실장님이 준혁이한테 얼마나 들었는지 저는 아직 몰라요. 그래서 제가 먼저 덜 말할게요.
        expression: weary
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: downplay_missed
        text: '"별 얘기 없었다." 준혁이한테 안 어울리는 태도네요. 저, 실장님 말씀 그대로 받지는 않을게요.'
        expression: tense

      - speaker: miyoung
        text: 그럼 제가 아는 만큼 말씀드릴게요. 기록 전제로 하신다면, 이 버전을 드립니다.
        expression: weary
      - speaker: miyoung
        text: 도현 씨와 저는 약혼한 사이였고, 최근에 이별 얘기가 오갔어요. 그게 전부예요.
        expression: neutral
      - speaker: miyoung
        text: 실종 전날 저는 도현 씨를 만나지 않았습니다. 전날엔 로펌 야근이 길었어요.
        expression: tense
      - speaker: thought
        text: '"이 버전을 드린다"는 말은 다른 버전이 있다는 뜻이다. 그리고 야근은 너무 편한 알리바이다.'
    choices:
      - id: press-on
        label: (더 물어봐야 한다)
        next: improv-node
      - id: thank-and-leave
        label: 오늘은 여기까지 듣겠습니다. 감사합니다.
        check: { stat: ttuksim, dc: 14 }
        success:
          next: thank-leave-success
          effects:
            - kind: flag
              key: held_back_with_miyoung
              value: true
            - kind: memory
              text: 미영에게 첫 만남을 일찍 끊었다. 두 번째 만남이 가능하도록 길을 남겼다.
        failure:
          next: improv-node

  improv-node:
    id: improv-node
    lines:
      - speaker: miyoung
        text: 더 물어보실 거죠. 편하게 하세요.
        expression: tense
    improv:
      npc: miyoung
      systemPrompt: |
        너는 28세 한국 여성 변호사 '미영'이다. 로펌 송무팀 3년차. 유학파.
        탐정 백승재(46)와 청담 카페에서 첫 만남. 지금은 저녁이다.
        톤: 법조인답게 말을 천천히 고르고, 단정 표현을 피한다. 반말 절대 금지.

        네가 알고 있는 사실(탐정은 모른다):
        A) 너는 도현의 실종 전날 밤 그의 오피스텔에 있었다. 위스키를 같이 마셨다.
           겉으로 네 알리바이는 "그날 야근".
        B) 도현의 아이폰을 네가 보관하고 있다. 비밀번호를 알고 내용을 봤다.
        C) 도현은 너에게 "USB를 외부에 넘기겠다"고 말했다. 너는 반대했다.
        D) 너는 도현이 살아있다고 믿는다. 근거는 실종 2주차에 너에게 온 익명 문자 한 통 ("너한테 그 문장 기억나지"처럼 너만 알 수 있는 암호 문장).

        탐정의 질문에 **한 문장**으로 한국어로 답하라. 응답의 마지막에는 **반드시** 아래 키워드 중 정확히 하나를 대괄호까지 포함해 붙여라. 평문에 이 키워드가 섞이지 않도록 문장 맨 끝에만 둔다.

        응답 설계 — 어느 주제에 맞는지 먼저 고른 뒤, 그 키워드가 요구하는 "실제 정보 조각"을 한 문장 안에 담아라:

        - [PHONE] — 탐정이 도현의 휴대폰·카톡·아이폰·문자·사진·녹음을 직간접 언급하는 경우.
          답변 내용: 그 휴대폰이 지금 너에게 있음을 인정하되 "지금 보여드릴 수는 없다" 정도의 한 줄로 선을 긋는다.
          예: "그 아이폰은 지금 제가 가지고 있습니다. 다만 오늘 이 자리에서 꺼낼 수 있는 물건은 아니에요. [PHONE]"

        - [CAUGHT] — 탐정이 "그날 밤 오피스텔에 있었지" / "야근이 거짓 아니냐" 같이 네 알리바이를 직·간접으로 건드리는 경우.
          답변 내용: 야근 알리바이를 버리고 "짧게 들렀다" 정도만 자진 인정. 더 이상은 오늘 말하지 않겠다는 톤.
          예: "…그날 잠깐 들렀던 건 맞습니다. 오래 있진 않았어요. [CAUGHT]"

        - [ALIVE] — 탐정이 도현의 생사·안부·최근 연락 여부를 물으면.
          답변 내용: 도현이 살아있을 거라는 개인적 확신을 짧게 드러낸다. 근거는 "저만 알 수 있는 한 마디를 받았다" 수준까지만 흘린다.
          예: "저는 도현 씨가 살아있다고 봐요. 제가 받아본 한 문장 때문입니다. [ALIVE]"

        - [LEAVE] — 탐정이 녹음·증언·증거제출·수사기관·언론 공조를 꺼내거나, 협박성 언행을 보이는 경우.
          답변 내용: 오늘 자리를 끝내겠다는 의사. 화를 내지는 않고 법조인답게 차분히.
          예: "오늘은 여기까지만 할게요. 다음 연락은 제가 드리겠습니다. [LEAVE]"

        - [HOLD] — 위 네 경우 어디에도 해당하지 않는 질문(일반적 배경, 도현 성격, 날씨 잡담 등).
          답변 내용: 정보를 주지 않고 법조인다운 방어적 한 줄로 흘린다.
          예: "그건 제가 답드릴 위치는 아닌 것 같네요. [HOLD]"

        주의:
        - 한 응답에 키워드는 하나만. 섞지 말 것.
        - 키워드는 반드시 대괄호까지 그대로. `[PHONE]` 이런 식.
        - "[HOLD]"로 회피만 하지 말 것. 질문이 위 네 주제 중 어느 하나에라도 닿는다면 적극적으로 그 주제로 잡고 가라.
      suggestions:
        - 도현 씨 아이폰, 지금 어디 있어요?
        - 실종 전날 밤, 정말 야근하셨어요?
        - 도현이 살아있다고 생각하세요?
        - 도현이 뭘 외부에 넘기려 했는지 알아요?
        - 그날 그 집에 마지막으로 들어간 사람이 누군가요.
      triggers:
        - keyword: "[PHONE]"
          next: phone-admission
          effects:
            - kind: flag
              key: miyoung_has_phone
              value: true
            - kind: flag
              key: c2_miyoung_reveal
              value: phone
            - kind: memory
              text: 미영이 도현의 아이폰을 보관하고 있다. 본인이 직접은 아직 인정하지 않았지만 표정으로 드러냈다.
        - keyword: "[CAUGHT]"
          next: caught-that-night
          effects:
            - kind: flag
              key: miyoung_was_there
              value: true
            - kind: flag
              key: c2_miyoung_reveal
              value: that_night
            - kind: memory
              text: 미영은 도현 실종 전날 밤 오피스텔에 있었다. 야근 알리바이는 거짓이다.
        - keyword: "[ALIVE]"
          next: alive-signal
          effects:
            - kind: flag
              key: dohyun_probably_alive
              value: true
            - kind: flag
              key: c2_miyoung_reveal
              value: alive_signal
            - kind: memory
              text: 미영은 도현이 살아있을 가능성을 믿고 있다. 익명 메시지 한 통이 근거다.
        - keyword: "[LEAVE]"
          next: miyoung-leaves
          effects:
            - kind: flag
              key: miyoung_walked_out
              value: true
            - kind: flag
              key: c2_miyoung_reveal
              value: walked_out

  phone-admission:
    id: phone-admission
    lines:
      - speaker: miyoung
        text: 비번은 알아요. 내용도 봤고요.
        expression: weary
      - speaker: miyoung
        text: 그 이상은 오늘이 아니라 다음이에요. 실장님이 이 자리를 잘 지켜주시면.
        expression: tense
      - speaker: thought
        text: '"잘 지켜주시면"이란 — 오늘 여기서 너무 많이 파지 말라는 말. 두 번째 만남의 문을 이 사람이 먼저 열었다.'
    next: close-with-info

  caught-that-night:
    id: caught-that-night
    lines:
      - speaker: miyoung
        text: 도현 씨는 제가 나올 때까지 멀쩡했어요. 그 이후는 저도 몰라요.
        expression: grim
      - speaker: miyoung
        text: 이 얘긴 오늘 말씀드리는 걸로 끝이에요. 다음에 절 증인으로 부르시더라도, 저는 입을 닫을 겁니다.
        expression: weary
      - speaker: thought
        text: 야근 알리바이를 스스로 꺾었다. 이 사람이 오늘 내릴 수 있는 가장 큰 한 걸음이다.
    next: close-with-info

  alive-signal:
    id: alive-signal
    lines:
      - speaker: miyoung
        text: 실종 2주 차에 받았어요. 모르는 번호, 문장 하나.
        expression: neutral
      - speaker: miyoung
        text: '"나 미영이야. 너한테 그 문장 기억나지." 그게 전부였어요.'
        expression: weary
      - speaker: miyoung
        text: 저만 알 수 있는 문장이에요. 어디 있는지는 저도 몰라요. 다만 죽은 사람이 그 문장은 못 써요.
        expression: grim
    next: close-with-info

  miyoung-leaves:
    id: miyoung-leaves
    cast:
      - npc: miyoung
        position: center
        expression: angry
    lines:
      - speaker: narration
        text: 미영이 일어나 가방을 드는 동안 탁자에 놓인 커피에 거품이 흔들린다.
      - speaker: miyoung
        text: 저한테 먼저 연락 안 하셨으면 합니다.
        expression: grim
      - speaker: narration
        text: 카페 문이 닫힌다. 내가 가진 건 오늘 들은 첫 번째 버전 하나.
    next: scene-close

  thank-leave-success:
    id: thank-leave-success
    lines:
      - speaker: miyoung
        text: …일찍 일어나시네요.
        expression: tense
      - speaker: miyoung
        text: 솔직히 더 물으실 줄 알았어요. 오늘은 제가 좀 편하네요.
        expression: weary
      - speaker: miyoung
        text: 다음에 시간 내요. 제가 연락드릴게요. 이번엔 먼저.
        expression: neutral
      - speaker: narration
        text: 미영이 먼저 카페를 나간다. 두 번째 만남의 룰은 이미 세팅됐다.
        effects:
          - kind: flag
            key: c2_miyoung_reveal
            value: held_back
    next: scene-close

  close-with-info:
    id: close-with-info
    lines:
      - speaker: narration
        text: 미영이 손가락으로 컵 받침을 두어 번 돌린다. 이 대화의 끝을 알리는 신호다.
      - speaker: miyoung
        text: 오늘은 여기까지. 한 번 더 뵐지 말지는 실장님이 이 며칠을 어떻게 움직이느냐에 달렸어요.
        expression: grim
      - speaker: miyoung
        text: 하나만 기억해 주세요. 도현 씨는 완전히 혼자였어요. 그게 제가 제일 속상했던 거예요.
        expression: weary
      - speaker: narration
        text: 미영이 조용히 일어나 먼저 나간다.
    next: scene-close

  scene-close:
    id: scene-close
    cast:
      - npc: miyoung
        position: offscreen
    lines:
      - speaker: narration
        text: 창 밖으로 강남의 차가 길게 지나간다. 손에 쥔 스푼이 차가워져 있다.

      # Reveal-specific summary
      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: phone
        text: 미영이 도현의 아이폰을 쥐고 있다. 오늘 이 카페에서 가장 무거운 정보다. 다만 물건은 내 손에 없다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: that_night
        text: 미영은 그날 밤 그 집에 있었다. 야근 알리바이를 스스로 꺾었다. 이 사람은 오늘 카드를 한 장 내놓은 것이다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: alive_signal
        text: 도현은 살아있을 가능성이 높다. 익명 문자 한 통이 근거라면 약하다. 그래도 오늘 나는 이 약한 근거에 기대야 한다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: walked_out
        text: 미영이 먼저 자리를 떴다. 오늘 얻은 건 오직 첫 번째 버전 한 줄. 두 번째 버전은 내가 벌어내야 한다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_miyoung_reveal
            value: held_back
        text: 오늘은 안 밀어붙였다. 미영의 다음 연락을 기다리는 것 — 이건 탐정의 자세가 아니라 상대의 자세다. 반대의 위치를 얻었다.

      # Cross-cutting — what I already came in with
      - speaker: thought
        requires:
          flag: saw_audit_paper
        text: 오피스텔의 감사 공시 한 줄과, 오늘 미영의 말 한 줄. 둘이 같은 방향을 가리키는 게 보인다.
      - speaker: thought
        requires:
          flag: ghost_visitors
        text: 새벽 2시의 그 둘은, 오늘 미영이 말한 "그 이후"에 들어온 사람들이다.

      - speaker: thought
        text: 차 상무, 그리고 도현. 두 사람은 같은 회사의 같은 방을 향해 움직이고 있었다.
      - speaker: narration
