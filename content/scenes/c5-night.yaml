id: c5-night
title: "그날 밤 을지로"
background: euljiro-night-alley
cast: []
entry: alley-walk

nodes:
  alley-walk:
    id: alley-walk
    lines:
      - speaker: narration
        text: 을지 OB 간판 뒤쪽 골목에서 큰 길까지 두 블록. 이수연이 먼저 택시를 잡아 탔고, 내 걸음은 그대로 북쪽의 사무실 빌딩 쪽으로 향했다. 밤 열한 시를 살짝 넘긴 을지로는 회식 3차 간판 불빛이 세 개쯤 동시에 깜빡였고, 배달 오토바이 한 대가 인쇄 골목 쪽으로 경적을 한 번 울리며 지나갔다.
      - speaker: narration
        text: 사거리 한 블록 전쯤, 횡단보도 신호를 기다리던 순간 뒤로 한 번 고개를 돌렸다. 검은색 국산 세단 한 대가 한 블록 뒤에서 정확히 같은 속도로 나와 거리를 유지한 채 정지해 있었다. 운전석 쪽 유리엔 틴팅이 깊었고, 차 번호판 앞 네 자리에 작은 흙자국 한 줄이 얹혀 있었다.
      - speaker: thought
        text: 이수연이 헤어지며 남긴 한 문장이 오늘 밤 안으로 맞아 떨어졌다. 차 한 대가 내 뒤를 잡는 건, 나한테서 무엇을 지킬지가 아니라 무엇을 가져갈지를 정리하기 위한 준비다.
    choices:
      - id: tail-convenience
        label: (근처 편의점에 들러 유리에 반사된 번호판을 확인한다.)
        check: { stat: jikgam, dc: 12 }
        success:
          next: tail-seen
          effects:
            - kind: flag
              key: c5_tail_id
              value: seen
            - kind: memory
              text: 을지로 뒷골목에서 미행 차 번호판 앞 네 자리 확인. 흙자국 걷어 낸 뒤의 네 자리는 기억에 박아 뒀다.
        failure:
          next: tail-missed
          effects:
            - kind: flag
              key: c5_tail_id
              value: missed
      - id: tail-evade
        label: (골목 세 번 꺾어 사무실 반대쪽으로 유도한 뒤 돌아온다.)
        check: { stat: gwonmo, dc: 12 }
        success:
          next: tail-evaded
          effects:
            - kind: flag
              key: c5_tail_id
              value: evaded
            - kind: memory
              text: 을지로 뒷골목 세 번 꺾어 미행 차를 떨어뜨렸다. 오늘 밤은 내 사무실 주소가 저 차 쪽에 새로 찍히지 않는다.
        failure:
          next: tail-followed-home
          effects:
            - kind: flag
              key: c5_tail_id
              value: followed_home
      - id: tail-ignore
        label: (뒤를 한 번 더 의식하지 않고 사무실 쪽으로 직진한다.)
        next: tail-followed-home
        effects:
          - kind: flag
            key: c5_tail_id
            value: ignored

  tail-seen:
    id: tail-seen
    lines:
      - speaker: narration
        text: 편의점 안쪽 냉장고 앞에 서서 캔커피 하나를 고르는 척하며 통유리에 비친 바깥을 훑었다. 차는 편의점 건너 버스정류장 앞에서 한 번 정차했고, 유리 한쪽에 번호판 앞 네 자리가 역상으로 비쳤다. 머리 속에서 흙자국을 한 번 걷어낸 뒤의 숫자가 선명하게 잡혔다.
      - speaker: thought
        text: 번호 앞자리가 그룹 자회사 법인차량 체계 — 88로 시작하는 4자리. 본사 보안실 직속 운용 차량 번호판이다. 18년 다닌 회사라 그 번호 체계는 잠결에도 알아본다. 운용자는 보안실장 라인 한 명. 오늘 내 뒤에 붙은 손은 공식 라인 안쪽이다.
    next: office-arrive

  tail-missed:
    id: tail-missed
    lines:
      - speaker: narration
        text: 편의점에 서서 캔커피를 고르는 척하며 유리에 비친 차 쪽으로 고개를 돌렸다. 그 순간 건너편 버스 두 대가 동시에 정차하며 유리 앞을 가리고 지나갔고, 가려진 그 사이에 차는 이미 움직여 한 블록 더 멀어져 있었다.
      - speaker: thought
        text: 번호판의 절반도 못 읽었다. 오늘 밤 이후 저 차의 주인을 내 쪽에서 식별할 길은 당분간 없다.
    next: office-arrive

  tail-evaded:
    id: tail-evaded
    lines:
      - speaker: narration
        text: 첫 골목을 오른쪽, 두 번째 골목에서 되돌아 왼쪽, 세 번째는 인쇄 골목의 좁은 샛길. 낮은 주차장 위로 올라가 반대편 계단으로 내려오자 뒤에서 따라오던 엔진음은 이미 사라져 있었다. 5분쯤 뒤 원래 사무실 방향으로 돌아오자 같은 위치에 그 차는 없었다.
      - speaker: thought
        text: 오늘 밤 내 사무실 주소가 저 차 쪽 수첩에 새로 찍히는 건 피했다. 다만 내일 아침 저 차가 다시 내 동선에 붙는지 안 붙는지는 내일 확인할 문제로 남는다.
    next: office-arrive

  tail-followed-home:
    id: tail-followed-home
    lines:
      - speaker: narration
        text: 차는 내가 사무실 빌딩 앞에 도착할 때까지 한 번도 거리를 좁히지 않았고, 한 번도 거리를 벌리지 않았다. 빌딩 옆 공영주차장 입구 근처에서 시동을 끈 채 잠시 대기하는 모양이 곁눈으로 스쳤다.
      - speaker: thought
        text: 오늘 밤 이후 내 사무실 주소는 저 차 쪽 수첩에 그대로 한 줄 찍혔다. 내일 오전 이수연 엔지니어 자리까지 가는 동안, 내 뒤는 계속 같은 무게로 따라붙게 될 거다.
        effects:
          - kind: flag
            key: followed_to_office
            value: true
    next: office-arrive

  office-arrive:
    id: office-arrive
    background: euljiro-office
    lines:
      - speaker: narration
        text: 빌딩 1층 현관 유리문은 보증금 관리 차원에서 열한 시 반이면 잠기는 자동문이다. 비상 열쇠로 유리문을 한 번 열고, 계단을 6층까지 걸어 오른 뒤 7층엔 엘리베이터로 올라갔다. 사무실 문 잠금은 평소와 같은 각도로 돌아갔다. 실내에 누가 다녀간 흔적은 없었다.
      - speaker: narration
        text: 책상 위에 재민이 점심때 두고 간 잔반 커피컵 하나가 아직 그대로였다. 창 쪽으로 한 번 걸어가 블라인드 틈으로 아래를 살폈다.
      - speaker: narration
        requires:
          flag: followed_to_office
        text: 빌딩 옆 공영주차장 입구 쪽에 아까 그 차가 여전히 시동을 끈 채 서 있었다. 운전석 창 내부의 담배 불빛 하나가 느리게 밝아졌다 어두워졌다.
      - speaker: thought
        requires:
          flag: followed_to_office
        text: 오늘 밤 이 빌딩 앞에 내 쪽 사람이 한 명도 없고, 저쪽 사람이 한 명 있다. 그 대칭이 오늘 밤의 기본값이다.
      - speaker: narration
        requires:
          flagNotEquals:
            key: followed_to_office
            value: true
        text: 아래 골목은 조용했다. 회식 3차 찾는 양복 무리 하나가 건너편 편의점에서 담배 한 개비를 사 들고 나갔고, 그 외에 움직이는 건 없었다.
    next: tape-choice

  tape-choice:
    id: tape-choice
    background: euljiro-office
    lines:
      - speaker: thought
        requires:
          flag: got_tape
        text: 코트 안주머니의 디지털 녹음기를 한 번 눌러 확인했다. 무게는 손끝에 거의 느껴지지 않는 수준이지만, 오늘 밤 이 물건을 어디에 둘지는 이번 사건 통틀어 가장 작은 결정 중 하나이면서도 가장 긴 파장이 남을 결정이다.
      - speaker: thought
        requires:
          flagNotEquals:
            key: got_tape
            value: true
        text: 코트 안주머니엔 오늘 이수연이 건네 준 본인 명함 한 장과 '내일 9시. 뒷문.'이라고 손글씨로 적힌 쪽지 한 장뿐이다. 암자에서 주워 온 것이 없는 밤은, 오늘 밤처럼 조용한 편이다.
    choices:
      - id: tape-safe
        label: 사무실 소형 금고에 넣는다.
        requires:
          flag: got_tape
        check: { stat: ttuksim, dc: 10 }
        success:
          next: tape-result
          effects:
            - kind: flag
              key: tape_location
              value: office_safe
            - kind: memory
              text: 녹음기를 사무실 소형 금고에 보관. 비밀번호는 내 쪽 기억에만.
        failure:
          next: tape-result
          effects:
            - kind: flag
              key: tape_location
              value: desk_drawer
            - kind: memory
              text: 금고 번호 첫 시도에서 한 번 어긋나 시간이 지났다. 녹음기는 결국 책상 서랍 안쪽에 얹어 뒀다.
      - id: tape-jaemin
        label: 재민이한테 맡긴다. 심부름 비용은 내일 처리.
        requires:
          flag: got_tape
        check: { stat: inmaek, dc: 11 }
        success:
          next: tape-result
          effects:
            - kind: flag
              key: tape_location
              value: jaemin
            - kind: memory
              text: 재민이 한밤중에 사무실로 올라와 녹음기를 자기 쪽 보관 라인으로 가져갔다. 위치는 본인만 안다.
        failure:
          next: tape-result
          effects:
            - kind: flag
              key: tape_location
              value: desk_drawer
            - kind: memory
              text: 재민이 오늘 밤은 합정에 붙잡혀 못 온다고 문자. 녹음기는 책상 서랍 안쪽에 얹어 뒀다.
      - id: tape-on-person
        label: 오늘 밤은 내 옷 안주머니에 그대로 지닌다.
        requires:
          flag: got_tape
        next: tape-result
        effects:
          - kind: flag
            key: tape_location
            value: on_person
          - kind: memory
            text: 녹음기를 오늘 밤 내 몸에 그대로 지닌다. 분실 위험이 제일 크고, 분실 외 위험은 제일 작다.
      - id: tape-skip
        label: (오늘 밤엔 꺼낼 것이 없다.)
        requires:
          flagNotEquals:
            key: got_tape
            value: true
        next: tape-result

  tape-result:
    id: tape-result
    background: euljiro-office
    lines:
      - speaker: narration
        requires:
          flagEquals:
            key: tape_location
            value: office_safe
        text: 금고 문을 한 번 닫고 다이얼을 세 번 돌려놓았다. 책상 위엔 빈 커피컵과 재민이 두고 간 실없는 포스트잇 한 장 외에 아무것도 없다.
      - speaker: narration
        requires:
          flagEquals:
            key: tape_location
            value: jaemin
        text: 재민이 한밤에 운동화 바닥을 질질 끌면서 올라와 녹음기 하나를 잠깐 손바닥 위에 얹어 보더니 코트 안주머니로 넣고 다시 내려갔다. 보관 위치는 본인 말고 아무도 몰라야 이 사람 업이 유지된다.
      - speaker: narration
        requires:
          flagEquals:
            key: tape_location
            value: on_person
        text: 녹음기를 코트 왼쪽 안주머니에 그대로 꽂아 두었다. 뒷주머니보다 앞주머니가 야간에 잃어버릴 확률이 낮다는 정도의 계산.
      - speaker: narration
        requires:
          flagEquals:
            key: tape_location
            value: desk_drawer
        text: 결국 책상 서랍 가장 안쪽 파일철 뒤에 녹음기를 밀어 넣었다. 오늘 밤 이 공간을 여는 사람이 있다면, 서랍 여는 데 3초도 안 걸린다.
      - speaker: narration
        text: 책상 앞 의자에 앉은 순간, 책상 위에 뒤집어 놓았던 휴대폰이 진동 한 번으로 몸을 뒤집었다. 발신자 표시 없음. 02로 시작하는 번호. 밤 열한 시 사십 분.
    next: cha-call

  cha-call:
    id: cha-call
    background: euljiro-office
    cast:
      - npc: cha-sangmu
        position: offscreen
    lines:
      - speaker: pc
        text: 여보세요.
      - speaker: cha-sangmu
        text: 승재씨. 오늘 저녁 먼 길 다녀오셨지요.
        expression: weary
      - speaker: thought
        text: 차 상무. 두 달 전 마지막으로 들은 목소리 그대로다. 이 사람이 내 번호를 지금 이 시간에 누르고 있다는 사실은, 오늘 저녁 이수연 앞에 내가 앉아 있던 것까지 이미 이쪽 라인에도 도달했다는 뜻이다.
      - speaker: cha-sangmu
        text: 내일 아침 일곱 시 반에 커피 한잔 어떻겠어요. 광화문 쪽에서 제가 잡을게요. 승재씨가 오래 걸리는 일정 아니시죠, 요즘.
        expression: grim
    choices:
      - id: cha-polite
        label: 일정 한 번 보고 내일 오전 중에 회신 드리겠습니다.
        next: cha-polite-reply
        effects:
          - kind: flag
            key: cha_call_response
            value: polite
      - id: cha-defiant
        label: 상무님, 이 시간에 이 번호로 거신 이유부터 말씀하시죠.
        check: { stat: ttuksim, dc: 12 }
        success:
          next: cha-defiant-success
          effects:
            - kind: flag
              key: cha_call_response
              value: defiant
        failure:
          next: cha-polite-reply
          effects:
            - kind: flag
              key: cha_call_response
              value: defiant_flinch
      - id: cha-cold
        label: 오전 일곱 시 반 광화문. 알겠습니다.
        next: cha-cold-accept
        effects:
          - kind: flag
            key: cha_call_response
            value: cold

  cha-polite-reply:
    id: cha-polite-reply
    background: euljiro-office
    cast:
      - npc: cha-sangmu
        position: offscreen
    lines:
      - speaker: cha-sangmu
        text: 그러세요. 다만 회신은 빠르실수록 승재씨 쪽에 편한 자리가 돼요. 제가 승재씨한테 쓰는 호의가 오래 유지되는 성질의 호의가 아니라서요.
        expression: weary
      - speaker: thought
        text: 협박은 협박인데, 예의 있는 협박이다. 이 사람은 지금 내가 이 통화에서 얼마까지 밀릴 수 있는지를 재는 중이다.
    next: night-end

  cha-defiant-success:
    id: cha-defiant-success
    background: euljiro-office
    cast:
      - npc: cha-sangmu
        position: offscreen
    lines:
      - speaker: cha-sangmu
        text: 승재씨. 그 톤이시라는 건 오늘 저녁에 꽤 묵직한 걸 들고 오셨다는 뜻이네요.
        expression: tense
      - speaker: cha-sangmu
        text: 내일 아침 커피는 그쪽에서 먼저 시간 잡아 주시는 걸로 바꾸죠. 제가 기다리는 쪽으로 앉겠습니다.
        expression: grim
      - speaker: thought
        text: 이 사람이 처음으로 협상 테이블의 시간 주도권을 내 쪽에 넘겼다. 오늘 저녁에 내가 이수연 앞에서 올린 카드 무게가 이 통화에서 처음으로 가격표로 돌아왔다.
        effects:
          - kind: flag
            key: cha_yielded_tempo
            value: true
          - kind: memory
            text: 차 상무가 협상 테이블 시간 주도권을 내 쪽에 양보. 내일 아침 만남의 시간을 내가 정한다.
    next: night-end

  cha-cold-accept:
    id: cha-cold-accept
    background: euljiro-office
    cast:
      - npc: cha-sangmu
        position: offscreen
    lines:
      - speaker: cha-sangmu
        text: 고맙습니다, 승재씨. 편한 밤 되시고요. 오늘 너무 늦게 주무시지 말고요.
        expression: smile
      - speaker: thought
        text: '"편한 밤 되시라"는 그룹 안에서 해고 통보를 보내던 그날의 마지막 한 줄이다. 이 사람이 그 문장을 오늘 밤 두 번째로 쓰고 있다.'
    next: night-end

  night-end:
    id: night-end
    background: euljiro-office
    lines:
      - speaker: narration
        text: 통화를 끊은 뒤 의자 등받이에 한 번 몸을 기댔다. 책상 위 시계는 열한 시 사십칠 분. 재민이 남긴 포스트잇엔 '형 오늘 늦게 드셨으면 저 내일 11시에 올라갈게요'라고 개발새발 적혀 있었다.
      - speaker: narration
        text: 잠금 화면 위로 카톡 미리보기 한 줄이 짧게 떠올랐다가 사라졌다. 하진. 중 2인 딸이 이 시간에 보낸 메시지는 지난 한 달 사이 처음이었다.
      - speaker: narration
        text: '미리보기에 적힌 한 줄 — "아빠 저녁은 드셨어요."'
    choices:
      - id: read-hajin
        label: (카톡을 열어 한 줄 읽는다.)
        next: hajin-exchange
        effects:
          - kind: flag
            key: read_hajin_tonight
            value: true
          - kind: memory
            text: 하진이 늦은 밤 보낸 카톡 한 줄 확인. 그 아이 쪽은 내 쪽 안부를 나보다 먼저 계산하고 있다.
      - id: defer-hajin
        label: (내일 아침에 답장하기로 하고 화면을 내린다.)
        next: defer-hajin-beat
        effects:
          - kind: flag
            key: deferred_hajin
            value: true

  hajin-exchange:
    id: hajin-exchange
    mode: kakao
    background: euljiro-office
    lines:
      - speaker: narration
        text: 오후 11:47
      - speaker: hajin
        text: 아빠 저녁은 드셨어요.
      - speaker: hajin
        text: 엄마는 계속 걱정해요. 말은 안 해도요.
    choices:
      - id: reply-brief
        label: 아빠 저녁 먹었어. 너도 얼른 자라.
        next: hajin-reply-brief
        effects:
          - kind: flag
            key: hajin_reply
            value: brief
      - id: reply-softer
        label: 걱정 마. 아빠 오늘은 덜 늦게 들어갈게.
        next: hajin-reply-softer
        effects:
          - kind: flag
            key: hajin_reply
            value: softer
          - kind: memory
            text: 하진에게 오늘은 덜 늦게 들어가겠다고 약속했다.
      - id: reply-truthful
        label: 아빠가 요새 안 편해. 너라도 먼저 자라.
        check: { stat: yangsim, dc: 10 }
        success:
          next: hajin-reply-truthful
          effects:
            - kind: flag
              key: hajin_reply
              value: truthful
            - kind: memory
              text: 하진에게 '아빠가 요새 안 편하다'고 한 줄 보냈다. 중학생 아이가 그 한 줄을 어른 자리에서 받았다.
        failure:
          next: hajin-reply-brief
          effects:
            - kind: flag
              key: hajin_reply
              value: truthful_failed

  hajin-reply-brief:
    id: hajin-reply-brief
    mode: kakao
    background: euljiro-office
    lines:
      - speaker: pc
        text: 아빠 저녁 먹었어. 너도 얼른 자라.
      - speaker: hajin
        requires:
          flagEquals:
            key: hajin_reply
            value: truthful_failed
        text: …네.
      - speaker: hajin
        requires:
          flagNotEquals:
            key: hajin_reply
            value: truthful_failed
        text: 네.
      - speaker: system
        text: 하진님이 대화창을 나갔습니다.
      - speaker: thought
        text: 그 애의 이 한 줄짜리 질문은 내가 두 달 전 이 회사를 나올 때 쥐고 나온 것 중 가장 무거운 짐이다. 오늘 밤 이 사건의 모든 단서보다 이 한 줄이 내 코트 주머니 안에서 더 묵직하다.
    next: lights-off

  hajin-reply-softer:
    id: hajin-reply-softer
    mode: kakao
    background: euljiro-office
    lines:
      - speaker: pc
        text: 걱정 마. 아빠 오늘은 덜 늦게 들어갈게.
      - speaker: hajin
        text: 진짜로요?
      - speaker: pc
        text: 응. 진짜.
      - speaker: hajin
        text: 알았어요. 아빠도 일찍 자요.
      - speaker: system
        text: 하진님이 대화창을 나갔습니다.
      - speaker: thought
        text: 저 애 쪽이 먼저 내 안부를 챙기는 대화를 오늘도 한 번 더 내준 셈이다. 내 쪽에서 돌려 준 한 줄이 내일 아침 집 현관에 닿을 수 있을지부터가 오늘 밤의 무게다.
    next: lights-off

  hajin-reply-truthful:
    id: hajin-reply-truthful
    mode: kakao
    background: euljiro-office
    lines:
      - speaker: pc
        text: 아빠가 요새 안 편해. 너라도 먼저 자라.
      - speaker: hajin
        text: …
      - speaker: hajin
        text: 아빠 그냥 집 와도 돼요.
      - speaker: hajin
        text: 엄마한테는 제가 말할게요.
      - speaker: narration
        text: 이모티콘 하나 없이 보낸 문장이 그대로 위쪽으로 한 칸 밀렸다.
      - speaker: thought
        text: 중 2짜리 아이가 내 쪽으로 어른 자리를 먼저 내밀어 준 거다. 그만큼 오늘 밤 내가 어른이 못 됐다는 계산이 책상 한쪽에 남는다.
    next: lights-off

  defer-hajin-beat:
    id: defer-hajin-beat
    background: euljiro-office
    lines:
      - speaker: thought
        text: 오늘 밤 그 한 줄을 안 연 것도 일종의 선택이다. 내일 아침에 답해도 늦지 않은 질문이라고 스스로를 설득했지만, 그 애의 질문은 내일 오전엔 이미 온도가 달라져 있을 거다.
    next: lights-off

  lights-off:
    id: lights-off
    background: euljiro-office
    lines:
      - speaker: narration
        text: 사무실 형광등을 끄고 블라인드 틈으로 한 번 더 아래를 살폈다.
      - speaker: narration
        requires:
          flag: followed_to_office
        text: 공영주차장 입구의 그 차는 아직 시동을 끈 채 같은 자리에 있었다. 운전석 안쪽 담배 불빛이 한 번 더 천천히 밝아졌다가 어두워졌다.
      - speaker: narration
        requires:
          flagNotEquals:
            key: followed_to_office
            value: true
        text: 골목은 조용했다. 오늘 밤 이 빌딩 앞에 내 것이 아닌 차는 보이지 않는다.
      - speaker: thought
        requires:
          flagEquals:
            key: cha_call_response
            value: defiant
        text: 내일 아침 일정은 내가 정한다. 두 달 만에 이 그룹 안쪽 사람에게 내 쪽 시간을 한 번 되찾았다. 그 한 번이 내일 아침 광화문 카페의 무게로 돌아올 거다.
      - speaker: thought
        requires:
          flagEquals:
            key: cha_call_response
            value: defiant_flinch
        text: 목소리가 떨렸다. 그 떨림이 전화기 너머에서 어디까지 들렸는지는 내일 아침 광화문 카페에서 확인될 거다.
      - speaker: thought
        requires:
          flagEquals:
            key: cha_call_response
            value: cold
        text: '"편한 밤 되시라"는 그 마지막 한 줄이 오늘 밤 내 귀에 한 번 더 덧발렸다. 내일 아침 일곱 시 반 광화문이 오늘 밤의 가장 확정된 일정이다.'
      - speaker: thought
        requires:
          flagEquals:
            key: cha_call_response
            value: polite
        text: 오늘 밤은 일정을 확정하지 않는 쪽으로 끌었다. 내일 오전 회신 전에, 이수연 엔지니어 자리에서 무엇이 나오느냐가 오늘 밤 이 통화의 가격표를 결정한다.
      - speaker: narration
        text: 사무실 문을 한 번 더 돌려 잠그고, 6층까지 계단, 그 아래는 엘리베이터. 1층 현관 유리문을 열고 나서자 을지로 골목의 겨울 공기가 정면으로 다시 한 번 목을 쳤다.
    next: tomorrow-line

  tomorrow-line:
    id: tomorrow-line
    background: euljiro-office
    cast: []
    lines:
      - speaker: narration
        text: 골목 끝 가로등 아래 잠시 섰다. 코트 안주머니의 휴대폰을 꺼내 내일 일정 메모 앱을 한 번 켰다. 빈 칸 한 줄. 내일 첫 자리는 어디부터 칠지를 이 한 줄로 박아 둬야 잠이 오는 밤이다.
      - speaker: thought
        text: 세 갈래가 책상 위에 있다. 내일 아침 일곱 시 반 광화문 카페에서 차 상무 정면, 또는 그 전에 미영 변호사 한 번 더, 또는 그 전에 이수연 편집국 라인 먼저. 어느 쪽이 첫 패가 되느냐로 내일 오전이 통째로 정해진다.
    choices:
      - id: line-cha
        label: 차 상무 카페부터. 정면이 가장 빠른 길이다.
        next: tomorrow-confirmed
        effects:
          - kind: flag
            key: c5_line
            value: cha
          - kind: memory
            text: 내일 첫 패 — 차 상무 카페 정면. 다른 라인은 그 자리 끝나고 결정.
      - id: line-miyoung
        label: 미영부터 한 번 더. 카페 자리 들어가기 전에 카드 한 장 더 깔자.
        next: tomorrow-confirmed
        effects:
          - kind: flag
            key: c5_line
            value: miyoung
          - kind: memory
            text: 내일 첫 패 — 미영 변호사 호출. 카페 자리 전에 미영 쪽 카드 한 장 더.
      - id: line-press
        label: 이수연 쪽 먼저. 엔지니어 자리에서 카드 정리하고 들어간다.
        requires:
          flag: tape_duplicated_plan
        next: tomorrow-confirmed
        effects:
          - kind: flag
            key: c5_line
            value: press
          - kind: memory
            text: 내일 첫 패 — 이수연 편집국 뒷문 엔지니어 자리. 복제본 손에 쥐고 그 다음으로.

  tomorrow-confirmed:
    id: tomorrow-confirmed
    background: euljiro-office
    cast: []
    lines:
      - speaker: narration
        requires:
          flagEquals:
            key: c5_line
            value: cha
        text: 광화문, 일곱 시 반, 카페 1층. 메모 한 줄 박고 휴대폰을 다시 안주머니로.
      - speaker: narration
        requires:
          flagEquals:
            key: c5_line
            value: miyoung
        text: 청담, 아침 여덟 시. 미영 쪽 일정 비어 있는 시간 하나, 어제 통화 라인으로 한 줄 보내고 휴대폰을 다시 안주머니로.
      - speaker: narration
        requires:
          flagEquals:
            key: c5_line
            value: press
        text: 시청 사거리 뒷문, 아홉 시. 이수연한테 한 줄 보내고 휴대폰을 다시 안주머니로.
      - speaker: narration
        text: 큰길로 한 블록 더 걸어 택시를 잡았다. 운전기사한테 집 주소를 부르는 대신 그냥 "분당 쪽이요" 한 마디만 하고 차창에 머리를 기댔다.
    next: late-night-prompt

  late-night-prompt:
    id: late-night-prompt
    background: euljiro-office
    cast: []
    lines:
      - speaker: narration
        requires:
          flag: miyoung_count_1
        text: 차에 탄 지 십 분쯤 지났을 때 휴대폰이 짧게 울렸다. 미영. "지금 잠깐 보실 수 있을까요. 청담 사거리 옆 빌딩 5층, 도어록 4830."
      - speaker: thought
        requires:
          flag: miyoung_count_1
        text: 청담 위스키 바 그날 이후 처음 오는 호출이었다. 받느냐 안 받느냐로 두 번째 만남이 만들어지느냐가 정해진다.
    choices:
      - id: visit-miyoung-late
        label: (기사한테 청담 사거리로 방향 변경.) 가 본다.
        requires:
          flag: miyoung_count_1
        next: visit-miyoung-late-goto
        effects:
          - kind: flag
            key: c5_late_chose
            value: miyoung
      - id: skip-late
        label: (휴대폰을 다시 엎어 놓는다.) 오늘 밤은 답하지 않는다.
        next: c5-final
        effects:
          - kind: flag
            key: c5_late_chose
            value: skip

  visit-miyoung-late-goto:
    id: visit-miyoung-late-goto
    cast: []
    lines:
      - speaker: narration
        text: 기사한테 분당 대신 청담을 부르고 차창에서 한 번 더 자세를 잡았다.
        effects:
          - kind: goto
            scene: c5b-miyoung-touch

  c5-final:
    id: c5-final
    cast: []
    lines:
      - speaker: narration
        text: 분당 자택까지 가는 동안 휴대폰은 더 울리지 않았다. 새벽 두 시 즈음 문을 따고 들어가, 거실 불은 켜지 않은 채 소파에 잠시 앉았다 일어났다.
        effects:
          - kind: chapterComplete
            chapter: chapter-5
            nextChapter: chapter-6
