id: c2-miyoung
title: "변호사 미영"
background: cheongdam-cafe
cast:
  - npc: miyoung
    position: center
    expression: neutral
entry: arrive

nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        requires:
          flag: miyoung_meeting
        text: 청담 사거리에서 한 블록 안쪽. 로펌들이 드나드는 건물 지하 한 칸을 쓰는 카페였다. 준혁이가 어제 잡아 준 자리. 저녁 여덟 시 조금 지나, 창가 두 좌석에만 손님이 있었고, 재즈 기타 솔로가 볼륨을 낮춰 흘러나오고 있었다.
      - speaker: narration
        requires:
          flagNotEquals:
            key: miyoung_meeting
            value: true
        text: 청담 사거리에서 한 블록 안쪽. 로펌들이 드나드는 건물 지하 한 칸을 쓰는 카페였다. 어제 김승기 부회장 비서실에서 미영 변호사 쪽으로 한 줄 보내 자리가 잡힌 거였다. 저녁 여덟 시 조금 지나, 창가 두 좌석에만 손님이 있었고, 재즈 기타 솔로가 볼륨을 낮춰 흘러나오고 있었다.
      - speaker: narration
        text: 미영은 가장 안쪽 벽 쪽 좌석에 이미 자리 잡고 있었다. 얇은 블랙 니트 위에 밝은 회색 재킷 한 벌, 머리는 한쪽으로 단정하게 모여 있었다. 테이블 위엔 아메리카노 한 잔, 뒤집어 놓은 아이폰, 그리고 사건 번호가 적힌 것 같은 메모지 한 장이 법률 서류 가방 옆에 반듯하게 놓여 있었다.
      - speaker: miyoung
        text: 백 실장님. 앉으시죠.
        expression: neutral
      - speaker: miyoung
        requires:
          flagNotEquals:
            key: miyoung_meeting
            value: true
        text: 김 부회장님 비서실에서 한 줄 받았어요. 제가 거절할 자리가 아니라서요. 다만 실장님 쪽이 어디까지 보고 오신 분인지 모르는 상태로 들어가는 자리니까, 저는 천천히 시작합니다.
        expression: tense
      - speaker: miyoung
        text: 제가 먼저 한 가지만 정하고 시작할게요. 이 대화는 기록 안 합니다. 저도 녹음 안 하고요, 실장님도 안 하시는 걸로요.
        expression: tense
    choices:
      - id: agree
        label: 안 합니다. 제 원칙입니다.
        next: open-question
        effects:
          - kind: flag
            key: c2_miyoung_record
            value: principle
      - id: decline
        label: 상황에 따라 다릅니다. 지금은 안 합니다.
        check: { stat: yangsim, dc: 11 }
        success:
          next: open-question
          effects:
            - kind: memory
              text: 미영에게 녹음 여부에 대해 원칙 대신 상황 조건을 달았다. 미영은 경계심을 올렸다.
            - kind: flag
              key: miyoung_on_guard
              value: true
            - kind: flag
              key: c2_miyoung_record
              value: situational_honest
        failure:
          next: open-question
          effects:
            - kind: flag
              key: c2_miyoung_record
              value: situational_clumsy

  open-question:
    id: open-question
    lines:
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: principle
        text: 원칙이시라, 좋네요. 저도 그쪽이 일하기 편한 편이고요. 그럼 서로 보증 한 번씩 걸고 시작하는 걸로 할게요.
        expression: neutral
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: situational_honest
        text: 솔직한 답이시네요. 이 바닥에서 그 말씀 드리는 거 쉬운 건 아니죠. 저는 오히려 그게 더 편한 편이에요.
        expression: weary
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_record
            value: situational_clumsy
        text: '"상황에 따라서." 저도 현장에서 자주 쓰는 표현이에요. 다만 저희 동종 업계에서 그 말씀은 방어가 절반쯤 섞여 들어간 표현으로 읽히는 편이고요.'
        expression: tense

      - speaker: miyoung
        requires:
          flag: miyoung_meeting
        text: 준혁이한테는 어디까지 들으셨어요.
        expression: tense
      - speaker: miyoung
        requires:
          flagNotEquals:
            key: miyoung_meeting
            value: true
        text: 도현 씨에 대해 어디까지 정리하고 오셨어요. 시작 라인 잡아 두고 들어가는 게 둘 다 편할 것 같아서요.
        expression: tense
    choices:
      # 준혁 만난 분기
      - id: honest
        label: 당신과 도현이 최근에 싸웠다. 도현이 뭘 하려고 했다. 거기까지.
        requires:
          flag: miyoung_meeting
        next: surface-truth
        effects:
          - kind: flag
            key: c2_miyoung_probe
            value: honest
      - id: downplay
        label: 별 얘기 없었습니다. 직접 듣는 게 나을 것 같아서요.
        requires:
          flag: miyoung_meeting
        check: { stat: gwonmo, dc: 11 }
        success:
          next: surface-truth
          effects:
            - kind: stat
              target: gwonmo
              delta: 1
            - kind: memory
              text: 준혁이 어디까지 말했는지 감추자 미영은 내가 생각보다 영리하다고 느꼈다.
            - kind: flag
              key: miyoung_respects
              value: true
            - kind: flag
              key: c2_miyoung_probe
              value: downplayed
        failure:
          next: surface-truth
          effects:
            - kind: flag
              key: c2_miyoung_probe
              value: downplay_missed
      # 준혁 미만남 분기 — 김승기 비서실 직접 호출
      - id: honest-direct
        label: 김 부회장 의뢰 받았고, 도현 씨가 사라지기 전 본사 자료실 출입 다섯 번. 그 정도 깔고 왔습니다.
        requires:
          flagNotEquals:
            key: miyoung_meeting
            value: true
        next: surface-truth
        effects:
          - kind: flag
            key: c2_miyoung_probe
            value: honest
      - id: downplay-direct
        label: 부회장님 쪽이 깔아 주신 줄거리 한 장이 전부입니다. 나머지는 변호사님 쪽이 풀어 주실 줄 알고요.
        requires:
          flagNotEquals:
            key: miyoung_meeting
            value: true
        check: { stat: gwonmo, dc: 11 }
        success:
          next: surface-truth
          effects:
            - kind: stat
              target: gwonmo
              delta: 1
            - kind: memory
              text: 김 부회장 라인 받은 정도만 깔아 둠. 미영은 PC가 의외로 카드를 늦게 까는 사람이라고 봤다.
            - kind: flag
              key: miyoung_respects
              value: true
            - kind: flag
              key: c2_miyoung_probe
              value: downplayed
        failure:
          next: surface-truth
          effects:
            - kind: flag
              key: c2_miyoung_probe
              value: downplay_missed

  surface-truth:
    id: surface-truth
    lines:
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2_miyoung_probe
            value: honest
        text: 그 정도로 솔직하게 깔아 주시는 분은 오랜만이네요. 그럼 저도 같은 수위로 한 번 돌려드릴게요.
        expression: neutral
      - speaker: miyoung
        requires:
          flag: miyoung_meeting
          flagEqualsAll:
            - { key: c2_miyoung_probe, value: downplayed }
        text: …음. 준혁이가 실장님한테 어디까지 깔아 뒀는지 제가 먼저 확인을 못 한 상태이니까, 저는 뒤에서 시작할게요.
        expression: weary
      - speaker: miyoung
        requires:
          flagEqualsAll:
            - { key: c2_miyoung_probe, value: downplayed }
          flagNotEquals:
            key: miyoung_meeting
            value: true
        text: …음. 김 부회장님 라인으로 들어오신 거니까 제가 어디부터 시작해야 할지 감이 잡혀야 하는데, 이 답은 그 감을 더 흐리게 만드네요.
        expression: weary
      - speaker: miyoung
        requires:
          flag: miyoung_meeting
          flagEqualsAll:
            - { key: c2_miyoung_probe, value: downplay_missed }
        text: '"별 얘기 없었다"는 말은, 사실 준혁이랑은 잘 안 어울리는 태도예요. 걔가 한번 앉으면 최소 이십 분은 깔아 두고 가는 애거든요. 저 오늘 그 말 그대로 받지는 않겠습니다.'
        expression: tense
      - speaker: miyoung
        requires:
          flagEqualsAll:
            - { key: c2_miyoung_probe, value: downplay_missed }
          flagNotEquals:
            key: miyoung_meeting
            value: true
        text: '"별 얘기 없었다"고 시작하시는 거, 김 부회장님 비서실에서 자리 잡아 주신 분이 하실 답은 아니라고 봐요. 저 오늘 그 말 그대로는 못 받습니다.'
        expression: tense

      - speaker: miyoung
        text: 그럼 제가 아는 만큼만, 오늘 기준으로 말씀드릴게요. 기록 안 하기로 한 자리니까, 이 정도는 드릴 수 있어요.
        expression: weary
      - speaker: miyoung
        text: 도현 씨와 저는 양쪽 집안까지 간 사이였고, 최근 두어 달 동안 관계 정리 얘기가 오갔습니다. 깨끗하게 끝내자는 쪽으로요.
        expression: neutral
      - speaker: miyoung
        text: 실종 전날 저녁엔 사무실에서 야근했어요. 로펌 회의실 2호 예약 기록, 퇴근 카드키 로그, 같은 팀 파트너 세 분 증언까지 전부 남아 있고요.
        expression: tense
      - speaker: thought
        text: '"이 버전" 이라는 말은 다른 버전이 있다는 뜻이다. 그 다른 버전은 오늘 이 카페에서는 안 꺼내겠다는 뜻이고. 야근 알리바이도 너무 깨끗하게 준비돼 있다. 증언자 세 명까지 미리 묶어 두는 건 법조인의 본능이지만, 그만큼 어딘가 지워야 할 게 있었다는 흔적이기도 하다.'
    choices:
      - id: press-on
        label: (더 물어봐야 한다)
        next: improv-node
      - id: thank-and-leave
        label: 오늘은 여기까지 듣겠습니다. 감사합니다.
        check: { stat: ttuksim, dc: 12 }
        success:
          next: thank-leave-success
          effects:
            - kind: flag
              key: held_back_with_miyoung
              value: true
            - kind: memory
              text: 미영에게 첫 만남을 일찍 끊었다. 두 번째 만남이 가능하도록 길을 남겼다.
        failure:
          next: improv-node

  improv-node:
    id: improv-node
    lines:
      - speaker: miyoung
        requires:
          flagNotEquals:
            key: miyoung_turn_taken
            value: true
        text: 더 물어보실 거죠. 편하게 하세요.
        expression: tense
      - speaker: miyoung
        requires:
          flag: miyoung_turn_taken
        text: 또 뭐 있으세요. 오늘 자리에서 나오는 질문은 오늘 자리에서 끝내는 걸로 하죠.
        expression: weary
    choices:
      # ── Layer 1 (always available until asked): general opening questions ──
      - id: ask-relation
        label: 도현 씨와는 어떤 사이이셨습니까.
        requires:
          flagNotEquals:
            key: asked_relation
            value: true
        next: relationship-answer
        effects:
          - kind: flag
            key: asked_relation
            value: true
          - kind: flag
            key: miyoung_turn_taken
            value: true
      - id: ask-last-contact
        label: 실종 전에 마지막으로 언제 통화하셨습니까.
        requires:
          flagNotEquals:
            key: asked_last
            value: true
        next: last-contact-answer
        effects:
          - kind: flag
            key: asked_last
            value: true
          - kind: flag
            key: miyoung_turn_taken
            value: true
      - id: ask-state
        label: 도현 씨 요즘 상태가 어땠습니까.
        requires:
          flagNotEquals:
            key: asked_state
            value: true
        next: state-answer
        effects:
          - kind: flag
            key: asked_state
            value: true
          - kind: flag
            key: miyoung_turn_taken
            value: true

      # ── Layer 2 (unlock by L1 hints or prior-scene apartment flags) ──
      - id: ask-usb-plan
        label: 그 '다른 방향'이, 회사 자료 외부 유출 쪽이었습니까.
        requires:
          flag: asked_relation
          flagNotEquals:
            key: asked_usb
            value: true
        check: { stat: gwonmo, dc: 12 }
        success:
          next: usb-disclosure
          effects:
            - kind: flag
              key: miyoung_knew_usb_plan
              value: true
            - kind: flag
              key: asked_usb
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true
            - kind: memory
              text: 미영은 도현 USB 사본 한 세트를 본인 사무실 금고에 보관 중. 송신 상대방 이름은 오늘은 안 꺼냄. 광명 로펌이 대정그룹 자문이라 본인이 직접 폭로 못 하는 위치.
        failure:
          next: usb-deflect
          effects:
            - kind: flag
              key: asked_usb
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true
            - kind: flag
              key: miyoung_strike_usb
              value: true
            - kind: flag
              key: miyoung_any_strike
              value: true
      - id: ask-alibi
        label: '"공식적으로"라고 하셨는데, 실제로 그날 밤 어디 계셨습니까.'
        requires:
          flag: asked_last
          flagNotEquals:
            key: asked_alibi
            value: true
        check: { stat: jikgam, dc: 12 }
        success:
          next: caught-that-night
          effects:
            - kind: flag
              key: miyoung_was_there
              value: true
            - kind: flag
              key: asked_alibi
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true
            - kind: memory
              text: 미영은 도현 실종 전날 밤 오피스텔에 있었다. 야근 알리바이는 본인이 직접 꺾었다.
        failure:
          next: alibi-holds
          effects:
            - kind: flag
              key: asked_alibi
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true
            - kind: flag
              key: miyoung_strike_alibi
              value: true
            - kind: flag
              key: miyoung_any_strike
              value: true
      - id: ask-alive
        label: 도현 씨가 지금 살아 있다고 보십니까.
        requires:
          flag: asked_state
          flagNotEquals:
            key: asked_alive
            value: true
        check: { stat: yangsim, dc: 11 }
        success:
          next: alive-signal
          effects:
            - kind: flag
              key: dohyun_probably_alive
              value: true
            - kind: flag
              key: asked_alive
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true
            - kind: memory
              text: 미영은 도현이 살아있다고 본다. 실종 2주차에 본인에게 온 익명 문자 한 통이 근거.
        failure:
          next: alive-deflect
          effects:
            - kind: flag
              key: asked_alive
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true
            - kind: flag
              key: miyoung_strike_alive
              value: true
            - kind: flag
              key: miyoung_any_strike
              value: true

      # ── Layer 3 (unlocks only after the alibi has actually CRACKED — miyoung_was_there) ──
      - id: ask-phone
        label: 그럼 그날 밤, 도현 씨 휴대폰은 지금 어디에 있죠.
        requires:
          flag: miyoung_was_there
          flagNotEquals:
            key: asked_phone
            value: true
        check: { stat: gwonmo, dc: 12 }
        success:
          next: phone-admission
          effects:
            - kind: flag
              key: miyoung_has_phone
              value: true
            - kind: flag
              key: asked_phone
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true
            - kind: memory
              text: 미영이 도현의 아이폰을 보관하고 있다고 본인이 인정했다. 당장은 넘길 생각이 없다.
        failure:
          next: phone-deflect
          effects:
            - kind: flag
              key: asked_phone
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true
            - kind: flag
              key: miyoung_strike_phone
              value: true
            - kind: flag
              key: miyoung_any_strike
              value: true

      # ── Comeback (기지) — 실패가 쌓였을 때만 열리는 각도 재정비 ──
      - id: regroup
        label: (잔을 내려놓고 앉은 자세를 다시 잡으며) 제가 지금 각도를 잘못 고르고 있는 것 같네요. 잠깐만 드려 봐도 되겠습니까.
        requires:
          flag: miyoung_any_strike
          flagNotEquals:
            key: c2_regrouped
            value: true
        check: { stat: yangsim, dc: 11 }
        success:
          next: regroup-payoff
          effects:
            - kind: flag
              key: c2_regrouped
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true
            - kind: flag
              key: miyoung_hinted_firing_line
              value: true
            - kind: memory
              text: 미영 앞에서 물러나 각도를 다시 잡자 미영이 내 퇴직 라인 쪽으로 한 줄 돌려줬다.
        failure:
          next: regroup-missed
          effects:
            - kind: flag
              key: c2_regrouped
              value: true
            - kind: flag
              key: miyoung_turn_taken
              value: true

      # ── Exit routes ──
      - id: end-politely
        label: (오늘은 여기까지 하겠다고 정중히 마무리한다.)
        next: close-with-info
        effects:
          - kind: flag
            key: ended_politely
            value: true
      - id: end-hard
        label: (의자를 한 번 더 끌어당기며) 오늘 끝까지 다 말씀하셔야겠는데요.
        check: { stat: gwonmo, dc: 12 }
        requires:
          flag: miyoung_turn_taken
        success:
          next: hard-push-success
          effects:
            - kind: flag
              key: pushed_hard_with_miyoung
              value: true
        failure:
          next: miyoung-leaves
          effects:
            - kind: flag
              key: miyoung_walked_out
              value: true

  relationship-answer:
    id: relationship-answer
    lines:
      - speaker: miyoung
        text: 도현 씨와 저는 양쪽 집안 인사까지 갔던 사이입니다. 결혼 얘기까지 오간 적도 있고요.
        expression: weary
      - speaker: miyoung
        text: 최근 두어 달은 관계 정리 쪽으로 얘기가 오가던 중이었습니다. 쌍방 합의 쪽에 가까웠어요.
        expression: neutral
      - speaker: miyoung
        text: 정리의 직접적인 원인은 도현 씨가 그룹 내부 자료를 외부로 풀려고 했고, 제가 반대했기 때문입니다. 광명 법무법인이 대정그룹 자문 로펌이에요. 도현 씨가 외부로 풀면 광명이 끊기고, 광명이 끊기면 저는 변호사로서 끝납니다. 그게 제가 반대한 이유고, 그래서 결국 정리 얘기로 갔어요.
        expression: grim
      - speaker: thought
        text: 그 '다른 방향'이 오늘 이 자리에 나를 앉힌 이유일 거다. 지금 바로 묻지 않으면 저 사람이 스스로 다시 꺼내진 않는다.
      - speaker: miyoung
        text: 다른 것도 있으세요.
        expression: neutral
    next: improv-node

  last-contact-answer:
    id: last-contact-answer
    lines:
      - speaker: miyoung
        text: 공식적으로 마지막 통화는 실종 전날 저녁 일곱 시 십오 분이었습니다. 약 삼 분 정도. 내용은 다음 주 저녁 약속 조정 건이었고요.
        expression: neutral
      - speaker: miyoung
        text: 그게 수사기관 진술용 시간이고, 저희 로펌 파트너들이 알고 있는 시간이에요.
        expression: tense
      - speaker: thought
        text: '"공식적으로"라고 단서를 단 건 법조인이 본인 진술에 빠져나갈 길을 남겨 두는 버릇이다. 저 단어 뒤에 다른 버전이 한 장 더 있고, 거기에 오늘 진짜 대답이 들어 있다.'
      - speaker: miyoung
        text: 다른 물으실 거 있으세요.
        expression: tense
    next: improv-node

  state-answer:
    id: state-answer
    lines:
      - speaker: miyoung
        text: 요즘 도현 씨는 결정을 앞둔 사람 특유의 분위기였어요. 밤늦은 통화도 잦았고, 말을 고르는 결이 평소보다 무거워졌어요.
        expression: weary
      - speaker: miyoung
        text: 결정 내용은 저한테 공유 안 하는 쪽으로 본인이 선을 긋기 시작했고요. 그 선이 그어진 날부터 저는 이 결정이 저를 포함하지 않는다는 걸 알았어요.
        expression: grim
      - speaker: miyoung
        text: 실종 이후에 저도 연락 시도는 해 봤어요. 다만 그때쯤엔 저도 도현 씨가 어디에 있는지보다, 살아 있는지부터 의심하고 있던 상태였습니다.
        expression: tense
      - speaker: thought
        text: 미영이 먼저 걱정했던 쪽으로 얘기를 깔아 준 거다. 내가 그걸 그대로 받으면 본인은 그만큼 덜 방어해도 된다.
      - speaker: miyoung
        text: 다른 것도 있으세요.
        expression: neutral
    next: improv-node

  phone-admission:
    id: phone-admission
    lines:
      - speaker: miyoung
        text: 비밀번호는 알아요. 몇 번 열어 봤고 최근 한 달 치 대화는 다 훑었어요.
        expression: weary
      - speaker: miyoung
        text: 그 이상은 다음에 보죠. 조건 하나만요. 오늘 들은 거 어디에도 안 새시는 것.
        expression: tense
      - speaker: thought
        text: '"잘 지켜 주시면"이라는 표현을 저 사람이 바로 꺼낸 건, 오늘 여기서 더 파 들어오지 말라는 공식 경고다. 동시에 두 번째 자리를 본인 쪽에서 먼저 열어 주는 말이기도 했다. 이 두 가지가 한 문장 안에 같이 있는 법조인의 화법이 낯설지 않았다.'
      - speaker: miyoung
        text: 다른 것도 있으세요.
        expression: neutral
    next: improv-node

  caught-that-night:
    id: caught-that-night
    lines:
      - speaker: miyoung
        text: …도현 씨는 제가 그 방에서 나갈 때까지는 멀쩡했어요. 그 이후에 대해서는 저도 정말 모릅니다.
        expression: grim
      - speaker: miyoung
        text: 이 얘기는 오늘 여기서만 합니다. 나중에 저를 증언대 세우셔도 이 한 마디만 남기고 입 다물 거고요.
        expression: weary
      - speaker: thought
        text: 로펌 회의실 2호 예약, 카드키 로그, 파트너 세 명 증언까지 깔아 두었던 알리바이를 본인 손으로 한 번에 꺾었다. 이런 종류의 자백은 법조인이 하는 자백 중 가장 위험한 자백이고, 그래서 가장 계산된 자백이기도 하다.
      - speaker: miyoung
        text: 더 여쭤보실 거 있으시면 지금 하시죠.
        expression: tense
    next: improv-node

  alive-signal:
    id: alive-signal
    lines:
      - speaker: miyoung
        text: 실종 2주 차쯤 받았어요. 저장 안 된 번호에서 문자 한 통. 사진도 이모티콘도 없이 문장 하나만이요.
        expression: neutral
      - speaker: miyoung
        text: '"나 미영이야. 너한테 그 문장 기억나지." 그게 전부였어요. 전후 맥락 한 줄 없이.'
        expression: weary
      - speaker: miyoung
        text: 그 말은 저랑 도현 씨만 아는 말이에요. 오 년쯤 전에 둘이 농담으로 지어낸 거고요. 어디 있는지는 저도 모릅니다. 다만 죽은 사람은 그 말 못 써요.
        expression: grim
      - speaker: miyoung
        text: 더 여쭤보실 거 있으시면 지금. 저도 오늘 한 번에 끝내는 게 편해요.
        expression: tense
    next: improv-node

  usb-disclosure:
    id: usb-disclosure
    lines:
      - speaker: miyoung
        text: 도현 씨가 뭘 바깥으로 꺼내려고 했는지는 알아요. 어느 방향이고 어느 규모인지까지 저한테는 다 얘기했어요.
        expression: weary
      - speaker: miyoung
        text: 도현 씨 자료, 정확히 뭐가 들어 있는지 저는 알아요. 사본 한 세트가 저희 사무실 금고에 있고요. 다만 그 자료를 받아 갈 사람 이름은 오늘 안 드려요. 그 이름 한 번 들으시면 실장님도 같이 박힙니다.
        expression: tense
      - speaker: miyoung
        text: 실장님이 그 책임 지실 준비가 되셨는지 저는 아직 모르겠고요. 그게 정해지면 한 번 더 만나죠.
        expression: grim
      - speaker: thought
        text: 저 사람은 지금 내 준비 상태를 평가하고 있다. 평가 기준은 오늘 이 카페를 나간 이후 내가 며칠을 어떻게 움직이느냐일 거고, 그 며칠 동안 나는 저 사람의 다음 호출을 기다리는 쪽으로 밀려난다.
      - speaker: miyoung
        text: 또 여쭤보실 거 있으세요?
        expression: neutral
    next: improv-node

  hard-push-success:
    id: hard-push-success
    lines:
      - speaker: narration
        text: 의자를 한 뼘 앞으로 당기자 탁자 다리 한쪽이 카펫 위를 짧게 긁었다. 창가 자리의 커플이 잠깐 고개를 돌렸다 다시 자기 얘기로 돌아갔다. 미영은 눈을 깔지 않고 내 쪽을 더 오래 응시했다.
      - speaker: miyoung
        text: …실장님, 오늘 끝까지 가실 체력 있으세요.
        expression: tense
      - speaker: miyoung
        text: 그럼 오늘은 한 번에 다 말씀드릴게요. 다만 듣고 나가시는 순간부터 실장님 책임이에요.
        expression: grim
      - speaker: thought
        text: 이 사람이 방어를 푸는 이유는 내 압박이 통해서가 아니다. 오늘 자리에서 한 번에 털어내고 깨끗이 끊는 쪽이 본인한테 더 이득이라고 계산한 거다. 한 번에 다 가져가는 건 편한 일이지만, 그 정보의 무게도 한 번에 다 가져가는 거다.
        effects:
          - kind: flag
            key: miyoung_full_disclosure
            value: true
          - kind: memory
            text: 강하게 밀어붙여 미영이 남은 정보까지 이 자리에서 풀었다. 대신 이후의 움직임과 책임은 전부 내 쪽.
      - speaker: miyoung
        text: 더 여쭈실 거 있으시면 지금. 오늘 한 번에 다 드립니다.
        expression: weary
    next: improv-node

  alibi-holds:
    id: alibi-holds
    lines:
      - speaker: miyoung
        text: 그 질문 의도는 알겠어요. 다만 그날 야근은 로펌 예약 기록이랑 파트너 세 분 증언으로 이미 정리돼 있어요. 거기 더 파시면 오늘은 여기서 끊겠습니다.
        expression: grim
      - speaker: thought
        text: 표정 안쪽 근육 하나를 제대로 못 짚었다. 이 사람은 거짓말하는 중이 아니라, 거짓말을 깔끔하게 얹어 두는 중이다. 그 둘은 얼굴로는 구분이 잘 안 간다.
      - speaker: miyoung
        text: 다른 방향 질문은 받겠습니다.
        expression: tense
    next: improv-node

  alive-deflect:
    id: alive-deflect
    lines:
      - speaker: miyoung
        text: 그 질문은 저한테 하실 게 아니에요. 도현 씨 가족 쪽에 하셔야 하고, 저는 그 자리 대신 못 앉아요.
        expression: weary
      - speaker: thought
        text: 양심이라는 카드를 잘못 꺼냈다. 저 사람은 내가 이 질문을 진정성 있게 하는지를 봤고, 오늘 자리에선 그 진정성이 부족하다고 판정했다.
      - speaker: miyoung
        text: 다른 거 있으세요.
        expression: neutral
    next: improv-node

  usb-deflect:
    id: usb-deflect
    lines:
      - speaker: miyoung
        text: 실장님, 그 단어 한 번 입 밖에 내시면 실장님도 같이 책임 들어가요. 오늘은 제가 실장님 거기 안 끌어넣을게요.
        expression: grim
      - speaker: thought
        text: 회사 언어가 덜 매끄럽게 나간 거다. 저 사람은 내가 이 카드를 들 수 있는 무게인지 이 자리에서 한 번 시험했고, 오늘은 아니라고 본 거다.
      - speaker: miyoung
        text: 또 있으시면 여쭤보세요.
        expression: tense
    next: improv-node

  phone-deflect:
    id: phone-deflect
    lines:
      - speaker: miyoung
        text: 휴대폰까지 물으시는 건 오늘 너무 빨라요. 그 답 오늘은 안 해 드립니다.
        expression: grim
      - speaker: thought
        text: 한 걸음 더 밟으려다 미영의 경계선에 정면으로 부딪쳤다. 알리바이를 깨고 얻은 자리를 내가 너무 빨리 써 버린 거다.
      - speaker: miyoung
        text: 남은 질문 있으시면.
        expression: tense
    next: improv-node

  regroup-payoff:
    id: regroup-payoff
    lines:
      - speaker: narration
        text: 의자를 조금 당기고 탁자 위 잔을 반쯤 비웠다. 손등을 탁자 가장자리에 한 번 얹었다 뗐고, 그 사이에 미영이 내 얼굴을 한 번 더 읽었다. 창가 자리의 재즈 기타 솔로가 한 소절을 끝내고 다음 소절로 넘어갔다.
      - speaker: miyoung
        text: …실장님, 지금 앉아 계신 그 자리에 원래 계셔야 할 분 한 분 계시잖아요. 두 달 전에 조용히 정리되신 쪽.
        expression: weary
      - speaker: miyoung
        text: 도현 씨가 그 분 이름, 저한테 두 번 꺼냈어요. 한 번은 "저 사람 선이 맞다"고, 한 번은 "저 사람이 쓸려 간 게 우리 쪽 경고등이었다"고요.
        expression: grim
      - speaker: thought
        text: 오늘 이 카페에 앉은 내가 그 "선이 맞다"고 불린 쪽이다. 도현이 두 달 전에 이미 나를 자기 쪽 경고등으로 읽어 뒀다는 뜻이고, 오늘 저 사람이 굳이 그 문장을 내 쪽으로 돌려준 건 그 경고를 이제 내 자리에 얹어 두겠다는 뜻이다.
      - speaker: miyoung
        text: 다른 물으실 거 있으시면, 지금 물으시는 게 편하실 거예요.
        expression: neutral
    next: improv-node

  regroup-missed:
    id: regroup-missed
    lines:
      - speaker: miyoung
        text: 쉬신다고 하시는 거, 저는 받아 드립니다. 다만 그에 실장님이 쉬신 게 맞는지는 제가 아직 못 읽었어요. 오늘은 여기까지만 돌려 드릴게요.
        expression: grim
      - speaker: thought
        text: 각도를 다시 잡으려다 같은 쪽으로 한 번 더 헛디뎠다. 저 사람이 나를 한 바퀴 더 재는 자리에서 오늘 이 카페가 끝난다.
      - speaker: miyoung
        text: 다른 거 있으세요.
        expression: neutral
    next: improv-node

  miyoung-leaves:
    id: miyoung-leaves
    cast:
      - npc: miyoung
        position: center
        expression: angry
    lines:
      - speaker: narration
        text: 미영이 자리에서 일어나는 동작은 법정에서 방청석을 떠나는 변호사의 동작이었다. 법률 서류 가방 손잡이가 한 번 탁자 다리를 살짝 스쳤고, 마시다 만 아메리카노의 표면이 거품을 한 번 흔들었다.
      - speaker: miyoung
        text: 오늘 이후로는 제 쪽에서 연락드리겠습니다. 실장님께서 저한테 먼저 연락하시는 건, 앞으로 안 하시는 걸로 부탁드립니다.
        expression: grim
      - speaker: narration
        text: 카페 문이 닫히는 소리는 안쪽 재즈 피아노 한 마디 위로 겹쳐서 사라졌다. 탁자 위엔 결제 완료된 영수증 한 장과 미영이 남겨 둔 메모지 한 장. 메모지는 백지였다.
    next: scene-close

  thank-leave-success:
    id: thank-leave-success
    lines:
      - speaker: miyoung
        text: …일찍 일어나시네요.
        expression: tense
      - speaker: miyoung
        text: 솔직히 말씀드리면, 두세 번 정도 더 치고 들어오실 줄 알고 나왔어요. 오늘은 제가 생각보다 편한 자리로 끝난 거예요.
        expression: weary
      - speaker: miyoung
        text: 다음에 한 번 더 뵙죠. 자리는 제가 잡아 드리겠습니다. 이번엔 제 쪽에서 먼저.
        expression: neutral
      - speaker: narration
        text: 미영이 먼저 일어나 나갔다. 자리엔 아직 온기가 남은 잔 하나, 뒤집어 놓고 간 아이폰 자국. 두 번째 만남의 룰을 오늘 내 침묵이 반쯤 짜 준 셈이었다.
    next: scene-close

  close-with-info:
    id: close-with-info
    lines:
      - speaker: narration
        text: 미영이 컵 받침 가장자리를 두어 번 검지 끝으로 가볍게 돌렸다. 로펌 협상 테이블에서 파트너들이 자리를 마무리할 때 하는 버릇이었다. 한 번은 신호, 두 번째는 확정.
      - speaker: miyoung
        text: 오늘은 여기까지 할게요. 한 번 더 뵐지 말지는, 실장님이 앞으로 며칠을 어떻게 움직이시느냐에 달렸습니다.
        expression: grim
      - speaker: miyoung
        text: 하나만 기억해 주세요. 도현 씨는 완전히 혼자였어요. 그게 제가 제일 속상했던 거예요.
        expression: weary
      - speaker: narration
        text: 미영이 조용히 일어나 먼저 나간다.
    next: scene-close

  scene-close:
    id: scene-close
    cast:
      - npc: miyoung
        position: offscreen
    lines:
      - speaker: narration
        text: 창 밖으로 청담 사거리를 지나는 택시 행렬이 한 차례 길게 늘어졌다가 신호에 맞춰 다시 풀렸다. 탁자에 남겨진 잔 속 얼음은 이미 녹아 입구 쪽에 가느다란 물방울을 남겼고, 내 손에 쥐어 있던 스푼 자루가 어느 순간부터 차가워져 있었다.

      - speaker: thought
        requires:
          flag: miyoung_has_phone
        text: 도현이의 아이폰이 오늘 저녁 이 로펌 변호사 가방 안 어딘가에 들어 있었다. 이 카페에서 가장 무거운 정보가 오늘 내 손엔 오지 않고 저 사람의 손에 남았다. 다만 그게 내 손에 와야 할 시점이 언제인지, 그건 저 사람이 스스로 먼저 열어 둔 일정이다.

      - speaker: thought
        requires:
          flag: miyoung_was_there
        text: 로펌 야근 알리바이를 본인 손으로 꺾은 사람은 오늘 자리에서 큰 카드 한 장을 기꺼이 버렸다. 그런 자백은 계산 없이는 나오지 않는다. 저 카드의 다음 페이지에 무엇이 적혀 있는지, 그건 나에게 보여 주려고 오늘 버린 카드였다.

      - speaker: thought
        requires:
          flag: dohyun_probably_alive
        text: 도현이가 살아 있을 가능성이 오늘 저녁 소폭 올라갔다. 익명 문자 한 통이라는 근거는 법정에 못 서는 근거이지만, 이 방향으로 몇 걸음 더 나아갈 수 있는 방향타는 된다.

      - speaker: thought
        requires:
          flag: miyoung_knew_usb_plan
        text: 도현이가 준비했던 외부 유출 계획의 상대방 이름이 한 줄짜리 카드로 저 사람 쪽에 남았다. 그 카드를 꺼내 주는 조건이 앞으로 며칠간 내 움직임이라는 건, 오늘 이 자리의 진짜 무게가 오히려 나에게로 건너온 쪽이라는 뜻이기도 하다.

      - speaker: thought
        requires:
          flag: miyoung_full_disclosure
        text: 오늘 한 자리에서 미영이 남은 카드를 다 내놓게 만든 건 내 압박이라기보다 이 사람의 계산이었다. 정보는 한 뭉치로 건너왔고, 그 뭉치의 다음 수 하나하나가 내 쪽의 책임으로 같이 얹혔다.

      - speaker: thought
        requires:
          flag: miyoung_walked_out
        text: 미영이 먼저 일어났고, 남은 건 오늘 들은 것까지 한 장뿐이었다. 이 자리가 이렇게 끝난 건 내 쪽 잘못이라고 하기엔 애매했고, 저 사람 잘못이라고 하기엔 더 애매했다.

      - speaker: thought
        requires:
          flag: miyoung_hinted_firing_line
        text: 오늘 이 자리에서 내가 물러서자 저 사람이 내 퇴직 라인 하나를 돌려줬다. 두 달 전에 내가 받았던 해고 통보가 오늘 저녁 이 카페 한쪽에 다시 놓였고, 놓인 자리의 모양이 본사 쪽 조직도 위에서 생각보다 선명하게 그어져 있었다.

      - speaker: thought
        requires:
          flag: held_back_with_miyoung
        text: 오늘 나는 평소보다 이르게 손을 뗐다. 다음 연락을 저 사람이 먼저 잡아 주는 그림을 만들어 둔 셈이고, 이 그림에서 두 번째 자리의 주도권은 이 카페 의자와 함께 저 쪽에 남은 게 아니다.

      - speaker: thought
        requires:
          flag: saw_audit_paper
        text: 오피스텔 서랍 안 붉은 줄과, 오늘 저 사람이 한 번씩씩 밀어 준 말들. 두 쪽이 같은 방향의 지도에 찍힌 두 핀이라는 건, 오늘 이 카페를 나가기 전에 이미 분명해졌다.
      - speaker: thought
        requires:
          flag: ghost_visitors
        text: 새벽 두 시의 그 둘은, 오늘 미영이가 조심스럽게 '그 이후' 라고 줄여서 말한 구간 안에 걸어 들어간 사람들이었다. 그들이 쥔 것과 미영이가 쥔 것이, 오늘 내 머릿속에서 처음으로 같은 파일 이름으로 정리됐다.

      - speaker: thought
        text: 차 상무, 그리고 도현. 두 사람이 향하고 있던 자리가 같은 회사의 같은 층, 같은 방이었다는 걸 부정하기엔 오늘 저녁이 이미 너무 길었다.
      - speaker: narration
        text: 코트 안주머니에서 휴대폰이 한 번 울리고 바로 끊겼다. 모르는 번호였고, 국번은 다시 02. 부재중 알림이 잠금 화면 위에 잠깐 떠 있다 사라졌다. 카페 바깥 골목에 대기 중인 택시 트렁크 쪽으로 빗방울이 한두 방울 떨어지기 시작했다.
    next: side-prompt-jaemin

  side-prompt-jaemin:
    id: side-prompt-jaemin
    cast: []
    lines:
      - speaker: thought
        text: 미영이 던져 준 카드 무게가 코트 안주머니 안에서 한 번 더 묵직해졌다. 사무실 가는 길, 을지로 사거리에서 두 블록만 우회하면 재민 사무실. 이 시간에도 그 친구는 자리에 앉아 있을 가능성이 높다. 도현이 동선 한 줄 더 사 두는 자리가 될 수 있다.
    choices:
      - id: visit-jaemin
        label: (재민 사무실 잠깐 들렀다 간다.)
        next: jaemin-extra-goto
        effects:
          - kind: flag
            key: c2_side_chose
            value: jaemin
      - id: visit-miyoung-night
        label: (휴대폰에 미영 카톡 한 줄 — '한 잔만 더?'. 답한다.)
        requires:
          flag: held_back_with_miyoung
        next: miyoung-night-goto
        effects:
          - kind: flag
            key: c2_side_chose
            value: miyoung_night
      - id: skip-jaemin
        label: (오늘 밤은 사무실로 직진. 다른 자리는 내일 아침 다시.)
        next: wrap-up-c2
        effects:
          - kind: flag
            key: c2_side_chose
            value: skip

  miyoung-night-goto:
    id: miyoung-night-goto
    cast: []
    lines:
      - speaker: narration
        text: 답을 짧게 찍어 보냈다. "지금 갈게요." 청담 사거리 옆 골목, 7층 건물 꼭대기. 미영이 이미 자리 잡고 기다리고 있을 거였다.
        effects:
          - kind: goto
            scene: c2b-miyoung-night

  jaemin-extra-goto:
    id: jaemin-extra-goto
    cast: []
    lines:
      - speaker: narration
        text: 청담 사거리에서 다시 택시. 기사한테 을지로 3가 뒷골목 한 곳을 부르고 차창에 머리를 기댔다.
        effects:
          - kind: goto
            scene: c2-jaemin-extra

  wrap-up-c2:
    id: wrap-up-c2
    cast: []
    lines:
      - speaker: narration
        text: 사무실 쪽으로 택시를 돌렸다. 빗방울이 차창에 한 줄로 늘어졌다.
        effects:
          - kind: chapterComplete
            chapter: chapter-2
            nextChapter: chapter-3
