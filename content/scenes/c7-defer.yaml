id: c7-defer
title: "을지로 사무실, 오전"
background: euljiro-office
cast: []
entry: arrive

# 유예 라인. c6_decision = postpone. PC가 광화문 자리에 안 가고 사무실로 돌아와
# 결정을 미룬다. 짧은 씬, 가능 c7_end: silence / silence_leak / defer.
nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 택시를 광화문에서 을지로로 다시 돌렸다. 사무실 문을 열자 어제 저녁 떠난 자리 그대로의 공기. 형광등을 켰고, 커피 머신을 켰다. 아홉 시 사십 분.
      - speaker: thought
        text: 차 상무가 카페에 한 시간 일찍 와서 한 시간 늦게 일어날 거다. 그 한 시간 사이에 그쪽이 어떤 결정을 내릴지가 오늘 오후의 첫 변수.
      - speaker: narration
        text: 책상 위 휴대폰이 두 번 짧게 진동했다. 모르는 번호 한 통 + 차 상무 한 통. 둘 다 받지 않았다.
    next: midmorning
  midmorning:
    id: midmorning
    lines:
      - speaker: narration
        text: 열 시 십오 분. 차 상무 쪽에서 두 번째 부재중. 곧이어 카톡 한 줄. "승재씨, 오늘 자리 한 번 미루시는 거, 저는 받습니다. 다만 오후 안에 한 번은 답 주시죠."
      - speaker: thought
        text: 카페에 안 나타난 자리는 그쪽이 자기 쪽 룰로 처리한다. 오늘 안에 답이 안 가면 내일 아침엔 본사 쪽이 한 번 움직인다.
    choices:
      - id: defer-final
        label: (휴대폰을 엎어 놓고 책상에 앉는다.) 오늘은 답 안 한다.
        check: { stat: ttuksim, dc: 12 }
        success:
          next: close-defer
          effects:
            - kind: flag
              key: c7_end
              value: defer
            - kind: memory
              text: 7장 유예 결정. 오늘 자리 미루고 오후 내내 사무실에서 시간선 끌었다.
        failure:
          next: close-silence-leak
          effects:
            - kind: flag
              key: c7_end
              value: silence_leak
            - kind: memory
              text: 미루기로 했지만 오후 늦게 짧은 답을 한 줄 보냈고, 그 한 줄이 저쪽 카드로 남았다.
      - id: send-silence
        label: 카톡 한 줄로 정리. "오늘 자리 없는 걸로 하시죠." 전송.
        next: close-silence
        effects:
          - kind: flag
            key: c7_end
            value: silence
          - kind: memory
            text: 차 상무한테 카톡 한 줄로 자리 없는 걸로 정리. 짧고 깔끔.
      - id: leak-bait
        label: 이수연 쪽에 짧게 한 줄. "다음 주 화요일 자리 한 번 잡읍시다."
        check: { stat: gwonmo, dc: 12 }
        requires:
          flag: tape_duplicated_plan
        success:
          next: close-leak-success
          effects:
            - kind: flag
              key: c7_end
              value: silence_leak
            - kind: memory
              text: 차 상무 자리 유예 + 이수연 쪽으로 다음 주 자리 한 줄 던짐. 한 라인은 식히고 한 라인은 살림.
        failure:
          next: close-silence-leak
          effects:
            - kind: flag
              key: c7_end
              value: silence_leak

  close-defer:
    id: close-defer
    lines:
      - speaker: narration
        text: 정오까지 책상 위 휴대폰은 한 번 더 짧게 울렸고, 한 번 더 받지 않았다. 점심 김밥 한 줄을 사 와 책상에서 먹었고, 저녁까지 사무실 안에서 다른 일을 잡고 있었다. 차 상무 쪽 카톡 두 통이 더 들어왔지만 답 보내지 않았다.
      - speaker: thought
        text: 오늘 자리는 통째로 미뤄졌다. 다음 자리가 어디서 어떻게 잡히는지는 그쪽이 정한다. 그 사실이 오늘 이 사무실 안에서 가장 무거운 한 줄.
    next: depart

  close-silence:
    id: close-silence
    lines:
      - speaker: narration
        text: 카톡 송신. 두 번째 체크 표시까지 십 초쯤 걸렸고, 그 십 초 사이에 차 상무 쪽 답이 한 줄로 돌아왔다. "그러시죠. 좋은 하루 되세요." 더 이상 진동은 없었다.
      - speaker: thought
        text: 한 줄로 정리한 자리는 한 줄로 끝나는 자리. 깔끔한 만큼 다음 자리가 어떻게 만들어질지에 대한 단서도 한 줄도 없다.
    next: depart

  close-leak-success:
    id: close-leak-success
    lines:
      - speaker: narration
        text: 이수연 쪽 답이 곧장 돌아왔다. "화요일 좋습니다. 자리는 제가 잡을게요. 오늘 차 상무 쪽은 한 줄도 안 보내셨다는 거, 받았어요."
      - speaker: thought
        text: 오늘 자리를 미룬 사실이 기자 라인 안에 한 줄로 박혔다. 다음 주 화요일까지 그 한 줄이 어디서 어떻게 굴러갈지가 다음 라인의 첫 변수.
    next: depart

  close-silence-leak:
    id: close-silence-leak
    lines:
      - speaker: narration
        text: 정오 즈음 차 상무 쪽으로 짧은 답을 한 줄 보냈다. 보내고 나서 후회했다. 오후 두 시 즈음 그쪽 답이 돌아왔다. "받았습니다. 다음 자리는 제가 잡을게요."
      - speaker: thought
        text: 미루기로 했는데 한 줄을 흘렸다. 그 한 줄이 다음 자리를 그쪽이 잡는 근거로 박혔다.
    next: depart

  depart:
    id: depart
    cast: []
    lines:
      - speaker: narration
        text: 저녁 일곱 시. 사무실 형광등을 끄기 전에 책상 위 시계를 한 번 봤다. 오늘 광화문 카페에 안 나타난 시간으로부터 정확히 열 시간이 지나 있었고, 그 열 시간 동안 내 쪽 결정이 책상 위에 놓였던 자리가 의자 한 칸 너비만큼 깊어져 있었다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 유예. 다음 자리는 내가 잡지 않는다. 그 자리에 내가 어떤 자세로 들어갈지만 오늘 이 사무실 안에서 한 번 정해 두었다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 없던 자리. 오늘 한 번에 끊어내는 쪽으로 갔다. 그 끊어냄이 내 쪽 자리를 가장 좁게 만든다는 사실은 내일 아침에 다시 확인된다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 한 줄을 흘린 채 오늘이 끝난다. 그 한 줄이 다음 자리 모양을 정한다는 점에서, 오늘은 내가 카드를 한 장 떨어뜨리고 떠난 자리.
      - speaker: narration
        text: 빌딩 1층 회전문을 나오자 을지로 골목 추운 공기가 정면으로 닿았다. 오늘 이후 며칠은 누구의 페이스에 맞춰 흐를지를, 회전문 한 번 도는 사이에 한 번 더 정리했다.
        effects:
          - kind: chapterComplete
            chapter: chapter-7
            nextChapter: chapter-8
