# 을지로 7층 — 사건 진실서
#
# 모든 씬 작성·수정 시 이 파일을 먼저 본다. 추상 명사("라인", "자리",
# "한 줄") 가 아니라 여기 박힌 구체 사실 (회계연도, 인감, SWIFT 코드,
# 카톡 47건) 로 글을 쓴다.
#
# 이 진실서는 PC 가 게임 끝까지 다 알지는 못한다. 각 인물 블록의
# `pc_knows` 항목이 PC 가 끝까지 알 가능성이 있는 부분.

case:
  group_name: 대정그룹
  group_size: 자산 80조, 시총 35조 (가상의 SK·삼성급 재벌)
  spc_name: Daejeong International Pte Ltd (싱가포르 소재 자회사)
  scheme:
    summary: |
      해외사업본부가 싱가포르 SPC 를 거래 상대방으로 세워 가짜 수출
      계약서를 분기마다 발행. 그룹이 SPC 한테 부품을 "수출"한 것처럼
      장부에 잡고, SPC 는 가짜 인보이스를 다시 그룹에 청구. 그 차액과
      세금환급분이 비공식 자금으로 빠져나와 회장 + 장 전무 차명 라인
      으로 들어감.
    timeline:
      - "2019 Q2: 차상호 본부장 승진 직후 SPC 설립. 백승재가 전략기획실
        해외사업 TF 로 SPC 법인 등기·세무 구조 설계 (본인은 정상 SPC 운영
        목적으로 알았음)."
      - "2019 Q4 ~ 2024 Q1: 차상호가 가짜 수출계약 분기당 3-4건씩 결재.
        품목은 반도체 부품 (실재 수출은 30%, 나머지 70% 가 가짜)."
      - "2024 Q2 (4월): 김도현이 분기 감사 자료 검토 중 SPC 인보이스
        대조표에서 차이 발견. 미영을 통해 우회 조사 시작."
      - "2024 Q2 (5월 14일): 백승재 명예퇴직 통보. 차상호 직접 처리.
        합의서 5년 NDA 박힘."
      - "2024 Q2 (6월 8일): 도현 실종. 마지막 동선 — 6월 5일 분당 본가
        진입 → 6월 6일 새벽 강남 호텔 진입 → 6월 7일 새벽 빠져나감 →
        6월 8일 정오 회사 휴대폰 전원 off."
      - "2024 Q3 (8월): 백승재가 을지로 7층 사무실 개업. 첫 의뢰 = 김승기."
    누적_횡령액: 1,847억원 (FY2019 ~ FY2024 1Q)
    분기별_평균: 약 80~100억
    가짜_계약_총건수: 64건 (FY2019~2024)
    실제_사용처:
      - "회장 김승철 차명 부동산: 강남 도곡동 빌딩 1동 (2021), 제주 표선
        리조트 토지 (2022)."
      - "장기철 전무 차명 신탁: 골드만삭스 홍콩 명의로 운용 중 (약 600억)."
      - "정치권 후원금: 2020 총선 당시 양당 의원 11명에게 분산 (확인된
        금액 약 22억)."
      - "임원 보너스 위장 환원: 차상호 자녀 명의 부동산 신탁 (약 40억)."

  signatories:
    chair_silent: 김승철 (현 회장, 67세) — 직접 결재 안 함, 묵인.
    actual_orchestrator: 장기철 (지주 비서실장 전무, 58세) — 자금 사용처 결정.
    operator: 차상호 (해외사업본부장 상무, 54세) — 가짜 인보이스 결재.
    auditor: 오정태 (감사실장, 51세) — 결재 후 감사 통과 처리.
    protected: 김승기 (부회장, 62세) — 의도적으로 결재 라인에서 빠짐.

dohyun_evidence:
  usb:
    summary: |
      도현이 2024년 4~5월 사이에 회사 내부망에서 빼돌려 정리한 4개 묶음.
      USB 본체는 북한산 암자 평상 밑 궤짝에 (도현이 원장 스님께 맡김).
      복사본 한 세트는 미영의 로펌 사무실 금고에.
    item_1_ledger_photos:
      label: 회계 장부 사진 18장
      detail: |
        FY2023 3분기 가짜 수출계약 12건 + FY2024 1분기 8건 결재본 사진.
        각 장에 차상호 인감, 오정태 감사 인감, 일부 장기철 직인 확인.
        촬영 시점: 2024년 4월 17~19일 새벽. 본사 16층 감사실 자료실.
    item_2_swift_codes:
      label: SWIFT 송금 기록 14건
      detail: |
        싱가포르 SPC → 그룹 자회사 → 회장 차명계좌 (홍콩 HSBC) +
        장기철 차명 신탁 (싱가포르 OCBC). 송금 분기마다 정산.
        총액 612억 (해당 14건 합).
    item_3_emails:
      label: 차상호 → 오정태 결재 요청 이메일 11건
      detail: |
        2022년 11월 ~ 2024년 3월. 본문에 "이번 분기분 정리 부탁드립니다"
        같은 사무적 톤이지만 첨부 파일명이 가짜 인보이스 번호와 일치.
    item_4_kakao:
      label: 차상호 ↔ 장기철 비서실장 김OO 카톡 47건
      detail: |
        송금 일정 조율, "이번 주 안에 OCBC 계좌로", "수치 한 자리 빼고
        다시" 같은 구체. 카카오톡 백업 자료 (도현이 차상호 휴대폰 백업
        파일에서 추출).
  recording:
    summary: |
      북한산 암자에서 도현이 디지털 녹음기에 직접 녹음한 12분 30초.
      USB 내용을 사람 이름·금액·날짜로 정리한 본인 진술.
      마지막 1분 30초가 "백승재 실장님께" 시작하는 메시지.
    closing_message: |
      "백 실장님께. 이 녹음을 들으시는 시점이 제가 돌아오지 못하는
      시점이라는 뜻일 겁니다. 한 가지만 미리 정리해 두겠습니다.
      실장님이 2019년에 만드신 SPC 구조는 정상 해외법인 운영을
      전제로 한 설계였고, 그게 가짜 인보이스 통로로 쓰이는 데
      실장님이 동의하신 적은 없다고 저는 봅니다. 다만 그 구조 위에서
      차상무가 무엇을 했는지에 대한 부분 책임은 실장님 쪽에도
      한 줄로 닿아 있습니다. 그 한 줄을 어떻게 가져가실지는 실장님
      몫이고, 저는 이 녹음을 실장님께 두는 것으로 제 몫을 정합니다.
      미영한테는 제가 돌아오겠다고 했습니다. 돌아오면 그 한 문장
      직접 드릴 거고, 못 돌아오면 실장님이 한 번 대신 전해 주시면
      고맙겠습니다."

# ─── 인물별 진실 ──────────────────────────────────────

characters:
  seungjae:
    name: 백승재
    age: 46
    role_in_case: |
      2019년 SPC 법인 설계자. 본인은 정상 해외법인 운영 전제로 만들었고
      가짜 인보이스 운영 라인은 차상호가 본인 본부장 권한으로 별도 가동.
      백승재는 SPC 구조의 첫 6개월간 분기 정산 대조표를 본인이 직접
      검토했고, 그 시점엔 가짜 인보이스 비율이 약 15% (정상 범위 위장
      가능 수준). 2020년부터 차상호가 비율을 70% 까지 올렸지만 그 시점
      엔 백승재는 다른 부서 (해외사업본부 운영지원팀) 로 옮겨 있어
      실시간 결재 라인 밖에 있었음.
    moral_grey: |
      백승재는 "내가 만든 구조가 가짜 통로로 쓰일 가능성을 완전히
      배제하지 않았다" 는 사실을 본인 안엔 알고 있음. 다만 본인이 만든
      구조에 대한 형식적 검토만 했고 실제 가짜 인보이스 결재 한 번도
      안 함. 법적으론 무혐의 가능, 도덕적으론 회색.
    why_fired: |
      2024년 4월 도현이 미영을 통해 SPC 흐름을 캐기 시작 → 차상호가
      도현 라인을 추적 중 백승재가 SPC 설계자라는 사실이 도현 노트에
      적혀 있는 걸 보안실 라인이 발견 → 차상호가 백승재가 도현에게
      먼저 입을 열까 봐 선제적으로 정리. 5년 NDA 는 백승재의 SPC 지식
      유출을 막기 위한 봉합.
    pc_knows_at_start:
      - "본인이 SPC 를 설계했다는 사실 (2019년 일)."
      - "본인이 명예퇴직 강제당했다는 사실."
      - "5년 NDA 가 비정상적으로 길다는 사실."
      - "도현이 누구인지 (그룹 3세, 회장 외아들)."
    pc_doesnt_know_at_start:
      - "본인이 만든 SPC 가 가짜 인보이스 통로로 쓰이고 있었다는 사실."
      - "도현이 본인 이름을 본인 노트에 적어 두었다는 사실."
      - "본인 해고가 도현 라인 보호 차원이었다는 사실."
      - "장기철·오정태가 라인의 실제 운용자라는 사실."
    family_status:
      wife: 민영 (43, 외국계 마케팅 회사 부장)
      daughter: 하진 (14)
      separated_since: 2024년 9월 (별거 6개월차)
      separation_reason: |
        명예퇴직 후 백승재가 두 달간 집에서 거의 말을 안 하고 새벽까지
        TV 만 켜 두는 상태. 민영이 먼저 "잠시 떨어져 지내자" 제안.
        법적 이혼 절차는 시작 안 함. 하진은 엄마와 거주, 격주 주말 만남.

  cha_sangmu:
    name: 차상호
    age: 54
    title: 해외사업본부 본부장 상무
    role_in_case: |
      가짜 수출계약 결재 운영자. 본인 인감으로 64건 결재. 자금 흐름의
      마지막 분배 라인은 모르고 (장기철 비서실에서 처리), 본인은 운용
      수수료 명목으로 분기당 약 1.2~1.5억씩 받음. 위장 이혼으로 본인
      자녀 명의 부동산 신탁에 약 40억 누적.
    relationship_to_pc: |
      백승재 전략기획실 사수. 백승재의 18년 회사 생활 동안 결재 도장
      두 번 같이 맞아 줬고, 결혼식 주례 후보로도 한 번 거론됨. 본인이
      백승재를 자른 것에 대해 도덕적 부담 있음.
    leverage_over_pc:
      - "5년 NDA — 백승재가 SPC 얘기를 외부에 흘리면 손해배상 청구 가능."
      - "복귀 카드 — 부본부장급 자리 + 연봉 보장 (7장에서 제시)."
      - "공포 카드 — 백승재가 SPC 설계자라는 사실. 외부에 흘러가면
        백승재 본인도 같이 박힘."
      - "도현 위치 정보 — 본인이 일부 알고 있음 (남쪽 = 통영 외곽)."
    knows:
      - "도현 USB 의 존재. 안 내용까지는 모름 (부분만 추정)."
      - "백승재가 SPC 설계자라는 사실."
      - "이수연이 차 상무를 1년째 추적 중이라는 사실."
      - "도현 위치 — 통영 외곽 모텔. 직접 안 갔지만 보안실 라인을 통해."
    doesnt_know:
      - "도현이 북한산 암자에 녹음기를 남겼다는 사실 (7장에서 알게 됨)."
      - "미영이 USB 사본을 갖고 있다는 사실 (8장 silence 분기에서 알게 됨)."
      - "백승재가 도현 녹음을 들었는지 여부 (c6_decision 결과로 추정)."

  kim_sunggi:
    name: 김승기
    age: 62
    title: 대정그룹 부회장
    relationship_to_chair: |
      현 회장 김승철의 동생. 1990년대 후반 후계 구도에서 형이 승계받고
      본인은 부회장 자리로 밀려남. 그 이후 30년간 그룹 안에서 형식적
      2인자로 살았지만 실권은 점점 줄어듦. 회장 외아들 도현이 후계로
      굳어지면 본인 라인은 영구 단절.
    role_in_case: |
      SPC 운영 라인에 의도적으로 안 들어감. 본인은 형(회장)과 차상호·
      장기철의 자금 라인이 어떻게 굴러가는지 70% 정도 인지하고 있지만
      본인 손에 결재 한 번 안 박혔음. 이 의도된 거리감이 본인의 유일한
      자산.
    why_hire_pc: |
      도현 실종 → 후계 공백 발생 → 만약 도현이 살아 있고 USB 가 외부에
      나가면 형 김승철이 박힘 → 김승기 본인의 차세대 라인 (본인 사위
      쪽 라인) 회복 가능. 따라서 김승기는 도현이 살아 있는지, USB 가
      어디 있는지를 알아야 함. 차상호 손에 잘린 백승재를 의뢰자로 고른
      건 (1) 차상호 라인이 못 건드리는 사람 (2) 외부에 풀 의지 가능
      (3) 본인 손은 안 더럽힘.
    leverage_over_pc:
      - "의뢰비 — 5천만원 선금 + 성공 보수 (계약상)."
      - "외부 채널 조항 — 백승재가 협조하면 김승기 본인 인맥 라인 사용
        가능 (이수연 같은 외부 카드)."
      - "두 달 전 합의서 위약금 — 김승기가 차상호 라인에 한 번 흘리면
        백승재의 5년 NDA 위약금 청구가 즉시 들어옴."
      - "그룹 내 신뢰 — 백승재가 그룹에 다시 들어가고 싶어할 때
        김승기 라인이 유일한 통로."
    knows:
      - "SPC 자금 라인이 형(회장) → 장기철 → 차상호 → 오정태 순으로
        굴러가고 있다는 사실 (개략)."
      - "도현이 그 라인을 캐다가 사라졌다는 사실."
      - "차상호가 백승재를 잘랐다는 사실, 그 이유."
    doesnt_know:
      - "도현 USB 의 정확한 내용."
      - "도현이 북한산 암자에 녹음기를 남겼다는 사실."
      - "미영이 USB 사본을 갖고 있다는 사실."
      - "도현이 살아 있는지 여부."

  miyoung:
    name: 미영
    age: 28
    title: 광명 법무법인 송무팀 변호사 3년차
    firm_conflict: |
      광명 법무법인은 대정그룹 자문 로펌 (15년차). 미영이 직접 폭로
      하면 광명 → 그룹 자문 끊김 → 미영 본인 커리어 끝 + 광명 파트너
      들이 미영을 정리. 미영이 "두 번째 자리" "다음 자리" 같은 표현을
      쓰는 건 본인이 직접 폭로하지 못하는 위치라서 백승재를 통해
      외부에 풀어내야 한다는 계산.
    relationship_to_dohyun: |
      약혼은 양쪽 집안 강요. 본인은 처음부터 정리 의향. 도현은 본인이
      회사 안에서 무언가 캐고 있다는 걸 미영에게 일부 공유 (정확한
      USB 내용까지는 안 깜). 미영이 도현 USB 사본 한 세트와 "백 실장님
      앞으로" 라고 적힌 친필 편지 봉투 한 장을 자기 사무실 금고에
      보관 중.
    knows:
      - "도현 USB 의 존재 + 사본을 본인이 갖고 있음."
      - "도현이 북한산 암자에 본체를 두고 갔다는 사실."
      - "도현이 살아 있다는 사실 (실종 2주차에 도현이 본인에게 한 줄
        문자 — '나 미영이야. 너한테 그 문장 기억나지.' 그 문장은 둘만
        아는 5년 전 약혼 무렵 농담)."
      - "차상호 비서실의 한 명이 도현 실종 새벽 두 시 오피스텔에
        있었다는 사실 (도현 휴대폰의 마지막 위치 데이터)."
      - "백승재가 SPC 설계자라는 사실 (도현이 미영에게 공유)."
    doesnt_know:
      - "도현의 정확한 위치 (살아 있다 정도까지만)."
      - "장기철의 차명 신탁 규모 (구조만 알고 금액 모름)."
    leverage_over_pc:
      - "USB 사본 한 세트 — 백승재가 외부 라인 (이수연) 으로 풀려면
        이 사본이 핵심."
      - "도현 친필 편지 — 백승재 앞으로 봉투. 도현이 백승재를 의뢰자
        라인으로 미리 박아 둔 증거."
      - "도현 생사 정보 — 익명 문자 한 통으로 본인만 확신."
      - "광명 로펌 그룹 자문 라인 — 백승재가 차상호와 협상할 때
        법적 자문 가능."

  sooyeon:
    name: 이수연
    age: 35
    title: 시사주간지 <이북> 파이낸셜 데스크 10년차
    background: |
      파이낸셜 출신. 그룹 자금 라인 추적이 본인 전공. 이혼 1회 (2021,
      자녀 없음). 마포 합정 4층 13평 오피스텔에서 단독 거주.
    sibling_line: |
      친동생 이수정 (32) 이 회장 김승철의 옛 비서실 출신. 2018년 그룹
      퇴사 후 서울시 산하 재단으로 이직했지만 그룹 안 인맥 (특히
      오정태와 입사 동기) 그대로 유지. 미영이 이걸 모름.
    investigation_status: |
      대정 SPC 라인을 1년 (2023년 가을부터) 추적 중. 데스크 차장과
      파이낸셜 기자 두 명 + 본인 = 4인 팀. 도현 실종 직후 1차 보고서
      올림 — 데스크가 "증거 부족, 차상호 인감만 있으면 안 됨" 으로
      보류. 백승재가 USB 들고 오면 즉시 출고 가능.
    knows:
      - "SPC 자금 라인의 큰 그림 (장기철·차상호·오정태)."
      - "백승재가 차상호 손에 잘렸다는 사실, 그 이유의 70%."
      - "도현이 USB 작업을 했다는 사실 (소문 + 미영의 침묵으로 추정)."
      - "오정훈 (보안실장) 이 오정태의 동생이라는 사실."
      - "도현 실종 새벽 두 시 오피스텔 방문자가 보안실 라인이라는 사실."
    doesnt_know:
      - "USB 의 정확한 4가지 항목 내용."
      - "도현이 살아 있는지 여부 (50:50 으로 봄)."
      - "미영이 USB 사본을 갖고 있다는 사실."
      - "백승재가 SPC 설계자라는 사실 (이건 끝까지 추측만)."
    leverage_over_pc:
      - "외부 라인 — 주간 <이북> 게재 가능. 1면 둘째 줄에 차상호
        이름 박을 권한이 있음 (데스크 차장 통과 시)."
      - "복제본 보관 라인 — 본인 데스크 금고 + 백승재 변호사 (미영)
        쪽 분산 가능."
      - "내부 정보 라인 — 보안실 명령 라인, 회장 비서실 동향, 그룹
        주가 흐름."
      - "감시중 명단 — 차상호가 이미 본인 팀의 추적 대상이라는 사실."

  jang_jeonmu:
    name: 장기철
    age: 58
    title: 대정그룹 지주 비서실장 전무
    role_in_case: |
      자금 사용처 결정의 실제 결정자. 본인 차명 신탁으로만 약 600억
      누적 (싱가포르 OCBC, 골드만삭스 홍콩 운용). 백승재의 5년 NDA
      를 박은 사람 — 본인이 직접 합의서에 줄을 그었음 (차상호는 전달
      자만 됨).
    role_in_dohyun_disappearance: |
      도현 실종을 직접 명령. "실종" 까지만 명령했고 "처리" 는 명령 안
      함 (도현은 살아 있음). 비서실장 김OO 가 보안실장 오정훈에게
      지시 → 새벽 두 시 오피스텔 방문 → 도현을 일정 기간 차단 (2주
      통영 외곽 안전가옥 → 이후 도현 본인이 빠져나가 자유 도주 중).
    knows:
      - "SPC 라인의 모든 자금 흐름 + 사용처."
      - "도현이 USB 를 갖고 있었다는 사실, 다만 USB 본체 행방 모름."
      - "백승재가 SPC 설계자였다는 사실 + 5년 NDA 가 본인 손에서 박힌
        이유."
      - "이수연 팀이 추적 중이라는 사실 (보안실 라인으로 인지)."
    doesnt_know:
      - "북한산 암자에 USB 가 있다는 사실."
      - "도현이 현재 통영에서 빠져나와 어디 있는지 (안전가옥 탈출
        이후 행방불명)."
      - "미영이 USB 사본을 갖고 있다는 사실."
    leverage_over_pc:
      - "회장 직보 라인 — 그룹 위쪽 모든 결정의 실제 라인."
      - "5년 NDA 박은 사람 — 위약금 청구 권한 본인."
      - "보안실 명령 라인 — 동생 오정훈을 통한 미행/감시 가용."
      - "정치권 후원 라인 — 검찰·국세청 고위급 인맥."
    confrontation_appearance: |
      c7-confrontation 에서 본인 비서실 라인 한 사람 (비서실장 김OO,
      45세) 이 차상호 옆에 앉아 있음. 장기철 본인은 절대 직접 등장
      안 함 — 본인 손은 끝까지 깨끗.

  oh_gamsa:
    name: 오정태
    age: 51
    title: 대정그룹 감사실장
    role_in_case: |
      차상호의 가짜 인보이스 결재본을 분기마다 감사 통과 처리. 본인
      도장 64건 다 박혔음. 본인은 운용 수수료 분기당 약 8천 받음.
    sibling: |
      친동생 오정훈 (35) 이 그룹 본사 보안실장. 도현 실종 새벽 두 시
      오피스텔 출입 사인을 본인이 박음 (장기철 비서실 명령 받고).
    knows:
