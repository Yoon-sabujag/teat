id: c7-confrontation
title: "본사 27층"
background: gwanghwamun-vip
cast:
  - npc: cha-sangmu
    position: center
    expression: tense
entry: arrive

# 정면 라인. c6_decision = confront. 차 상무 카페 자리 대신 그룹 본사 27층
# 회의실에서 차 상무 + 한 사람 더 앉아 있는 자리에 PC가 들어간다.
nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 광화문 본사 27층, VIP 회의실. 두 달 전 내가 마지막으로 들어가 본 층이었고, 두 달 만에 직원 출입증 없이 들어가 보는 층이었다. 안내 데스크에서 임시 패스 한 장을 받았고, 패스 위에 인쇄된 이름은 '백승재'가 아니라 '방문객'이었다.
      - speaker: narration
        text: 회의실 안엔 차 상무 한 명이 아니었다. 차 상무 옆 자리에 회색 슈트의 또 한 사람. 50대 중반, 말끔한 옆가르마, 손목엔 IWC. 그룹 지주 쪽 장 전무 비서실의 한 사람으로 추정. 정면으로 마주 앉기엔 한 자리가 모자랐다.
      - speaker: cha-sangmu
        text: 승재씨, 오셨네요. 자리는 이쪽으로.
        expression: weary
      - speaker: thought
        text: 둘이 앉아 있었다. 오늘 이 자리는 차 상무 단독 자리가 아니라 차 상무가 한 칸 옆으로 밀려 있는 자리다. 그 한 칸이 누군지가 오늘의 진짜 무게다.
    next: opening
  opening:
    id: opening
    cast:
      - npc: cha-sangmu
        position: left
        expression: weary
    lines:
      - speaker: cha-sangmu
        text: 승재씨가 오늘 본사로 들어오신 거, 저희 쪽도 한 번 정리하고 받았습니다. 카페 자리 대신 이 자리 잡으신 의도를 먼저 들어 보고 시작하죠.
        expression: grim
    choices:
      - id: open-direct
        label: 두 달 전 합의서, 5년 조항. 그 숫자 박은 사람을 오늘 보러 왔습니다.
        check: { stat: gwonmo, dc: 12 }
        success:
          next: pressure-success
          effects:
            - kind: flag
              key: c7_conf_open
              value: direct
            - kind: memory
              text: 본사 27층에서 5년 조항 박은 윗선을 정면 호명. 차 상무 옆자리 사람이 한 박자 굳어짐.
        failure:
          next: pressure-deflected
          effects:
            - kind: flag
              key: c7_conf_open
              value: direct_failed
      - id: open-quiet
        label: 오늘은 듣는 자리로 왔습니다.
        next: pressure-quiet
        effects:
          - kind: flag
            key: c7_conf_open
            value: quiet
      - id: open-record
        label: 도현이 남긴 녹음 안에 누가 박혀 있는지, 두 분이 더 잘 아실 겁니다.
        check: { stat: ttuksim, dc: 13 }
        requires:
          flag: heard_dohyun_recording
        success:
          next: pressure-recording
          effects:
            - kind: flag
              key: c7_conf_open
              value: recording_bluff
            - kind: memory
              text: 본사 27층에서 녹음 존재 시사. 차 상무 옆자리 사람이 처음 한 번 입을 뗐다.
        failure:
          next: pressure-deflected
          effects:
            - kind: flag
              key: c7_conf_open
              value: recording_called

  pressure-success:
    id: pressure-success
    cast:
      - npc: cha-sangmu
        position: left
        expression: tense
    lines:
      - speaker: narration
        text: 차 상무 옆자리 사람이 처음으로 옆으로 한 번 시선을 옮겼다. 차 상무가 그 시선을 한 박자 받아 내고 다시 내 쪽으로 돌렸다.
      - speaker: cha-sangmu
        text: 승재씨, 그 숫자 박은 사람이 누구인지를 직접 호명하시는 거, 저는 받습니다. 다만 이 자리에서 그 이름이 답으로 돌아오진 않을 겁니다.
        expression: grim
      - speaker: thought
        text: 호명 자체가 답이었다. 차 상무가 그 사람의 이름을 부정하지 않은 채 자리에서 한 칸 물러섰다. 옆자리 사람이 누구인지는 오늘 이 회의실 안에서 가장 두꺼운 침묵이 대답했다.
        effects:
          - kind: flag
            key: jang_present
            value: true
          - kind: memory
            text: 장 전무 비서실 라인 사람이 차 상무 옆에 동석. 5년 조항이 그 위에서 박혔음을 침묵으로 시사.
    next: final-decision

  pressure-recording:
    id: pressure-recording
    cast:
      - npc: cha-sangmu
        position: left
        expression: shock
    lines:
      - speaker: narration
        text: 차 상무가 잔의 손잡이 한 번 돌렸다. 옆자리 사람이 천천히 자기 IWC를 한 번 들여다보고 다시 자세를 잡았다.
      - speaker: cha-sangmu
        text: 그 녹음의 존재는 어제 저희 쪽 라인에서도 한 번 올라왔습니다. 다만 오늘 이 자리에서 들으실 분이 있을지는 승재씨가 한 번 더 생각해 보셔야 할 거고요.
        expression: weary
      - speaker: thought
        text: 옆자리 사람이 한 번 시계를 본 건 시간이 없다는 신호가 아니라, 이 자리에 자기가 있다는 사실 자체가 카드라는 신호다. 녹음은 알고 있고, 오늘 자리는 그 녹음의 바깥 사람을 한 번 재 보는 자리.
        effects:
          - kind: flag
            key: jang_present
            value: true
    next: final-decision

  pressure-quiet:
    id: pressure-quiet
    cast:
      - npc: cha-sangmu
        position: left
        expression: amused
    lines:
      - speaker: cha-sangmu
        text: 듣는 자리시면 저도 편합니다. 다만 오늘 이 자리, 양쪽 다 듣기만 하다 끝나면 그 자체가 한 줄 답으로 정리될 거고요.
        expression: weary
      - speaker: thought
        text: 듣는 자세는 내 쪽 카드를 안 까는 자세이지만, 동시에 저쪽도 안 까도 되는 자세를 만들어 준다. 두 자리 다 침묵이면 결국 무게추는 본사 쪽으로 기운다.
    next: final-decision

  pressure-deflected:
    id: pressure-deflected
    cast:
      - npc: cha-sangmu
        position: left
        expression: weary
    lines:
      - speaker: cha-sangmu
        text: 승재씨, 그 톤은 오늘 이 자리에 어울리는 톤이 아닙니다. 한 박자 늦춰서 다시 시작하죠.
        expression: grim
      - speaker: thought
        text: 정면 카드를 한 칸 일찍 깠다. 옆자리 사람이 자기 자세를 한 번도 흔들지 않았다는 사실이, 오늘 이 자리에서 가장 무거운 결과다.
    next: final-decision

  final-decision:
    id: final-decision
    cast:
      - npc: cha-sangmu
        position: left
        expression: grim
    lines:
      - speaker: cha-sangmu
        text: 자리 정리하시기 전에 한 줄만 정해 주시죠. 오늘 이후 며칠을 어떤 자세로 가실지.
        expression: weary
    choices:
      - id: end-public
        label: 오늘 이 자리, 외부에 공개합니다.
        check: { stat: ttuksim, dc: 12 }
        requires:
          flag: jang_present
        success:
          next: close-public
          effects:
            - kind: flag
              key: c7_end
              value: public
            - kind: memory
              text: 본사 27층에서 정면 공개 선언. 차 상무 + 장 라인 한 사람이 동석한 자리 자체가 한 줄로 외부에 나간다.
        failure:
          next: close-public-shaky
          effects:
            - kind: flag
              key: c7_end
              value: silence_leak
      - id: end-silence
        label: 오늘 자리, 제 쪽에선 없는 자리로 정리하겠습니다.
        next: close-silence
        effects:
          - kind: flag
            key: c7_end
            value: silence
          - kind: memory
            text: 본사 27층 자리를 없던 자리로 정리. 옆자리 사람의 이름은 내 쪽 기억 밖에 안 남는다.
      - id: end-defer
        label: 오늘은 여기까지. 다음 자리는 제가 잡아서 연락드립니다.
        next: close-defer
        effects:
          - kind: flag
            key: c7_end
            value: defer
          - kind: memory
            text: 본사 자리 유예 처리. 다음 자리는 내 쪽이 잡지만 27층은 한 번 본 셈.

  close-public:
    id: close-public
    lines:
      - speaker: cha-sangmu
        text: 그러시군요. 27층까지 오신 분이 그 한 줄로 자리를 정리하시면, 저희 쪽도 그 한 줄에 맞춰 움직입니다.
        expression: grim
      - speaker: narration
        text: 옆자리 사람이 처음으로 자리에서 일어났다. 회의실 문이 열렸고, 그 사람이 먼저 나갔다. 차 상무는 끝까지 자리에 앉은 채로 자기 잔을 한 번 더 돌렸다.
    next: depart

  close-public-shaky:
    id: close-public-shaky
    lines:
      - speaker: cha-sangmu
        text: 공개 쪽으로 가시는 거 받습니다. 다만 오늘 이 자리, 옆자리 분 시선 한 번 가져오시는 데 한 박자 늦으셨어요. 그 한 박자가 다음 주 어딘가에서 청구로 돌아옵니다.
        expression: weary
    next: depart

  close-silence:
    id: close-silence
    lines:
      - speaker: cha-sangmu
        text: 그 한 줄, 받습니다. 승재씨가 오늘 이 자리에 앉지 않으신 걸로 본사 쪽 내부 보고도 정리하겠습니다.
        expression: neutral
    next: depart

  close-defer:
    id: close-defer
    lines:
      - speaker: cha-sangmu
        text: 그러시죠. 오늘 들어오신 분, 한 번 본 걸로 충분합니다. 다음 자리는 승재씨 쪽 일정 맞춰 주십시오.
        expression: weary
    next: depart

  depart:
    id: depart
    cast: []
    lines:
      - speaker: narration
        text: 27층 엘리베이터 안에 혼자였다. 1층까지 내려가는 동안 거울 벽 한 면에 비친 내 그림자가 두 달 전 같은 엘리베이터에 탔던 그림자보다 한 뼘 더 굳어 있었다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 27층에서 옆자리 사람의 이름을 한 줄로 가져 나왔다. 그 한 줄이 내일 아침 어느 신문 한 면 위에 어떻게 자리 잡을지가 오늘 이후의 첫 변수.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 27층까지 들어가서 한 번 보고 나오는 자리로 정리. 옆자리 사람의 자세 한 칸이 내 쪽 기억엔 박혔다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 공개 쪽으로 갔지만 한 박자 늦은 카드였다. 다음 주 어딘가에서 그 한 박자가 다시 한 번 내 쪽 자리에 돌아와 앉는다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 한 번 본 자리. 다음 자리는 내 쪽이 잡지만, 27층은 이미 내가 한 번 보고 나온 층이라는 사실이 다음 자리의 무게.
      - speaker: narration
        text: 본사 회전문을 나오자 광화문 사거리의 정오 햇빛이 정면으로 쏟아졌고, 그 빛 아래 처음 한 발을 내딛었다.
        effects:
          - kind: chapterComplete
            chapter: chapter-7
            nextChapter: chapter-8
