id: c7-cafe
title: "카페에서"
background: gwanghwamun-cafe
cast:
  - npc: cha-sangmu
    position: center
    expression: neutral
entry: arrive

nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 광화문 본사에서 두 블록 떨어진 곳, 1층이 유리로 된 체인 카페. 아침 여덟 시 십오 분이라 앞자리는 출근 넥타이들로 가득 찼고, 벽 쪽 구석 테이블 한 개만 두 자리 떨어져 비어 있었다. 차 상무는 그 구석 자리에 먼저 와 앉아 있었고, 검은 캐시미어 코트를 의자 등받이가 아닌 옆 빈 의자에 따로 개어 놓았다.
      - speaker: narration
        text: 테이블 위엔 커피 두 잔이 이미 나와 있었다. 한 잔은 차 상무 앞, 한 잔은 내 자리 앞. 두 잔 다 같은 브랜드, 같은 사이즈, 같은 정도의 김이 올라왔다. 내가 무엇을 주문할지 그가 이미 한 번 계산한 자리라는 신호가 테이블 위에 먼저 앉아 있었다.
      - speaker: thought
        requires:
          flagEquals:
            key: c6_decision
            value: expose
        text: 코트 안주머니의 녹음기가 이수연 쪽 수신기와 지금 이 순간 같은 시간선 위에 있다. 오늘 이 자리에서 오가는 문장 중 절반 이상이 주간지 편집국 쪽 테이블에도 올라간다.
      - speaker: thought
        requires:
          flagEquals:
            key: c6_decision
            value: leverage
        text: 녹음은 오늘 아침 한 번 들은 채로 주머니 안에 있다. 오늘 꺼낼지 말지를 이 사람의 첫 한 줄이 결정해 주길 기다리는 쪽으로 앉는다.
      - speaker: thought
        requires:
          flagEquals:
            key: c6_decision
            value: confront
        text: 녹음 얘기는 오늘 이 자리에서 꺼내지 않는다. 내가 들고 갈 건 조각 몇 개와 두 달 누적된 내 피로뿐이다.
      - speaker: thought
        requires:
          flagEquals:
            key: c6_decision
            value: postpone
        text: 오늘 자리는 듣는 쪽. 내 쪽 카드는 오늘 테이블 위에 올리지 않는다. 그 원칙 하나만 머릿속에 먼저 박아 둔다.
      - speaker: cha-sangmu
        text: 승재씨, 오셨네요. 커피 이미 시켰어요. 싫으시면 바꿔 드리고요.
        expression: smile
    choices:
      - id: sit-quiet
        label: (아무 말 없이 앉는다.)
        next: first-exchange
        effects:
          - kind: flag
            key: c7_sit
            value: quiet
      - id: sit-warm
        label: 고맙습니다, 상무님.
        next: first-exchange
        effects:
          - kind: flag
            key: c7_sit
            value: warm
      - id: sit-sharp
        label: 용건부터 들려주시죠.
        check: { stat: gwonmo, dc: 13 }
        success:
          next: first-exchange
          effects:
            - kind: flag
              key: c7_sit
              value: sharp
            - kind: memory
              text: 카페 착석 직후 차 상무의 커피 세팅을 바로 넘기고 용건 쪽으로 테이블 톤 당김.
        failure:
          next: first-exchange
          effects:
            - kind: flag
              key: c7_sit
              value: sharp_flinch

  first-exchange:
    id: first-exchange
    lines:
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_sit
            value: sharp
        text: 좋아요. 그 톤이 오늘 자리 제일 편한 톤이에요. 저도 용건부터 드리죠.
        expression: weary
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_sit
            value: sharp_flinch
        text: 그 톤이 반 박자 떨리시네요. 괜찮아요, 오늘은 다 털고 가시라고 제가 먼저 자리 잡은 거니까요.
        expression: amused
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_sit
            value: warm
        text: 아, 이 커피집 커피가 생각보다 괜찮아요. 제가 요즘 여기서 아침을 많이 마셔서요.
        expression: smile
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_sit
            value: quiet
        text: 말 없이 앉으시는 승재씨, 프롤로그 때 자리부터 오늘 자리까지 계속 그 톤이시네요. 저는 그게 편해요.
        expression: neutral
      - speaker: cha-sangmu
        text: 솔직히 말씀드릴게요. 승재씨, 회사 다시 나오실 생각 없으세요.
        expression: weary
      - speaker: cha-sangmu
        text: 직위는 한 단계 위에서 시작합니다. 부본부장급. 계약은 3년, 연봉은 말씀 안 드려도 양반이 될 거고요. 제가 오늘 이 자리에서 구두로 승재씨 드릴 수 있는 선까지 먼저 깔아 둡니다.
        expression: grim
      - speaker: thought
        text: 차 상무가 첫 한 장으로 복귀 카드를 올렸다. 두 달 전 본사에서 나를 잘라낸 손이, 오늘 아침 그 잘라낸 자리로 다시 나를 앉히는 제안을 한다. 이 제안의 무게는 자리 그 자체가 아니라, 그 자리에 앉히는 쪽이 두 달 전의 그 손이라는 사실에 있다.
    choices:
      - id: offer-consider
        label: 고려해 보겠습니다.
        next: cha-offer-reaction
        effects:
          - kind: flag
            key: c7_offer
            value: consider
      - id: offer-reject
        label: 거절하겠습니다.
        check: { stat: ttuksim, dc: 13 }
        success:
          next: cha-offer-reaction
          effects:
            - kind: flag
              key: c7_offer
              value: reject_clean
        failure:
          next: cha-offer-reaction
          effects:
            - kind: flag
              key: c7_offer
              value: reject_flinch
      - id: offer-counter
        label: 다른 조건부로는 수락 가능합니다.
        check: { stat: gwonmo, dc: 14 }
        success:
          next: cha-offer-reaction
          effects:
            - kind: flag
              key: c7_offer
              value: counter_success
            - kind: memory
              text: 차 상무의 복귀 제안에 역조건 걸어 테이블 주도권 일부 가져옴.
        failure:
          next: cha-offer-reaction
          effects:
            - kind: flag
              key: c7_offer
              value: counter_failed
      - id: offer-redirect
        label: 상무님, 그 자리 말씀드리러 오신 건 아니시죠.
        check: { stat: jikgam, dc: 13 }
        success:
          next: cha-offer-reaction
          effects:
            - kind: flag
              key: c7_offer
              value: redirect
            - kind: memory
              text: 차 상무의 복귀 제안을 '진짜 용건이 아님'으로 한 번에 돌려 테이블 톤 전환.
        failure:
          next: cha-offer-reaction
          effects:
            - kind: flag
              key: c7_offer
              value: redirect_missed

  cha-offer-reaction:
    id: cha-offer-reaction
    lines:
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_offer
            value: consider
        text: 고려해 보신다는 말씀, 저는 '가능성 있음'으로 듣겠습니다. 저한테 편한 톤이에요.
        expression: smile
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_offer
            value: reject_clean
        text: 그러시군요. 깔끔하시네요. 깔끔한 거절은 저도 받아요. 다만 제가 오늘 드리는 자리가 내일도 그대로 있는 건 아닙니다.
        expression: grim
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_offer
            value: reject_flinch
        text: 거절은 하셨는데 어미 한 자 남기셨네요. 저는 그 한 자를 '협상 여지 있음' 쪽으로 쌓아 두겠습니다.
        expression: amused
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_offer
            value: counter_success
        text: 역제안이시라. 승재씨가 오늘 들고 오신 무게가 제가 예상한 무게보다 한 단계 위네요. 조건 한 번 들어 보죠.
        expression: grim
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_offer
            value: counter_failed
        text: 역제안이라기엔 승재씨 쪽 언어가 아직 다듬어지지 않으셨어요. 오늘 자리 말고 다음 자리에서 다시 받아 드릴게요.
        expression: weary
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_offer
            value: redirect
        text: …오, 참 네. 승재씨가 오늘은 저보다 한 박자 먼저 읽으시네요. 그럼 포장은 치우고 본 얘기로 갑시다.
        expression: grim
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_offer
            value: redirect_missed
        text: 아니요, 말씀드린 자리 진심이에요. 다만 그 자리 뒤로 제가 말씀드릴 본 얘기도 한 줄 있긴 하죠.
        expression: weary
      - speaker: cha-sangmu
        text: 본 얘기. 승재씨가 지난 두 달 동안 따라가신 라인, 저도 지금 다 봤습니다. 북한산, 강남 오피스텔, 청담 카페, 어제 저녁 을지 OB. 그 네 자리가 한 줄로 이어지는 그림 저도 한 장 들고 있습니다.
        expression: grim
      - speaker: cha-sangmu
        text: 그 그림에 대한 제 답은 단 한 가지예요. 승재씨, 지금 가신 그 라인 끝에서 승재씨가 만나는 건 도현이가 아니에요. 도현이가 이미 만난 사람이에요.
        expression: weary
      - speaker: thought
        text: '"도현이가 이미 만난 사람." 이 한 문장을 차 상무가 이 자리에서 꺼냈다는 건, 도현의 현 상태에 대한 자기 쪽 정보가 이미 나보다 한 뼘 앞에 있다는 시사다. 저 사람의 오늘 자리 목적이 복귀 제안이 아니라, 내가 그 끝까지 걷지 않게 만드는 쪽으로 정리됐다.'
    next: hub

  hub:
    id: hub
    lines:
      - speaker: cha-sangmu
        requires:
          flagNotEquals:
            key: c7_hub_turn
            value: true
        text: 편히 물으세요, 승재씨. 제가 답할 수 있는 선까지 답해 드릴게요.
        expression: weary
      - speaker: cha-sangmu
        requires:
          flag: c7_hub_turn
        text: 또 있으시면.
        expression: neutral
    choices:
      - id: ask-three-names
        label: 장 전무, 오 감사, 상무님. 이 세 이름에서 오늘 자리 시작하죠.
        requires:
          flag: knew_three_names
          flagNotEquals:
            key: c7_asked_names
            value: true
        next: cha-on-names
        effects:
          - kind: flag
            key: c7_asked_names
            value: true
          - kind: flag
            key: c7_hub_turn
            value: true
      - id: ask-hierarchy
        label: 위쪽은 장 전무, 양 날개는 상무님과 오 감사. 맞습니까.
        requires:
          flag: knew_hierarchy
          flagNotEquals:
            key: c7_asked_hierarchy
            value: true
        check: { stat: gwonmo, dc: 14 }
        success:
          next: cha-on-hierarchy-hit
          effects:
            - kind: flag
              key: c7_asked_hierarchy
              value: true
            - kind: flag
              key: c7_hub_turn
              value: true
            - kind: flag
              key: cha_confirmed_hierarchy
              value: true
            - kind: memory
              text: 차 상무가 위계(장 전무 위/본인·오 감사 양 날개)를 부인하지 못하는 한 박자의 표정을 내줬다.
        failure:
          next: cha-on-hierarchy-dodge
          effects:
            - kind: flag
              key: c7_asked_hierarchy
              value: true
            - kind: flag
              key: c7_hub_turn
              value: true
      - id: ask-nda
        label: 두 달 전 합의서의 5년 조항, 이유부터 말씀해 주시죠.
        requires:
          flag: noticed_nda
          flagNotEquals:
            key: c7_asked_nda
            value: true
        next: cha-on-nda
        effects:
          - kind: flag
            key: c7_asked_nda
            value: true
          - kind: flag
            key: c7_hub_turn
            value: true
      - id: ask-dohyun-where
        label: 도현이는 지금 어디 있습니까.
        requires:
          flagNotEquals:
            key: c7_asked_where
            value: true
        check: { stat: jikgam, dc: 15 }
        success:
          next: cha-on-where-hit
          effects:
            - kind: flag
              key: c7_asked_where
              value: true
            - kind: flag
              key: c7_hub_turn
              value: true
            - kind: flag
              key: cha_leaked_location_hint
              value: true
            - kind: memory
              text: 차 상무가 도현 위치에 대해 '남쪽' 정도의 방향 한 줄을 흘렸다. 지리적 압축 시작.
        failure:
          next: cha-on-where-miss
          effects:
            - kind: flag
              key: c7_asked_where
              value: true
            - kind: flag
              key: c7_hub_turn
              value: true
      - id: give-tape
        label: 상무님, 저한테 도현의 녹음이 있습니다.
        requires:
          flag: heard_dohyun_recording
          flagNotEquals:
            key: c7_revealed_tape
            value: true
        next: cha-on-tape
        effects:
          - kind: flag
            key: c7_revealed_tape
            value: true
          - kind: flag
            key: c7_hub_turn
            value: true
          - kind: memory
            text: 차 상무 앞에서 녹음기 존재를 공개. 이 자리 이후의 모든 판은 이 한 줄을 기준으로 재배치된다.
      - id: give-miyoung
        label: 미영 변호사까지 얘기 정리된 상태입니다.
        requires:
          flag: miyoung_was_there
          flagNotEquals:
            key: c7_revealed_miyoung
            value: true
        next: cha-on-miyoung
        effects:
          - kind: flag
            key: c7_revealed_miyoung
            value: true
          - kind: flag
            key: c7_hub_turn
            value: true
      - id: give-soo-yeon
        label: 주간 <이북> 시사팀, 이 건 이미 병렬로 가고 있습니다.
        requires:
          flag: cha_under_watch
          flagNotEquals:
            key: c7_revealed_press
            value: true
        next: cha-on-press
        effects:
          - kind: flag
            key: c7_revealed_press
            value: true
          - kind: flag
            key: c7_hub_turn
            value: true
      - id: end-hub
        label: (잔을 비우고 자리에서 일어선다.)
        requires:
          flag: c7_hub_turn
        next: final-decision

  cha-on-names:
    id: cha-on-names
    lines:
      - speaker: cha-sangmu
        text: 그 세 이름에서 시작하시는 거, 저한텐 반 정도 예상 안이에요. 승재씨가 오늘 이 자리 앞에서 그 세 이름을 한 줄에 놓으실 수 있게 된 경로 자체가 저한테 정보예요.
        expression: grim
      - speaker: cha-sangmu
        text: 답은 짧게 드립니다. 저는 그 셋 중 하나예요. 위아래는 오늘 이 자리에서 정리 안 합니다. 제가 지금 드릴 수 있는 한 줄은 그거까지예요.
        expression: weary
      - speaker: thought
        text: 세 이름 중 본인이 들어 있는 걸 부인하지 않았다. 저 한 줄은 내가 오늘 이 자리에서 받아 낼 수 있는 가장 큰 한 줄 중 하나다.
    next: hub

  cha-on-hierarchy-hit:
    id: cha-on-hierarchy-hit
    lines:
      - speaker: cha-sangmu
        text: …
        expression: tense
      - speaker: cha-sangmu
        text: 승재씨, 저는 오늘 그 질문에 '네'도 '아니요'도 드릴 수 없는 자리입니다.
        expression: grim
      - speaker: thought
        text: 그런데 '네도 아니요도 드릴 수 없다'는 자리는 그 판의 구조를 긍정한 사람만 앉을 수 있는 자리다. 위계는 확인됐다. 테이블 위에 글자로 나온 건 아니지만, 차 상무의 이 한 문장으로 내 쪽 기록엔 박혀 들어갔다.
    next: hub

  cha-on-hierarchy-dodge:
    id: cha-on-hierarchy-dodge
    lines:
      - speaker: cha-sangmu
        text: 승재씨, 그룹 조직도 한 장 내미시면서 그 안에 이름 박아 가며 설명하시는 건 그 언어 잘하시는 분이 할 일이고요, 저한텐 지금 어색해요.
        expression: amused
      - speaker: thought
        text: 질문의 각도가 미세하게 어긋났다. 차 상무가 '조직도 언어' 라는 말로 내 쪽 논리를 한 번 평가절하하고 지나갔다. 오늘 이 자리에서 이 라인은 더 못 판다.
    next: hub

  cha-on-nda:
    id: cha-on-nda
    lines:
      - speaker: cha-sangmu
        text: 승재씨, 그 5년이라는 숫자 앞에서 제가 오늘 꺼낼 답은 없습니다. 제가 그 숫자를 박은 사람이 아니라서요.
        expression: weary
      - speaker: cha-sangmu
        text: 다만 누가 박으신 숫자인지는 승재씨가 오늘 이 자리에 오신 이상 대충 짐작하실 거라고 보고요. 그 부분은 제가 확인해 드리지 않겠습니다.
        expression: grim
      - speaker: thought
        text: 합의서의 5년은 차 상무 라인이 아니라 그 위쪽에서 박힌 숫자다. 그 위쪽은 장 전무 혹은 그 근처. 이 한 줄 확인만으로도 두 달 전 이 방의 공기가 오늘 내 쪽으로 한 뼘 돌려 보내졌다.
        effects:
          - kind: flag
            key: nda_from_above
            value: true
          - kind: memory
            text: 합의서 5년 조항은 차 상무 윗선 — 장 전무 라인 — 이 박은 숫자. 차 상무가 부인하지 않음.
    next: hub

  cha-on-where-hit:
    id: cha-on-where-hit
    lines:
      - speaker: cha-sangmu
        text: …
        expression: tense
      - speaker: cha-sangmu
        text: 승재씨, 그 질문 저한테 안 하셨으면 합니다. 다만 방향만 한 줄 드리자면, 남쪽. 그 이상은 제가 오늘 말할 수 있는 말이 아닙니다.
        expression: grim
      - speaker: thought
        text: 남쪽. 반도 안쪽인지 바깥인지도 구분 안 되는 방향 한 줄이지만, 오늘 이 자리에서 내가 받아 낸 모든 카드 중 가장 비싼 한 줄이다.
    next: hub

  cha-on-where-miss:
    id: cha-on-where-miss
    lines:
      - speaker: cha-sangmu
        text: 승재씨. 그 질문 저한테 하시는 거, 저랑 승재씨 관계를 한 번에 깨실 생각 아니시죠.
        expression: grim
      - speaker: thought
        text: 질문 각도를 잘못 꽂았다. 차 상무 쪽 방어선이 내 직감 한 호흡 앞에 먼저 서 있었다.
    next: hub

  cha-on-tape:
    id: cha-on-tape
    lines:
      - speaker: narration
        text: 차 상무가 잠시 커피잔 손잡이를 엄지로 한 번 돌렸다. 테이블 위 물잔의 수위가 그 반 박자 안에 한 번 더 내려갔다.
      - speaker: cha-sangmu
        text: 녹음이요.
        expression: tense
      - speaker: cha-sangmu
        text: 그게 오늘 이 자리에서 승재씨 손에 있다는 건, 오늘 이 카페 의자에 앉은 자리가 두 명짜리 자리가 아니라 세 명짜리 자리였다는 뜻이네요.
        expression: grim
      - speaker: cha-sangmu
        text: 그 녹음 안쪽 내용까지 이 자리에서 듣고 싶어 하는 게 제 본심이긴 합니다만, 저는 오늘 그 청에 대한 권리가 없는 자리에 앉아 있어요.
        expression: weary
      - speaker: thought
        text: 차 상무가 녹음의 존재를 그 자리에서 공식화했다. 이 한 줄 이후의 모든 대화는 이 녹음이 이 테이블 위 어디쯤 놓여 있다는 전제 위에서 굴러간다.
        effects:
          - kind: flag
            key: cha_knows_tape_exists
            value: true
          - kind: memory
            text: 차 상무 앞에서 녹음 존재 공개 완료. 이후 이 자리의 모든 문장이 녹음의 존재를 전제로 움직인다.
    next: hub

  cha-on-miyoung:
    id: cha-on-miyoung
    lines:
      - speaker: cha-sangmu
        text: 미영 변호사 자리까지 가셨다면, 승재씨 쪽 한 달치 피로는 저도 대충 예상이 가요.
        expression: weary
      - speaker: cha-sangmu
        text: 다만 미영 씨 쪽이 제공하신 정보와 제가 지금 이 자리에서 드릴 수 있는 정보 사이엔 한 층 두꺼운 벽이 있어요. 미영 씨는 사건 안쪽 사람이고, 저는 사건 바깥쪽 사람이거든요.
        expression: grim
      - speaker: thought
        text: 본인이 사건 바깥쪽이라는 건 책임 회피 문장이고, 동시에 자기 위치가 그림 안에서 어디인지 다시 한 번 박아 두는 문장이다. 차 상무는 오늘 이 자리에서 '저는 실행자입니다' 라고 반쯤 인정한 셈이다.
    next: hub

  cha-on-press:
    id: cha-on-press
    lines:
      - speaker: cha-sangmu
        text: 기자 쪽 라인이 움직이고 있다는 건 저희 쪽도 이미 인식하고 있어요. 이수연 기자 이름은 어제 제 쪽 팀에서 한 번 올라왔고요.
        expression: grim
      - speaker: cha-sangmu
        text: 승재씨가 그 라인에 올라타신 이상, 오늘 이 자리는 이 건 전체의 마지막 조용한 자리가 될 가능성이 높아요. 그 전제로 제가 말씀드릴 수 있는 한 줄까지 오늘 다 드린다고 보시면 됩니다.
        expression: weary
      - speaker: thought
        text: 차 상무가 오늘 이 자리를 '마지막 조용한 자리'로 규정했다. 이 사람은 오늘 이후 이 건이 더 이상 조용할 수 없다는 걸 알고, 그 시끄러워지는 시점 전에 어떤 한 줄이라도 나에게 걸어 두려 하는 중이다.
    next: hub

  final-decision:
    id: final-decision
    lines:
      - speaker: cha-sangmu
        text: 승재씨, 자리 정리하시기 전에 저한테 한 줄만요.
        expression: grim
      - speaker: cha-sangmu
        text: 오늘 이 커피 두 잔 자리를, 어떤 자리로 끝내실지만 정해 주시면 제가 오늘 이 자리 뒷정리를 거기에 맞춰 드립니다.
        expression: weary
      - speaker: thought
        text: 저 사람이 오늘 이 카페 한 자리로 '한 달치 잔해' 의 전체 모양을 끝내고 싶어 하는 게 보인다. 오늘 내가 어떤 마지막 한 줄을 놓고 일어서느냐가, 다음 장의 문장 하나하나를 미리 재단한다.
    choices:
      - id: end-public
        label: 오늘 자리 이후 저는 공개 라인으로 갑니다.
        next: close-public
        effects:
          - kind: flag
            key: c7_end
            value: public
          - kind: memory
            text: 카페 퇴장 선언 — 공개 라인. 이수연 쪽 편집국과 내 쪽 시간선이 같이 움직인다.
      - id: end-deal
        label: 상무님이 오늘 그려 드린 그 자리, 조건부로 받겠습니다.
        check: { stat: gwonmo, dc: 14 }
        requires:
          flagEquals:
            key: c7_offer
            value: consider
        success:
          next: close-deal-clean
          effects:
            - kind: flag
              key: c7_end
              value: deal
            - kind: memory
              text: 카페 퇴장 선언 — 복귀·거래. 오늘 자리 이후 녹음기는 책상 서랍 안쪽으로 들어간다.
        failure:
          next: close-deal-tainted
          effects:
            - kind: flag
              key: c7_end
              value: deal_tainted
            - kind: memory
              text: 복귀·거래 선언했지만 조건 조율에 실패. 그쪽 계산서가 내 쪽보다 조금 더 두꺼웠다.
      - id: end-silence
        label: 오늘 자리, 제 쪽에선 없는 자리로 정리하겠습니다.
        check: { stat: ttuksim, dc: 13 }
        success:
          next: close-silence
          effects:
            - kind: flag
              key: c7_end
              value: silence
            - kind: memory
              text: 카페 퇴장 선언 — 오늘 자리는 '없던 자리'. 내 쪽 카드는 오늘 테이블 위에 남지 않는다.
        failure:
          next: close-silence-leak
          effects:
            - kind: flag
              key: c7_end
              value: silence_leak
            - kind: memory
              text: 침묵 쪽으로 간다고 선언했지만 말끝 한 자가 '조건부'로 읽혔다. 저쪽은 그 한 자를 들고 갔다.
      - id: end-defer
        label: 오늘은 여기까지. 다음 자리는 제가 잡아서 연락드립니다.
        next: close-defer
        effects:
          - kind: flag
            key: c7_end
            value: defer
          - kind: memory
            text: 카페 퇴장 선언 — 유예. 다음 자리는 내 쪽이 시간을 정한다.

  close-public:
    id: close-public
    lines:
      - speaker: cha-sangmu
        text: 그러시군요.
        expression: grim
      - speaker: cha-sangmu
        text: 오늘 이 자리가 제가 승재씨 앞에 앉는 마지막 자리가 되겠네요. 제 쪽 뒷정리를 그 전제로 시작하겠습니다. 좋은 하루 되세요, 백 실장님.
        expression: weary
      - speaker: narration
        text: 차 상무가 자리에서 먼저 일어났다. 의자 옆에 놓아 두었던 캐시미어 코트를 한 번에 걸치고, 테이블 위 커피잔 두 개를 스스로 계산대 쪽으로 가져갔다. 계산이 끝나는 동안 한 번도 내 쪽을 돌아보지 않았다.
    next: depart

  close-deal-clean:
    id: close-deal-clean
    lines:
      - speaker: cha-sangmu
        text: 그 선에서 얘기 정리되면, 저희 쪽은 오늘 이 자리 기준으로 다음 주 월요일부터 움직이겠습니다. 계약서 쪽 초안은 이번 주 안에요.
        expression: weary
      - speaker: cha-sangmu
        text: 승재씨, 오늘 이 자리 잘 끝내 주신 거 저는 두 번은 갚을게요.
        expression: smile
      - speaker: narration
        text: 두 번 갚겠다는 말의 첫 번은 이 커피 두 잔 계산 쪽으로 갔고, 두 번째 갚음은 오늘 이 자리 이후 내 이름의 위치를 정리하는 라인 쪽에 남게 된다. 그 두 번 갚음 사이에 도현이라는 이름은 테이블 위에 더 이상 없었다.
    next: depart

  close-deal-tainted:
    id: close-deal-tainted
    lines:
      - speaker: cha-sangmu
        text: 조건부 얘기 저희 쪽에서 한 번 더 다듬어 드리고요, 최종 선은 제가 다음 주 중반에 다시 한 번 연락드리겠습니다.
        expression: grim
      - speaker: narration
        text: 조건의 무게추가 내 쪽에서 그 쪽으로 한 뼘 더 기울었다. 오늘 이 자리 이후로 내 이름의 위치는 그 쪽 계산서에 맞춰 정리된다.
    next: depart

  close-silence:
    id: close-silence
    lines:
      - speaker: cha-sangmu
        text: 그 한 줄, 저는 받은 걸로 하겠습니다. 승재씨가 오늘 이 자리에 앉지 않으셨던 걸로 제 쪽 내부 보고도 정리할게요.
        expression: neutral
      - speaker: narration
        text: 차 상무가 한 박자 먼저 자리에서 일어섰다. 의자를 원래 위치에서 정확히 한 뼘 뒤로 밀고, 코트를 한 번 털어 걸쳤다.
    next: depart

  close-silence-leak:
    id: close-silence-leak
    lines:
      - speaker: cha-sangmu
        text: 그 한 줄 받긴 받겠는데, 말끝 한 자 조건 붙이신 건 저희 쪽에서 다시 문의드릴 사안이에요.
        expression: amused
      - speaker: thought
        text: 침묵의 문 위에 내가 조건 한 자를 덧댄 순간, 저쪽은 그 한 자를 문고리로 잡았다. 오늘 이후 저 사람한테서 '다시 여쭤볼 게 있다' 는 연락이 한 번 더 돌아온다.
    next: depart

  close-defer:
    id: close-defer
    lines:
      - speaker: cha-sangmu
        text: 그러시죠. 다음 자리 승재씨 쪽에서 시간 잡아 주세요. 저는 오늘 이후 며칠은 이 건 앞에 안 앉아 있겠습니다.
        expression: weary
      - speaker: thought
        text: "'며칠은 앉지 않겠다'는 말은, 그 며칠 뒤의 자리는 오늘 이 자리보다 한 단계 위의 권한 층으로 올라간다는 시사다. 오늘 내가 유예한 시간이 다음 자리에서 나에게 다시 청구될 거다."
    next: depart

  depart:
    id: depart
    cast: []
    lines:
      - speaker: narration
        text: 카페 유리문 밖으로 나오자 아침 출근 라인이 아직 광화문 사거리 횡단보도를 한 번 더 건너는 중이었다. 회사 사원증을 목에 건 대기열 속에 두 달 전까지의 내 자리도 있었고, 오늘 그 대기열 안에는 내가 없었다.

      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 오늘 이후 이수연의 편집국 시간선이 내 쪽 오전을 이어받는다. 오후 안에 저쪽에서 첫 한 줄이 나갈 거고, 그 한 줄은 내 쪽 입구에도 한 번 걸린다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 거래 쪽으로 왔다. 이 길 끝에서 도현이라는 이름은 내 서랍 안쪽으로 들어가고, 두 번째 자리가 내 이름 쪽에 공식적으로 만들어진다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: 거래 쪽이지만 내 쪽 저울추가 한 뼘 모자란 채로 끝났다. 다음 자리부터는 저쪽 문장이 내 문장보다 반 박자 먼저 도착할 거다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 오늘 자리가 없던 자리로 정리됐다. 그 정리 뒤에 남는 건 도현이라는 이름과 내 코트 주머니의 녹음기, 그 둘의 무게뿐이다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 침묵 쪽으로 가려 했는데 문고리 한 자를 저쪽에 남겼다. 오늘 이후 며칠 안에 그 문고리가 한 번 돌아간다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 유예. 다음 자리 날짜는 내 쪽에서 정한다. 다만 그 자리가 이 카페처럼 두 명짜리로 끝나진 않을 거다.

      - speaker: narration
        text: 횡단보도 신호가 바뀌자 출근 라인이 한꺼번에 길을 건넜다. 나는 그 흐름 반대 방향으로 한 발 내디뎠고, 그 한 발의 각도가 오늘 이후 며칠의 방향을 이미 반쯤 정했다.
        effects:
          - kind: chapterComplete
            chapter: chapter-7
