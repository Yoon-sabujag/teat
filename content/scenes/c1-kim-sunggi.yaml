id: c1-kim-sunggi
title: "부회장의 부탁"
background: gwanghwamun-vip
cast:
  - npc: kim-sunggi
    position: center
    expression: neutral
entry: arrive

nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 광화문 본사 27층 VIP 상담실은 임원실 라인에서도 가장 안쪽에 있었다. 같은 층에서 두 달 전 사인을 한 자리와는 복도 두 칸 차이. 두 달 전엔 출구로, 오늘은 다시 입구로 같은 카드키 게이트를 지나왔다. 비서가 깍듯하게 인사했고, 그 인사 끝에 내 이름 뒤로 '실장님'이 붙었다.
      - speaker: narration
        text: 상담실은 일반 회의실 두 배 크기였다. 천장 간접등이 절반만 켜져 있었고, 원목 회의용 테이블 위엔 김승기 부회장 본인 명의의 두꺼운 만년필 하나와, 손때가 묻은 가죽 다이어리 한 권이 가지런히 놓여 있었다. 비싼 만년필이었지만 잉크 자국은 펜촉 한쪽으로만 닳아 있었다.
      - speaker: kim-sunggi
        text: 어서 오세요, 백 실장님. 편히 앉으세요.
        expression: smile
      - speaker: kim-sunggi
        text: 커피로 하시겠어요, 아니면 차.
        expression: neutral
    choices:
      - id: coffee
        label: 커피로 부탁드리겠습니다.
        next: setup
        effects:
          - kind: flag
            key: c1_drink
            value: coffee
      - id: water
        label: 물 한 잔이면 됩니다.
        check: { stat: gwonmo, dc: 10 }
        success:
          next: setup
          effects:
            - kind: stat
              target: gwonmo
              delta: 1
            - kind: memory
              text: 물을 청하자 김승기가 짧게 웃었다. 가볍게 받지 않는 사람이라는 평가를 끝낸 표정.
            - kind: flag
              key: c1_drink
              value: water_sharp
        failure:
          next: setup
          effects:
            - kind: flag
              key: c1_drink
              value: water_flat

  setup:
    id: setup
    lines:
      - speaker: narration
        text: 비서가 들어와 잔을 받침과 함께 내려놓고 다시 안에 나갔다. 문이 닫히는 소리가 카펫에 한 번 잡혔다.
      - speaker: kim-sunggi
        requires:
          flagEquals:
            key: c1_drink
            value: water_sharp
        text: 물 한 잔이라. 승재씨, 쉬운 분 아니신 거 오늘 저도 알겠네요.
        expression: amused
      - speaker: kim-sunggi
        text: 실장님 두 달 전에 자리 정리하신 거, 저도 회사 공식 메일로 보고 받았어요. 안타까웠습니다.
        expression: weary
      - speaker: kim-sunggi
        text: 오늘 자리는 회사 명의로 잡은 자리는 아닙니다. 개인적인 부탁 한 가지가 있어서요.
        expression: neutral
      - speaker: thought
        text: 그룹 부회장이 본인 명의로 외부인을 부른다. 그 자체가 이미 무거운 자리고, 비서가 회의록을 안 잡고 있다는 건 더 무거운 자리다.
    next: the-ask

  the-ask:
    id: the-ask
    lines:
      - speaker: kim-sunggi
        text: 제 조카, 김도현. 스물여덟. 현 회장 외아들입니다. 한 달 전부터 연락이 닿지 않아요.
        expression: neutral
      - speaker: kim-sunggi
        text: 경찰에 신고는 하지 않았습니다. 가족 안에서도 공식적인 일로 만들 수가 없는 사정이 있고요.
        expression: weary
      - speaker: pc
        text: 그룹 내부 조사팀이 있을 텐데요.
      - speaker: kim-sunggi
        text: 있죠. 다만 그 조사팀이 도현이를 찾고 난 뒤에 그 다음 그림이 어떻게 그려질지, 제가 보장을 못 합니다.
        expression: grim
      - speaker: thought
        text: 부회장이 본인 그룹의 조사팀을 못 믿겠다고 말한다. 의뢰 내용보다 이 한 문장이 오늘 자리의 진짜 무게다. 승계 라인 얘기가 분명하다.
    choices:
      - id: listen
        label: 더 말씀해 주시죠.
        next: motive
        effects:
          - kind: flag
            key: c1_response
            value: listened
      - id: probe-motive
        label: 부회장님, 왜 저였습니까.
        check: { stat: jikgam, dc: 12 }
        success:
          next: probe-motive-success
          effects:
            - kind: memory
              text: 내가 선택된 이유는 능력이 아니라 포지션. 그룹을 알면서 그룹과 적대 계약 상태에 있는 사람이라는 그 조합이 필요했다.
            - kind: flag
              key: c1_response
              value: probed
        failure:
          next: motive
          effects:
            - kind: flag
              key: c1_response
              value: probe_missed
      - id: decline-outright
        label: 죄송합니다, 부회장님. 이 건은 제가 받지 못할 것 같습니다.
        check: { stat: ttuksim, dc: 13 }
        success:
          next: decline-success
          effects:
            - kind: flag
              key: c1_response
              value: declined_won
        failure:
          next: motive
          effects:
            - kind: stat
              target: ttuksim
              delta: -1
            - kind: flag
              key: c1_response
              value: declined_lost

  probe-motive-success:
    id: probe-motive-success
    lines:
      - speaker: kim-sunggi
        text: 좋은 질문이네요.
        expression: smile
      - speaker: kim-sunggi
        text: 솔직히 말씀드리면, 현 회장 라인 사람도 안 되고, 완전한 외부인도 안 됐습니다. 그룹의 결을 알면서 지금은 그룹이 경계하는 분이 필요했어요.
        expression: neutral
      - speaker: kim-sunggi
        text: 두 달 전 실장님 사인하신 합의서가 그 조건을 깨끗하게 만들어 주셨고요.
        expression: grim
      - speaker: thought
        text: 이 사람은 나를 쓰는 게 아니라 내가 지금 서 있는 자리를 쓴다. 차 상무가 내 자리를 비웠고, 그 빈자리가 김승기의 카드가 됐다.
    next: motive

  decline-success:
    id: decline-success
    lines:
      - speaker: kim-sunggi
        text: …그러시군요.
        expression: tense
      - speaker: kim-sunggi
        text: 알겠습니다. 다만 한 가지만 기억해 주세요.
        expression: grim
      - speaker: kim-sunggi
        text: 실장님이 이 일을 안 받으시더라도, 이 일은 결국 실장님 자리로 갑니다. 다만 그땐 조금 늦게, 조금 더 불리한 그림으로 가요.
        expression: weary
      - speaker: thought
        text: 거절은 받아 줬지만 거절 이후의 그림까지 이미 맞춰 두고 있는 사람이다. 오늘 이 자리는 내 거절을 듣기 위해서도 준비된 자리였다.
    next: closing

  motive:
    id: motive
    lines:
      - speaker: kim-sunggi
        requires:
          flagEquals:
            key: c1_response
            value: declined_lost
        text: 들어 보세요. 듣고 나서 다시 결정하셔도 늦지 않습니다.
        expression: grim
      - speaker: kim-sunggi
        requires:
          flagEquals:
            key: c1_response
            value: probe_missed
        text: 그 질문에 대한 답은 자리 끝에 다시 드리지요. 사건부터 공유드리겠습니다.
        expression: neutral
      - speaker: kim-sunggi
        text: 도현이가 실종 직전에 본사 임원 한 사람을 만났습니다. 그 임원이 누구인지, 오늘 이 방에선 말씀드리지 않을 겁니다.
        expression: grim
      - speaker: thought
        text: 부회장이 본사 안의 누군가의 이름을 입에 올리지 않는다. 그 침묵은 그 자체로 좁혀진 후보군이다.
      - speaker: kim-sunggi
        text: 도현이가 그 자리에서 무엇을 가지고 있었는지, 어디로 향하려 했는지, 그리고 지금 살아 있는지. 이 세 가지 중 적어도 두 가지를 확인해 주시면 됩니다.
        expression: weary
    next: terms

  terms:
    id: terms
    lines:
      - speaker: kim-sunggi
        text: 착수금 오천. 성공 보수는 별도로 책정해 드리고, 경비는 실비 정산.
        expression: neutral
      - speaker: kim-sunggi
        text: 조건 한 가지. 보고는 저한테만 합니다. 중간에 어디 한 군데로라도 새는 정황이 잡히면, 그 즉시 계약은 끝나는 걸로 해 주세요.
        expression: grim
    choices:
      - id: accept
        label: 맡겠습니다.
        next: accept
        effects:
          - kind: flag
            key: accepted_case
            value: true
          - kind: flag
            key: c1_acceptance
            value: clean
          - kind: memory
            text: 김승기 부회장 의뢰 수락. 실종된 조카 김도현. 착수금 오천, 단독 보고.
      - id: negotiate
        label: 한 가지 조항을 조정해 주셔야겠습니다.
        check: { stat: gwonmo, dc: 12 }
        success:
          next: negotiate-success
          effects:
            - kind: flag
              key: accepted_case
              value: true
            - kind: flag
              key: reserved_channel
              value: true
            - kind: flag
              key: c1_acceptance
              value: negotiated
            - kind: memory
              text: 계약에 '생명 위협 감지 시 외부 채널 한 곳과 최소 공조 가능' 조항 삽입. 이수연 기자 라인을 염두에 둔 안전핀.
        failure:
          next: accept
          effects:
            - kind: flag
              key: c1_acceptance
              value: negotiate_failed
      - id: sleep-on-it
        label: 하루만 시간 주실 수 있겠습니까.
        check: { stat: ttuksim, dc: 12 }
        success:
          next: sleep-success
          effects:
            - kind: flag
              key: delayed_acceptance
              value: true
            - kind: flag
              key: c1_acceptance
              value: slept
        failure:
          next: accept
          effects:
            - kind: flag
              key: c1_acceptance
              value: sleep_failed

  negotiate-success:
    id: negotiate-success
    lines:
      - speaker: narration
        text: 김승기가 만년필을 한 번 손가락 끝으로 굴렸다. 그 동작이 멎고 다시 책상 위에 펜이 가지런히 놓였다.
      - speaker: kim-sunggi
        text: 어떤 조건인지 들어 보지요.
        expression: neutral
      - speaker: pc
        text: 도현 씨의 생명에 직접 위협이 감지되는 시점에, 외부 언론 한 곳과 최소한의 공조를 할 수 있게 해 주십시오. 단, 그 시점 전에 부회장님께 먼저 알리겠습니다.
      - speaker: kim-sunggi
        text: …
        expression: grim
      - speaker: kim-sunggi
        text: 좋습니다. 그 조건까지 포함해서, 계약입니다.
        expression: weary
      - speaker: thought
        text: 이 사람은 조항이 추가되는 걸 좋아하지 않는다. 그 조건을 받아 들였다는 건, 받아 들이지 않을 여유가 오늘은 없다는 뜻이다.
    next: accept

  sleep-success:
    id: sleep-success
    lines:
      - speaker: kim-sunggi
        text: 좋습니다. 내일 정오까지 회신 부탁드립니다.
        expression: neutral
      - speaker: kim-sunggi
        text: 그 시간을 지나면 의뢰는 다른 분께 갑니다. 저도 기다릴 여유가 길지가 않아요.
        expression: grim
      - speaker: thought
        text: 하루를 받았다. 다만 같은 하루 동안 상대도 다른 카드를 정리한다는 뜻이기도 하다.
    next: accept

  accept:
    id: accept
    lines:
      - speaker: narration
        requires:
          flagEquals:
            key: c1_acceptance
            value: slept
        text: 오늘은 사인을 미뤘다. 책상 위로 USB 한 개가 대신 건너왔다. 먼저 보시라는 뜻이었다.
      - speaker: narration
        requires:
          flagNotEquals:
            key: c1_acceptance
            value: slept
        text: 김승기가 가죽 다이어리 안에서 한 장짜리 계약서를 꺼냈다. 사인을 한 곳은 책상 가운데, 인주가 한 번 찍히는 자리. 사인 옆에 도현이의 사진 세 장과 최근 통화 기록 출력본, 결제 내역 PDF 링크가 담긴 USB 한 개가 같이 건네졌다.

      - speaker: kim-sunggi
        requires:
          flagEquals:
            key: c1_acceptance
            value: negotiated
        text: 오늘 조건 한 줄 더 받으신 거, 저는 사실 속이 좀 상합니다. 다만 그래서 더 믿을 수 있게 됐다고 생각하고요.
        expression: weary
      - speaker: kim-sunggi
        requires:
          flagEquals:
            key: c1_acceptance
            value: negotiate_failed
        text: 조정은 어렵겠습니다. 다만 한 가지만 더 말씀드릴게요. 조심히 움직이세요. 오늘 이 방에서 본 사람 말고도 실장님을 보고 있는 눈이 이미 있어요.
        expression: grim
      - speaker: kim-sunggi
        requires:
          flagEquals:
            key: c1_acceptance
            value: sleep_failed
        text: 오늘 결정해 주신 거, 저는 고맙게 듣겠습니다. 내일 아침 전까지 후회하지 마세요.
        expression: weary
      - speaker: kim-sunggi
        requires:
          flagEquals:
            key: c1_acceptance
            value: clean
        text: 고맙습니다, 백 실장님. 오늘 제가 드릴 수 있는 말은 이 정도까지입니다.
        expression: smile
      - speaker: kim-sunggi
        requires:
          flagEquals:
            key: c1_acceptance
            value: slept
        text: 내일 정오. 그 시간까지 USB 안 내용만 봐 주세요. 따로 움직이지 마시고요.
        expression: neutral

      - speaker: kim-sunggi
        text: 한 가지만 더요.
        expression: weary
      - speaker: kim-sunggi
        text: 도현이는 누군가의 아들입니다, 조카이기 전에. 그 사실을 가끔 한 번씩 기억해 주세요.
        expression: grim
    next: closing

  closing:
    id: closing
    lines:
      - speaker: narration
        text: VIP 상담실 문을 닫고 27층 엘리베이터 앞에 섰다. 두 달 전 차 상무 임원실에서 이 같은 엘리베이터를 탔다. 그땐 박스 하나를 들고 내려갔고, 오늘은 USB 하나를 들고 내려간다. 무게는 USB 쪽이 훨씬 가벼웠고, 책임은 그 반대였다.

      - speaker: thought
        requires:
          flagEquals:
            key: c1_response
            value: declined_won
        text: 거절에 성공한 자리였다. 다만 그 사람의 마지막 한 문장이 코트 안주머니에 같이 들어와 있었다. "조금 늦게, 조금 더 불리하게."

      - speaker: thought
        requires:
          flagEquals:
            key: c1_acceptance
            value: negotiated
        text: 조항 한 줄을 받아 냈다. 이수연 기자 번호를 오늘 밤 다이어리 첫 장에 옮겨 적게 될 거다.

      - speaker: thought
        requires:
          flagEquals:
            key: c1_acceptance
            value: slept
        text: 하루의 여유를 받았다. 내 하루는 길고, 저 사람의 하루는 짧다. 내일 정오 전에 USB 안의 한 줄을 골라야 한다.

      - speaker: thought
        requires:
          flagEquals:
            key: c1_acceptance
            value: clean
        text: 사인했다. 돈도 받고 의뢰도 받았다. 이게 가장 빠른 길이었는지 아닌지는 오늘 밤 안엔 답이 안 나온다.

      - speaker: thought
        text: 조카가 들고 있던 것, 만난 임원, 생사. 셋 중 둘. 김승기 본인이 셋 다 알고 싶은 게 아니라는 점을 잊지 말 것.

      - speaker: thought
        requires:
          flag: noticed_nda
        text: 두 달 전 사인한 합의서의 5년 조항과, 오늘 사인한 의뢰 계약서가 같은 방향을 가리키고 있다. 그 사실은 이 엘리베이터 안에서 처음으로 분명해졌다.
      - speaker: thought
        requires:
          flagNotEquals:
            key: noticed_nda
            value: true
        text: 두 달 전 27층의 사인과 오늘 27층의 사인이 같은 그룹의 같은 층에서 이뤄졌다. 그 사이 무엇이 있었는지는 오늘 안엔 알지 못한다.

      - speaker: narration
        text: 1층 로비. 저녁 여덟 시. 광화문 사거리 쪽에서 들어오는 바람이 한 번 안쪽으로 휩쓸렸고, 정장 깃이 잠깐 떨렸다.
        effects:
          - kind: chapterComplete
            chapter: chapter-1
            nextChapter: chapter-2
