id: c8-dohyun
title: "도현"
background: euljiro-office
cast: []
entry: opening

nodes:
  opening:
    id: opening
    lines:
      - speaker: narration
        text: 카페 자리 이후 며칠. 오늘 아침의 첫 한 줄이 어디서 시작됐는지에 따라, 오늘 이후의 도현이 어느 자리에 놓여 있는지가 정해졌다.
      - speaker: thought
        text: 사람을 찾는 일에선 마지막 한 줄이 늘 그 사람이 어떤 사람이었는지보다 그 사람을 찾으러 간 사람이 어떤 자세로 갔는지를 더 비춘다. 오늘 이 한 줄도 그렇다.
    next: bridge

  bridge:
    id: bridge
    lines:
      # ─── public ───────────────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 사흘 뒤 새벽. 이수연한테서 짧은 메시지 한 줄. '통영. KTX 부산역까지 한 번에. 거기서 차로 한 시간 십 분. 호텔 이름은 도착해서 드릴게요.' 그 한 줄을 받자마자 코트를 걸쳤고, 이수연은 더 이상 묻지 말라는 톤의 한 줄로 통화 자체를 닫아 두었다.
        background: tongyeong-hotel-room
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 통영 시내에서 차로 한 시간을 더 들어간 외진 모텔. 객실 번호는 메시지로만, 입구 카운터는 본인이 비워 두었다. 이층 끝 방. 노크 두 번 뒤에 안에서 잠금이 풀렸다. 도현은 회색 후드 한 벌, 일주일치는 자라난 수염, 그리고 카페 자리에서 차 상무가 했던 그 표정을 거꾸로 뒤집은 듯한 얼굴로 문을 열었다.
        background: tongyeong-hotel-room
      - speaker: dohyun
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 백 실장님, 오셨네요. 미영이가 그 녹음기 제대로 전해 드린 거 같아 다행입니다.
        expression: weary
        background: tongyeong-hotel-room
      - speaker: dohyun
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 저는 여기 길게 못 있어요. 일주일 안에 한 번 더 옮길 거고, 그 다음은 저도 모릅니다. 다만 오늘 실장님 만나서 한 가지만 부탁드리려고 자리 잡았어요.
        expression: grim
        background: tongyeong-hotel-room
      - speaker: dohyun
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 미영이한테, 저 살아 있다고 한 번만 직접 전해 주세요. 문자도 전화도 말고요. 얼굴 보고 한 줄로요. 그게 제가 그 사람한테 직접 못 드린 마지막 한 줄이라서요.
        expression: weary
        background: tongyeong-hotel-room
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: public
        text: 저녁 햇빛이 호텔 방 창 블라인드 사이로 가로 줄 두 개를 도현의 어깨 위에 얹었다. 이 사람은 살아 있고, 그 살아 있음의 무게를 본인이 매일 본인 손으로 들어 옮기고 있었다.
        background: tongyeong-hotel-room
        effects:
          - kind: flag
            key: dohyun_state
            value: alive_met
          - kind: memory
            text: 통영 외곽 모텔에서 도현 직접 대면. 살아 있음 확인. '미영에게 직접 한 줄 전해 달라'는 부탁 받음.
          - kind: chapterComplete
            chapter: chapter-8
            nextChapter: chapter-9

      # ─── deal ───────────────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 복귀 발령 사흘 뒤. 차 상무한테서 새벽 다섯 시 반 문자 한 통. '승재씨, 오늘 새벽 여섯 시 반 성수동 쪽으로 한 번 들렀다 가시죠. 마지막 자리 정리해 드리려고요.' 주소가 한 줄 더 붙어 있었고, 회신은 따로 받지 않았다.
        background: seongsu-warehouse
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 성수동 인쇄 골목 끝, 외관만 남은 폐창고. 셔터가 한 뼘 열린 안쪽에서 차 상무가 캐시미어 코트 그대로 서 있었다. 콘크리트 바닥엔 회색 비닐 시트 한 장, 그 위에 이불처럼 덮인 모양 하나. 차 상무는 시트 한 자락만 살짝 들어 보였고, 그 안엔 도현이 있었다.
        background: seongsu-warehouse
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 어제 새벽에 자기 차로 부산까지 가시다가 사고 나신 거 처리한 결과예요. 공식 보고는 단독 사고로 들어갈 거고요.
        expression: weary
        background: seongsu-warehouse
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 시트 위로 다시 떨어진 차 상무의 손이 평소 결재판을 받을 때와 같은 각도였다. 단독 사고. 그 단어 안에 들어 있는 다른 단어들 — 운전, 속도, 새벽, 부산 — 어느 것도 도현이 직접 만든 단어가 아니었다.
        background: seongsu-warehouse
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 승재씨가 오늘 보신 거, 회사 보고서엔 안 들어갑니다. 이건 승재씨한테만 한 번 보여 드리는 자리예요. 나머지 정리는 제가 합니다.
        expression: grim
        background: seongsu-warehouse
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: deal
        text: 차 상무가 셔터를 다시 한 뼘 닫았다. 셔터 닫히는 소리 안에 두 달 전 임원실 문 닫히던 소리가 한 번 겹쳐서 지나갔다. 같은 사람이 같은 손으로 같은 각도로 닫는 문이었다.
        background: seongsu-warehouse
        effects:
          - kind: flag
            key: dohyun_state
            value: body_seen
          - kind: memory
            text: 성수동 폐창고에서 도현의 시신 확인. 단독 사고로 처리 중. 차 상무가 '회사 보고서 외'로만 보여 줌.
          - kind: chapterComplete
            chapter: chapter-8
            nextChapter: chapter-9

      # ─── deal_tainted ──────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: '거래 계약 이틀 뒤. 차 상무한테서 한 줄 메일. 제목: "참고 회신". 본문 한 줄. "승재씨가 신경 쓰셨던 그 자리는 어제 새벽 정리됐습니다. 따로 보실 일 없으시고요. 사진 한 장만 첨부합니다."'
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: 첨부 파일은 저화질 폴라로이드 한 장을 휴대폰으로 다시 찍은 듯한 사진이었다. 회색 시트 위에 사람 형상 하나. 얼굴 부분은 의도적으로 흐려져 있었고, 손목에 도현이 평소 차고 다니던 시계 한 개가 절반쯤 비쳤다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: 메일 하단엔 회신 막아 둔 자동 안내 한 줄. '본 메일은 발신 전용입니다.' 시계 모양만 한 번 더 확대해서 본 뒤 메일창을 닫았다.
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: deal_tainted
        text: 시신은 보지 못했고, 그 사실에 대해 누구도 나에게 설명하지 않을 거다. 사진 한 장이 오늘 이후 도현이라는 이름과 내 사이의 마지막 다리가 됐다.
        effects:
          - kind: flag
            key: dohyun_state
            value: body_unseen
          - kind: memory
            text: 차 상무 메일로 도현 사진 한 장만 받음. 시신 직접 확인 불가. 발신 전용.
          - kind: chapterComplete
            chapter: chapter-8
            nextChapter: chapter-9

      # ─── silence ─────────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 카페 자리 나흘 뒤. 미영한테서 짧은 문자. '실장님, 한 번만 청담 카페에서 뵐 수 있을까요. 보여드릴 게 한 장 있어요.' 시간은 본인이 잡아 두었다. 같은 카페, 같은 자리.
        background: cheongdam-cafe
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 미영이 가방에서 꺼낸 봉투 한 장을 테이블 가운데에 올렸다. 안에는 도현의 친필 편지 원본. 종이의 결까지 손이 한 번씩 잡고 다듬은 흔적이 보였다.
        background: cheongdam-cafe
      - speaker: miyoung
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 복사본은 실장님 댁 우편함에 이미 도착했을 거예요. 원본을 굳이 한 번 보여드리고 싶었던 건 — 도현 씨 글씨라는 게 손으로 한 번 확인되셔야 다음 칸이 열린다고 봐서요.
        expression: weary
        background: cheongdam-cafe
      - speaker: miyoung
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 도현 씨는 살아 있어요. 다만 어디 있는지는 저도 정확히 몰라요. 한 달 안에 한 번씩, 저한테 새 번호로 한 줄짜리 안부를 보내는 게 본인이 본인을 증명하는 방식이에요.
        expression: grim
        background: cheongdam-cafe
      - speaker: miyoung
        requires:
          flagEquals:
            key: miyoung_bond
            value: deepened
        text: 그 밤 자리, 도현 씨 편지에는 안 들어가요. 제가 먼저 그 자리 정리하고 나서 도현 씨 쪽이 자기 시간선을 다시 잡으셨어요. 그 거리 안에서 오늘 이 봉투가 가능했던 거고요.
        expression: weary
        background: cheongdam-cafe
      - speaker: miyoung
        requires:
          flagEquals:
            key: miyoung_bond
            value: respected
        text: 그 밤 자리, 자세 그대로 두고 닫으신 거 — 그게 오늘 이 봉투의 무게이기도 해요. 두 자리 다 같은 박자로 끝낸 사람만 받을 수 있는 형태로 도현 씨 글씨를 드리는 거고요.
        expression: weary
        background: cheongdam-cafe
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 도현은 한 번도 만나지 못한 채 이 사건에서 내 쪽으로 건너왔다. 살아 있다는 사실이 종이 한 장과 한 달 한 번의 안부 문자로만 증명되는 사람의 이름이 오늘 이후 내 책상 서랍 안쪽에 한 줄 더 얹혔다.
        background: cheongdam-cafe
        effects:
          - kind: flag
            key: dohyun_state
            value: letter_only
          - kind: memory
            text: 청담에서 미영이 도현의 친필 편지 원본 보여 줌. 도현은 한 달 한 번 안부 문자로만 본인을 증명 중. 직접 만남 없음.

      # 결합 결정: count_2 가 박혀 있으면 미영이 같이 살자고 제안.
      - speaker: narration
        requires:
          flagEqualsAll:
            - { key: c7_end, value: silence }
            - { key: miyoung_count_2, value: true }
        text: 봉투를 가방 안에 다시 넣으며 미영이 잠시 손을 멈췄다. 카페 음악이 한 곡 바뀌는 사이 둘 다 잔에 손을 대지 않고 앉아 있었다.
        background: cheongdam-cafe
      - speaker: miyoung
        requires:
          flagEqualsAll:
            - { key: c7_end, value: silence }
            - { key: miyoung_count_2, value: true }
        text: 다음 달부터 청담 쪽으로 올라오시면 어떨까요. 매일이 아니어도 됩니다. 일주일에 사흘. 도현 씨 자리는 그 자리대로 두고요.
        expression: tense
        background: cheongdam-cafe
        effects:
          - kind: goto
            scene: c8-miyoung-commit

      # count_2 미세팅 = 기존 흐름 그대로 다음 장으로 마무리.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: silence
        text: 카페 문이 닫히는 소리가 평소보다 한 박자 무겁게 들렸다. 청담 사거리에서 택시를 잡았다.
        effects:
          - kind: chapterComplete
            chapter: chapter-8
            nextChapter: chapter-9

      # ─── silence_leak ────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 카페 자리 닷새 뒤. 미영한테서 연락은 끝까지 오지 않았다. 대신 어느 밤 사무실 책상 위에 누가 두고 간 폴라로이드 한 장이 얹혀 있었다. 사무실 문은 잠겨 있었고, 카드키 로그엔 내 출입 외엔 아무것도 남지 않았다.
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 사진은 흐릿했다. 어느 밤 어느 식당 안쪽 자리에서 후드 모자를 깊이 내려쓴 사람 한 명이 창 쪽으로 고개를 돌리고 있는 한 컷. 얼굴 윤곽은 도현 같기도 했고 도현이 아닌 같기도 했다. 사진 뒷면엔 연필로 한 줄 — '판단은 그쪽 몫.'
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: silence_leak
        text: 도현이 살아 있다는 증거도 죽었다는 증거도 아닌 한 장. 누가 어떤 의도로 이 한 장을 내 책상 위에 올려 두었는지를 오늘 밤 안엔 짚지 못한다. 다만 그 한 장이 내 사무실의 잠금을 한 번 우회한 손에서 왔다는 사실만큼은 분명했다.
        effects:
          - kind: flag
            key: dohyun_state
            value: polaroid
          - kind: memory
            text: 사무실 책상에 출처 불명 폴라로이드 한 장. 도현인지 아닌지 흐릿. 사무실 잠금은 우회됨.
          - kind: chapterComplete
            chapter: chapter-8
            nextChapter: chapter-9

      # ─── defer ───────────────────────────
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: '"다음 자리 내가 정한다"고 차 상무한테 던진 한 줄을 결국 내가 먼저 정해 보기로 했다. 차 상무한테서 흘러나온 단 한 줄, "남쪽". 그 한 줄을 들고 통영부터 거제, 부산을 사흘에 걸쳐 훑었다.'
        background: tongyeong-hotel-room
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 통영 외곽 작은 모텔 이층 끝 방. 카운터 영수증 기록상 일주일 전에 누군가 일주일치를 선결제했고, 사흘 전에 본인이 직접 체크아웃했다. 객실은 청소가 되어 있었지만 책상 위에 마른 커피 자국 두 개가 평행하게 남아 있었고, 침대 옆 콘센트에 휴대폰 충전기 한 개가 꽂힌 채 잊혀져 있었다.
        background: tongyeong-hotel-room
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 충전기 케이블 모양은 도현이 평소 쓰던 그 모델이었다. 그 외엔 이 방이 도현의 방이었다고 증명할 수 있는 것은 아무것도 없었다.
        background: tongyeong-hotel-room
      - speaker: thought
        requires:
          flagEquals:
            key: c7_end
            value: defer
        text: 늦었다. 그가 사흘일 수도, 일주일일 수도, 두 달 전부터 누적된 시간 전체일 수도 있었다. 도현이 어디로 갔는지는 오늘 이후 내 쪽에서 물을 수 있는 사람이 한 명도 없는 자리에 들어가 있었다.
        background: tongyeong-hotel-room
      - speaker: narration
        requires:
          flagEquals:
            key: c7_end
            value: defer
