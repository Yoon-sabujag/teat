      재민이 c6-jaemin-tail 에서 차량 번호판 → 보안실 라인 확인 가능.

  minyoung:
    name: 민영
    age: 43
    title: 외국계 마케팅 회사 부장 (B2B SaaS, 강남)
    history_with_pc: |
      대학 동기. 1999년 결혼, 18년 차. 결혼 초반 5년은 평범. 그 이후
      백승재가 전략기획실로 옮긴 후 (2004년) 부터 야근·해외출장 누적,
      가족 시간 0 에 가까움. 2018년 백승재가 전략기획실 차장 진급 시점
      에 민영이 한 번 이혼 얘기 꺼낸 적 있음 ("그 자리 가지 마. 지금도
      네가 집에 없어. 그 자리 가면 영영 없어진다") — 백승재가 "한 번만
      더 보고" 로 무마. 2024년 5월 명예퇴직 후 두 달간 백승재가 새벽
      거실에서 TV 만 켜 두는 상태. 2024년 9월 민영이 "잠시 떨어져 있자"
      제안. 별거 시작.
    knows:
      - "백승재가 SPC 같은 자금 라인을 만들었다는 사실 — 일부. 본인이
        대학 동기로서 18년간 옆에 살면서 회사 분위기·임원 동선·결재 라인
        대화를 다 들었기 때문."
      - "백승재가 해고당한 이유의 절반 이상 — 차상호 라인 정리 차원."
      - "백승재가 2024년 가을 이후 누구를 만나는지 일부 (재민·미영 이름
        은 들었음. 이수연은 모름)."
    doesnt_know:
      - "도현 USB 의 존재."
      - "백승재가 사건에 본격적으로 개입했다는 사실의 깊이 (단순 의뢰
        받은 정도로 알고 있음)."
    leverage_over_pc:
      - "하진 양육권 — 별거 합의가 이혼으로 가면 양육권 소송 가능."
      - "재산 분할 — 백승재 명예퇴직금 + 을지로 사무실 보증금 분할."
      - "감정적 접근 — 18년 결혼 + 한 번 이혼 얘기 무마한 적이 있다는
        과거. 다시 꺼내면 백승재가 회피 못 함."
    ending_role: |
      c9 모든 엔딩 후일담에 등장. public 엔딩에서 일찍 들어와 식탁
      앞 한 마디. deal 엔딩에서 "이제 좀 편해졌어" 한 마디. silence
      엔딩에서 별거 1년 후 정식 이혼 협의 시작. damned 엔딩에서 영영
      등 돌림.

  hajin:
    name: 하진
    age: 14
    title: 중학교 2학년
    family_position: |
      엄마와 거주, 격주 주말 백승재 만남. 별거 1년 차에 본인이 부모의
      거리감을 본인 안에 흡수. 카톡으로 백승재한테 "아빠 저녁은 드셨
      어요" 같은 어른 자세의 안부를 보냄.
    rule: |
      ★ 어떤 형태의 성적 맥락에도 등장시키지 않는다 (미성년). 모든 씬
      에서 카톡 UI 안 한 줄 또는 거실 한 장면 정도로만.

  jaemin:
    name: 재민
    age: 32
    title: 재민종합리서치 (을지로 3가) 운영
    history_with_pc: |
      백승재 전략기획실 시절 외주 자료 한 번 처리한 인연. 백승재가
      을지로에 사무실 잡은 첫 주에 재민이 직접 올라와 인사. 백승재의
      유일한 뒷골목 정보통.
    knows_about_case:
      - "그룹 안에 SPC 같은 자금 라인이 있다는 소문 — 자세한 구조 모름."
      - "도현 동선 사흘치 (c2-jaemin-extra 에서 풀 수 있음)."
      - "차 상무 보안실 라인 차량 번호판 (c6-jaemin-tail 에서 풀 수
        있음)."
    doesnt_know:
      - "백승재가 SPC 설계자였다는 사실. 본인은 백승재가 차상호 손에
        잘린 피해자로만 인식."
    leverage: 정보 가격 협상. 인맥 카드.

  junhyuk:
    name: 준혁
    age: 29
    title: 증권맨, 도현 대학 동기
    role_in_case: |
      도현이 USB 작업 중 일부 종목 자금 흐름 분석 자문. 도현의 마지막
      통화 (실종 사흘 전) 에 "형(=백승재) 이름이 적혀 있다" 라는 한
      줄을 받음.
    knows:
      - "도현이 자료 묶음 만들고 있었다는 사실."
      - "도현이 백승재를 본인 노트에 적었다는 사실."
    doesnt_know:
      - "USB 위치 + 내용."
      - "도현 생사."

  wonjang:
    name: 원장 스님
    age: 68
    title: 북한산 작은 암자 주지
    history_with_dohyun: |
      도현 어머니 (회장 부인) 쪽 지인. 도현이 어릴 때부터 한 해에 한두
      번 따라옴. 2024년 5월 말 도현이 4일 머무름. 떠나기 전 디지털
      녹음기 + USB 본체를 평상 밑 궤짝에 넣어 두며 "백승재 실장님이
      오시면 전해 주세요" 부탁.
    knows:
      - "도현이 결단을 갖고 내려갔다는 사실."
      - "도현이 백승재 이름을 직접 입에 올렸다는 사실."
    doesnt_know: 사건의 구체. 본인은 결과만 받는 자리.
    pc_interaction: c3-amja 에서 만남. 양심 게이트로 USB+녹음 받기.

  dohyun:
    name: 김도현
    age: 28
    title: 대정그룹 회장 외아들, 그룹 3세
    location_now: |
      2024년 6월 8일 실종. 통영 외곽 안전가옥에서 2주 감금 → 본인이
      틈을 봐서 빠져나옴 → 6월 22일 이후 본인 라인으로 도주. 현재
      통영 ~ 거제 ~ 남해 사이의 작은 모텔들을 1주일씩 돌고 있음.
      미영한테 한 달 한 번씩 새 번호로 한 줄 문자 보냄.
    why_run: |
      USB 정리 후 본인이 외부 폭로 직전까지 갔다가, 미영의 만류 ("당신
      이 직접 폭로하면 당신 부친 (회장) 이 1차 책임자로 박힘. 우회로가
      필요하다") 에 한 박자 멈췄음. 그 사이에 보안실 라인이 본인 동선
      파악 → 안전가옥 감금. 탈출 후엔 백승재가 USB+녹음을 받아 외부
      라인으로 풀어 줄 시점을 기다리며 잠적.
    knows:
      - "SPC 라인 전부 + 자금 사용처 (회장 차명·장기철 신탁)."
      - "백승재가 SPC 설계자였다는 사실 + 본인은 가짜 인보이스에 직접
        가담 안 했다는 사실."
      - "미영이 USB 사본을 갖고 있다는 사실."
      - "본인 부친 (회장) 이 결재 라인엔 안 박혀 있지만 묵인했다는
        사실."
    doesnt_know:
      - "백승재 본인의 도덕적 회색 (SPC 가 가짜 통로로 쓰일 가능성을
        2019년에 완전히 배제 안 했다는 부분)."

# ─── 요약: 누가 누구 위에 있는가 ─────────────

power_map: |
  공식 그룹 위계:
    회장 김승철 (67)
      ├─ 부회장 김승기 (62) [후계 밀려난 형제]
      ├─ 외아들 김도현 (28) [후계자, 실종]
      └─ 지주 비서실 전무 장기철 (58) [실권자]
            ├─ 비서실장 김OO (45) [차상호와 카톡 47건]
            ├─ 본사 보안실장 오정훈 (35) [동생: 오정태]
            └─ 해외사업본부장 차상호 (54) [SPC 결재자]
                 └─ 감사실장 오정태 (51) [차상호 결재 통과 처리, 동생: 오정훈]
  
  자금 라인 (가짜 인보이스 → 차명 분배):
    싱가포르 SPC → 그룹 자회사 → 회장 차명계좌 + 장기철 차명신탁
                                  + 차상호 자녀 신탁
                                  + 정치권 후원금
  
  외부 라인:
    이수연 (시사주간지 <이북>) — 1년째 추적, 동생 이수정 (회장 옛 비서실
    출신, 오정태 동기) 이 사적 라인.
  
  법적 라인:
    미영 (광명 법무법인 송무팀) — 광명은 대정그룹 자문 로펌. 미영이 직접
    폭로 시 광명 해체.
  
  PC 위치:
    2019년 SPC 설계자, 2024년 5월 차상호 손에 잘림. 도현이 본인 노트에
    "이 사람이 우리 쪽 카드" 로 적어 둠. 김승기가 도현 USB 회수 의뢰인
    으로 PC 를 고름. 차상호는 PC 가 SPC 얘기를 외부에 흘릴까 봐 5년
    NDA 박음. 백승재 본인은 게임 시작 시점에 위 모든 그림을 모름.
