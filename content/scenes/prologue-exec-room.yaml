id: prologue-exec-room
title: "그날의 결재판"
background: office-exec
cast:
  - npc: cha-sangmu
    position: center
    expression: neutral
entry: knock

nodes:
  knock:
    id: knock
    lines:
      - speaker: narration
        text: 1월의 광화문. 저녁 여섯 시가 안 되었는데 창 밖은 이미 어둡다.
      - speaker: narration
        text: 차 상무가 노크도 없이 문을 연다. 반쯤은 예의고, 반쯤은 예의가 아니다.
      - speaker: cha-sangmu
        text: 승재씨, 오래 기다렸죠? 미안해요.
        expression: smile
      - speaker: thought
        text: 사과할 일이 따로 있을 텐데.
    next: seat

  seat:
    id: seat
    lines:
      - speaker: narration
        text: 차 상무가 내 앞에 앉는다. 결재판 하나와 서류 봉투를 책상에 올린다.
      - speaker: cha-sangmu
        text: 해외사업본부 실적 얘기는… 들었죠?
        expression: weary
      - speaker: thought
        text: 18년 다닌 회사가 끝나는 순간치고는 너무 조용하다.
    choices:
      - id: formal
        label: 네. 잘 알고 있습니다.
        next: formal-route
        effects:
          - kind: flag
            key: prologue_opening
            value: formal
      - id: probe
        label: 상무님, 진짜 이유가 뭡니까.
        check: { stat: gwonmo, dc: 13 }
        success:
          next: probe-success
          effects:
            - kind: memory
              text: 차 상무는 내 질문에 잠시 말이 막혔다. 실적은 표면일 뿐이다.
            - kind: flag
              key: prologue_opening
              value: probe_success
        failure:
          next: probe-failure
          effects:
            - kind: stat
              target: yangsim
              delta: -1
            - kind: flag
              key: prologue_opening
              value: probe_failure
      - id: silent
        label: (침묵한다)
        check: { stat: ttuksim, dc: 12 }
        success:
          next: silent-success
          effects:
            - kind: memory
              text: 내가 침묵하자 차 상무가 먼저 말을 이었다.
            - kind: flag
              key: prologue_opening
              value: silent_success
        failure:
          next: formal-route
          effects:
            - kind: flag
              key: prologue_opening
              value: silent_fail

  formal-route:
    id: formal-route
    lines:
      - speaker: cha-sangmu
        text: 승재씨, 이건 실적 문제만이 아니에요. 회사도 큰 그림이 있고, 승재씨도 이제 좀 쉴 때가 된 거예요.
        expression: smile
      - speaker: thought
        text: 쉬라는 말이 이렇게 차갑다. 이게 이 회사 말이다.
      - speaker: cha-sangmu
        text: 승재씨 같은 분이 이런 자리에서 예의를 지켜주시니까, 저도 오래 가만히 안 끌게요.
        expression: weary
        requires:
          flagEquals:
            key: prologue_opening
            value: formal
      - speaker: cha-sangmu
        text: 침묵 편하지 않았죠. 나는 승재씨 그 침묵이 고마워요.
        expression: weary
        requires:
          flagEquals:
            key: prologue_opening
            value: silent_fail
    next: paperwork

  probe-success:
    id: probe-success
    lines:
      - speaker: cha-sangmu
        text: …
        expression: tense
      - speaker: cha-sangmu
        text: 승재씨가 마지막 분기 결재판에서 뭘 봤는지, 나는 모르고 싶어요.
        expression: grim
      - speaker: thought
        text: 결재판? 내가 뭘 봤다고?
      - speaker: cha-sangmu
        text: 지금 이걸 조용히 마무리하는 게, 서로한테 제일 덜 아픈 길입니다.
        expression: weary
      - speaker: thought
        text: 말의 결이 바뀌었다. 이 자리가 단순한 퇴직이 아니라는 걸 이 사람이 먼저 실토했다.
    next: paperwork

  probe-failure:
    id: probe-failure
    lines:
      - speaker: cha-sangmu
        text: 승재씨, 질문이 날카로우면 답도 날카로워져요.
        expression: tense
      - speaker: cha-sangmu
        text: 나는 승재씨한테 그런 답을 주고 싶지 않아요. 오늘은 안 할게요.
        expression: grim
      - speaker: thought
        text: 방어만 하게 만들었다. 이 사람이 나에 대한 평가를 다시 쓰는 게 보인다.
    next: paperwork

  silent-success:
    id: silent-success
    lines:
      - speaker: cha-sangmu
        text: 예전부터 그게 승재씨 장점이었죠. 어려운 자리에서 한 번 더 생각하는 거.
        expression: smile
      - speaker: cha-sangmu
        text: …그 성격이 좋을 때도 있고, 안 좋을 때도 있어요.
        expression: weary
      - speaker: thought
        text: 이 사람은 지금 스스로 무슨 말을 하고 있는지 알고 한다. 그게 더 무섭다.
    next: paperwork

  paperwork:
    id: paperwork
    lines:
      - speaker: narration
        text: 차 상무가 서류 봉투에서 A4 몇 장을 꺼낸다. 퇴직 합의서. 경쟁금지조항 밑줄.
      - speaker: narration
        requires:
          flagEquals:
            key: prologue_opening
            value: probe_success
        text: 방금 전의 침묵 때문인지, 서류를 건네는 손이 평소보다 조금 느리다.
      - speaker: narration
        requires:
          flagEquals:
            key: prologue_opening
            value: probe_failure
        text: 차 상무는 내 시선을 피하면서 서류를 건넨다. 이제 이 자리는 업무다.
      - speaker: narration
        requires:
          flagEquals:
            key: prologue_opening
            value: silent_success
        text: 서류가 책상 위를 미끄러진다. 내 반응을 예상할 수 없어 그는 한 걸음 뒤로 앉아있다.
      - speaker: cha-sangmu
        text: 여기 사인 부탁드리고, 다음 주까지는 짐 정리해 주시면 돼요.
        expression: neutral
      - speaker: thought
        text: 경쟁금지 3년. 같은 업종 재취업은 사실상 불가능.
    choices:
      - id: read-carefully
        label: (조항을 꼼꼼히 읽는다)
        check: { stat: beopri, dc: 12 }
        success:
          next: read-caught
          effects:
            - kind: memory
              text: 퇴직 합의서에 '그룹 계열 및 협력사의 내부 자료 유출 시 5년 민형사 책임' 조항이 붙어있었다. 통상적 NDA보다 훨씬 세다.
            - kind: flag
              key: noticed_nda
              value: true
        failure:
          next: sign-quick
          effects:
            - kind: flag
              key: prologue_signing
              value: read_failed
      - id: sign-quick
        label: 사인한다.
        next: sign-quick
        effects:
          - kind: stat
            target: ttuksim
            delta: -1
          - kind: flag
            key: prologue_signing
            value: clean
      - id: push-back
        label: 하루만 검토해도 될까요?
        check: { stat: beopri, dc: 14 }
        success:
          next: pushback-success
          effects:
            - kind: memory
              text: 차 상무가 당황했다. 이 합의서는 원래 즉시 서명을 전제로 준비된 것이다.
            - kind: flag
              key: delayed_signing
              value: true
            - kind: flag
              key: prologue_signing
              value: deferred
        failure:
          next: pushback-failure
          effects:
            - kind: flag
              key: prologue_signing
              value: forced

  read-caught:
    id: read-caught
    lines:
      - speaker: thought
        text: 5년? 업계 표준이 2년이다. 왜 5년이지.
      - speaker: cha-sangmu
        text: 뭐, 걸리는 조항이라도 있어요?
        expression: tense
    choices:
      - id: confront
        label: 5년 조항, 이유가 있습니까.
        check: { stat: gwonmo, dc: 14 }
        success:
          next: confront-success
          effects:
            - kind: stat
              target: gwonmo
              delta: 1
            - kind: flag
              key: prologue_signing
              value: reluctantly
        failure:
          next: back-down
          effects:
            - kind: flag
              key: prologue_signing
              value: backed_down
      - id: pretend-ok
        label: 아니요. 상관없습니다.
        next: sign-quick
        effects:
          - kind: flag
            key: prologue_signing
            value: pretended

  confront-success:
    id: confront-success
    lines:
      - speaker: cha-sangmu
        text: …그건, 회사 방침이에요. 특정 인물을 겨냥한 건 아닙니다.
        expression: weary
      - speaker: thought
        text: '"특정 인물을 겨냥한 건 아닙니다" — 이 말은 특정 사안을 겨냥했다는 말이다.'
      - speaker: cha-sangmu
        text: 승재씨가 이 조항을 지키실 거라고 저는 믿어요. 안 지키실 분 아니니까.
        expression: grim
    next: sign-reluctantly

  back-down:
    id: back-down
    lines:
      - speaker: cha-sangmu
        text: 승재씨, 오늘은 그냥 사인하고 가세요. 내가 나중에 밥 한번 살게요.
        expression: smile
      - speaker: thought
        text: 밥. 그 약속은 18년 중에 한 번도 이루어진 적이 없다.
    next: sign-quick

  pushback-success:
    id: pushback-success
    lines:
      - speaker: cha-sangmu
        text: …
        expression: tense
      - speaker: cha-sangmu
        text: 알겠습니다. 월요일 오전까지는 회신 주세요. 제가 기다리겠습니다.
        expression: weary
      - speaker: thought
        text: 차 상무가 먼저 눈을 깔았다. 이 합의서, 뭔가 있다.
    next: leave-office

  pushback-failure:
    id: pushback-failure
    lines:
      - speaker: cha-sangmu
        text: 승재씨, 하루 더 생각해서 뭐가 달라지나요. 지금 편하게 하시죠.
        expression: grim
      - speaker: thought
        text: 하루가 그에게는 버겁구나. 그가 지금 버티고 있는 무언가가 있다.
    next: sign-quick

  sign-reluctantly:
    id: sign-reluctantly
    lines:
      - speaker: narration
        text: 펜이 오래 머뭇거리다 종이를 지나간다. 서명 글씨가 평소보다 짧다.
      - speaker: cha-sangmu
        text: 수고하셨습니다. 18년, 고생 많았어요.
        expression: smile
      - speaker: thought
        text: 고생. 그 단어가 이 자리에서 나왔다는 건, 이 사람이 나한테 미안한 게 있다는 뜻이다.
    next: leave-office

  sign-quick:
    id: sign-quick
    lines:
      - speaker: narration
        text: 펜이 종이를 지나간다. 조용히.
      - speaker: narration
        requires:
          flagEquals:
            key: prologue_signing
            value: pretended
        text: 아무것도 못 본 사람 연기는 18년 다닌 회사에서 많이 해봤다.
      - speaker: narration
        requires:
          flagEquals:
            key: prologue_signing
            value: forced
        text: 하루의 여유는 받지 못했다. 펜이 종이에 닿는 그 무게감은 평소보다 두 배다.
      - speaker: cha-sangmu
        text: 수고하셨습니다. 18년, 고생 많았어요.
        expression: smile
    next: leave-office

  leave-office:
    id: leave-office
    lines:
      - speaker: narration
        text: 일어서 문 앞에 선다. 차 상무가 뒤에서 한 마디 덧붙인다.
      - speaker: cha-sangmu
        text: 승재씨.
        expression: weary

      # Deferred signing: don't tell him "aim generic" — he knows he's on a tight clock
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: prologue_signing
            value: deferred
        text: 월요일 오전 아홉 시. 그때까지 생각 잘 해주세요.
        expression: grim
      - speaker: thought
        requires:
          flagEquals:
            key: prologue_signing
            value: deferred
        text: '"생각 잘"이 아니라 "답 잘"이라고 말하고 싶었을 거다.'

      # Reluctantly signed after confronting the 5-year clause
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: prologue_signing
            value: reluctantly
        text: 오늘 그 질문, 저도 이해해요. 그래도 이제 덮읍시다.
        expression: grim
      - speaker: thought
        requires:
          flagEquals:
            key: prologue_signing
            value: reluctantly
        text: 덮자. 18년의 마지막 단어가 "덮자"구나.

      # Pretended okay after seeing the NDA
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: prologue_signing
            value: pretended
        text: 승재씨, 난 항상 승재씨가 프로페셔널이라고 생각했어요. 오늘도 그랬고.
        expression: smile
      - speaker: thought
        requires:
          flagEquals:
            key: prologue_signing
            value: pretended
        text: 칭찬인 척 한 경고다. 봤지만 입 다물 거지, 하는.

      # Backed down after spotting the clause
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: prologue_signing
            value: backed_down
        text: 다행이에요, 승재씨. 사람 좋은 거 어디 안 가요.
        expression: smile
      - speaker: thought
        requires:
          flagEquals:
            key: prologue_signing
            value: backed_down
        text: 사람 좋은 거. 이 회사에서 사람 좋은 건 제일 먼저 정리되는 자질이다.

      # Forced signing after failed pushback
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: prologue_signing
            value: forced
        text: 오늘 같은 날은, 먼저 비우는 게 마음 편해요.
        expression: weary
      - speaker: thought
        requires:
          flagEquals:
            key: prologue_signing
            value: forced
        text: 먼저 비우는. 이 단어도 그의 책상에서 외운 문장 중 하나겠지.

      # Clean sign-quick or read-check failed — the generic farewell that used to apply to all paths
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: prologue_signing
            value: clean
        text: 좀 쉬어요. 아무 생각 말고.
        expression: grim
      - speaker: thought
        requires:
          flagEquals:
            key: prologue_signing
            value: clean
        text: 아무 생각 말고. 어떻게 그래.
      - speaker: cha-sangmu
        requires:
          flagEquals:
            key: prologue_signing
            value: read_failed
        text: 좀 쉬어요. 아무 생각 말고.
        expression: grim
      - speaker: thought
        requires:
          flagEquals:
            key: prologue_signing
            value: read_failed
        text: 서류 제대로 못 본 채 여기 서 있다. 피곤이 이겼다.

      # 1-line tail with secondary flag layer (NDA awareness) — independent of signing mode
      - speaker: thought
        requires:
          flag: noticed_nda
        text: 복도 끝에서 다시 고개를 돌려본다. 저 방 안의 결재판, 저게 내가 마지막으로 본 결재판이 될까.

      - speaker: narration
        text: 문을 닫는다. 복도가 길다.
        effects:
          - kind: chapterComplete
            chapter: prologue
            nextChapter: chapter-1
