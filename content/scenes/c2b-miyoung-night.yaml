id: c2b-miyoung-night
title: "한 잔만 더"
background: cheongdam-cafe
cast:
  - npc: miyoung
    position: center
    expression: weary
entry: arrive

# 2장 사이드 (성인 누아르). c2-miyoung 의 side-prompt-jaemin 에서 분기 가능.
# held_back_with_miyoung (일찍 자리 닫고 나온 플레이어) 게이트.
# 청담 위스키 바, 미영이 먼저 잡은 두 번째 자리. 도현과의 관계는 이미 정리됨을
# 본인이 말한 상태. 명시적 묘사는 의복/공간/잔으로 경유.
nodes:
  arrive:
    id: arrive
    lines:
      - speaker: narration
        text: 청담 사거리에서 한 블록 안쪽, 7층 건물 꼭대기. 엘리베이터 문이 열리자 좁고 긴 바 카운터와 어둑한 조명, 시바스 18년의 잔향이 같은 박자로 이마에 닿았다. 손님은 두 테이블, 그 중 한 쪽에 미영이 자리 잡고 있었다. 낮의 라이트 그레이 재킷 대신 짙은 네이비 니트 한 벌. 머리는 한쪽으로 풀어 내렸다.
      - speaker: miyoung
        text: 오셨네요. 한 잔 시켜 두었어요. 시바스 18, 얼음 한 조각.
        expression: weary
      - speaker: miyoung
        text: 오늘 카페, 일찍 닫아 주신 거 — 제가 부탁한 적 없는 호의였어요. 그 호의 갚고 싶어서 오늘은 제가 자리 잡았어요.
        expression: neutral
      - speaker: thought
        text: 낮의 자리에선 변호사 자세를 끝까지 잡고 앉아 있던 사람이었다. 오늘 밤은 어깨 선이 한 뼘 내려와 있었고, 그 무게가 시바스 잔으로 옮겨 가 있었다.
    next: first-pour
  first-pour:
    id: first-pour
    cast:
      - npc: miyoung
        position: center
        expression: neutral
    lines:
      - speaker: miyoung
        text: 도현 씨 얘기는 오늘 밤은 안 해요. 다음 주 출근 전에 따로 정리할 자리가 있어서요.
        expression: weary
      - speaker: miyoung
        text: 실장님 쪽 얘기 한 마디만 들을게요. 두 달 전 회사 나오신 그 마지막 한 시간, 어떻게 끝나셨어요.
        expression: tense
    choices:
      - id: tell-clean
        label: 결재판 두 도장 보고 사인. 한 번 묻고 한 번 받았다.
        next: second-pour
        effects:
          - kind: flag
            key: c2b_open
            value: clean
      - id: tell-honest
        label: 한 번 흔들렸어요. 그 흔들림을 그쪽이 끝까지 안 봤기를 바라면서 사인했다.
        check: { stat: yangsim, dc: 11 }
        success:
          next: second-pour
          effects:
            - kind: flag
              key: c2b_open
              value: honest
            - kind: memory
              text: 미영 앞에서 두 달 전 흔들림을 인정. 미영이 잔 한 번 멈추고 다시 들었다.
        failure:
          next: second-pour
          effects:
            - kind: flag
              key: c2b_open
              value: honest_clumsy
      - id: tell-deflect
        label: 그 한 시간은 오늘 이 자리에 들고 들어오기 무거운 한 시간이에요.
        next: second-pour
        effects:
          - kind: flag
            key: c2b_open
            value: deflect

  second-pour:
    id: second-pour
    cast:
      - npc: miyoung
        position: center
        expression: weary
    lines:
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2b_open
            value: honest
        text: …그 흔들림 한 번이 오늘 저녁의 첫 잔에 그대로 들어와 있네요. 저는 그 잔을 알겠어요.
        expression: weary
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2b_open
            value: deflect
        text: 무거우신 거 알겠어요. 다만 그 무거움을 한 번도 풀어 보신 적이 없으신 거 같아서요. 저는 그 풀어 보지 않은 자리가 더 신경 쓰여요.
        expression: neutral
      - speaker: miyoung
        requires:
          flagEquals:
            key: c2b_open
            value: clean
        text: 깔끔하시네요. 너무 깔끔하셔서 그 한 시간 동안 실장님이 무엇을 보지 못하셨는지가 더 궁금해지는 자리예요.
        expression: amused
      - speaker: narration
        text: 카운터 너머로 바텐더가 두 번째 잔을 채웠다. 미영이 잔에 손을 얹는 동작이 변호사가 아니라 그냥 사람의 동작이었고, 그걸 알아본 채로 둘 사이 침묵이 길어졌다.
      - speaker: miyoung
        text: 도현 씨와 저, 정리는 두 달 전부터였어요. 약혼이 깨진 게 아니라 약혼이 처음부터 부모님들 자리에서 시작됐고, 우리 둘 다 본인 자리에서 시작한 적이 없는 관계였거든요. 정리는 얼마든지 할 수 있는 자리였어요.
        expression: grim
      - speaker: miyoung
        text: 다만 그 정리 위에 오늘 같은 일이 얹힌 건, 제가 예상한 정리는 아니었어요.
        expression: weary
    next: charged-moment
  charged-moment:
    id: charged-moment
    cast:
      - npc: miyoung
        position: center
        expression: tense
    lines:
      - speaker: narration
        text: 미영이 잔을 들었다 내려놓는 사이 니트 소매가 손목 안쪽까지 흘러내렸다. 약지에 반지 자국 같은 옅은 흔적 하나. 카운터 위 향초 향이 시바스 잔 위로 잠깐 겹쳤다 흩어졌다.
      - speaker: thought
        text: 낮의 라이트 그레이 재킷에선 안 났던 향수가 오늘 밤 좌석 쪽으로 옮겨 와 있었다. 두 사람 다 알면서 마주 앉아 있는 자리였다. 다음 한 잔까지 갈지 다음 자리까지 갈지가 잔 두 개 사이에 놓여 있었고, 둘 다 그걸 봤다.
      - speaker: miyoung
        text: 실장님. 오늘 한 번 더 가실 수 있어요. 가시면 내일 아침 광화문에 다른 사람으로 들어가시는 거고. 그게 도움이 될지 짐이 될지 정리해 드릴 수도 있는데, 지금 그런 정리가 되는 머리가 아니에요. 본인 자세 알아본 채로 와 줘서, 제가 좀 떨려요.
        expression: tense
    choices:
      - id: lean-in
        label: (잔을 카운터 끝까지 밀고, 자리에서 일어선다.)
        check: { stat: yangsim, dc: 11 }
        success:
          next: night-shared
          effects:
            - kind: flag
              key: c2_intimate
              value: shared
            - kind: flag
              key: miyoung_bond
              value: deepened
            - kind: flag
              key: miyoung_count_1
              value: true
            - kind: memory
              text: 미영과 청담 위스키 바에서 선 한 번 넘었다. 내일 아침 광화문에 다른 무게로 들어간다.
        failure:
          next: night-flinch
          effects:
            - kind: flag
              key: c2_intimate
              value: hesitated
      - id: hold-line
        label: (잔을 한 번 더 채우고, 거리만은 그대로 둔다.)
        check: { stat: ttuksim, dc: 11 }
        success:
          next: night-held
          effects:
            - kind: flag
              key: c2_intimate
              value: held
            - kind: flag
              key: miyoung_bond
              value: respected
            - kind: memory
              text: 미영이 깐 두 번째 자리 카드를 받지 않고 그대로 닫았다. 미영은 그걸 자기 안에 한 번 더 새겨 두는 얼굴이었다.
        failure:
          next: night-cold
          effects:
            - kind: flag
              key: c2_intimate
              value: cold
      - id: walk-now
        label: 오늘 밤은 여기까지 하시죠. 다음 자리는 일정 안에서 잡아 드리겠습니다.
        next: night-clean-walk
        effects:
          - kind: flag
            key: c2_intimate
            value: walked
          - kind: flag
            key: miyoung_bond
            value: clean
          - kind: memory
            text: 미영의 두 번째 자리 카드를 일정 안 자리로 돌려 두고 일찍 떠났다. 미영이 그 자세를 어떻게 받아갔는지는 내일 모름.

  night-shared:
    id: night-shared
    cast:
      - npc: miyoung
        position: center
        expression: weary
    lines:
      - speaker: narration
        text: 엘리베이터 문이 닫히는 소리, 한 층 아래 호텔 층 버튼 한 번. 미영이 먼저 누른 게 아니었고, 내가 먼저 누른 것도 아니었다. 두 사람 다 같은 박자로 잠시 손등이 닿았고, 그 손등의 무게가 그 다음 두어 시간 동안 잔의 자리를 대신했다.
      - speaker: narration
        text: 다음 날 새벽 다섯 시. 호텔 방 창 너머 청담 사거리에 첫 차들이 신호 한 번에 한 묶음씩 풀려 가고 있었다. 미영의 머리카락이 베개 위에 펼쳐져 있었고, 협탁 위 시바스 잔 두 개의 얼음은 이미 녹아 가장자리에 옅은 물 자국을 남겼다.
      - speaker: thought
        text: 두 달 전 결재판 사인 자리에서 잃은 것의 모양과, 오늘 밤 이 협탁 위에서 얻은 것의 모양은 달랐다. 다만 무게는 같았고, 그 두 개를 한꺼번에 안고 광화문 자리에 들어가는 건 어제 밤까지와는 다른 그림이었다.
      - speaker: miyoung
        text: 한 시간만 더 자고 가요. 카드 키는 카운터에 두시면 돼요, 제 이름이라. 새벽 세 시쯤 손등 한 번 더 잡고 주무신 거, 저는 깬 채로 받았어요. 묻지 않으셔서 고마워요.
        expression: weary
    next: depart
  night-flinch:
    id: night-flinch
    cast:
      - npc: miyoung
        position: center
        expression: weary
    lines:
      - speaker: narration
        text: 카운터 끝까지 잔을 밀고 자리에서 일어섰다. 일어서는 동작이 매끄럽지 않았고, 미영이 그걸 잔 너머로 봤다. 같이 일어서지 않고 자기 잔을 한 번 더 들었다.
      - speaker: miyoung
        text: 자리에서 일어나신 건 알겠어요. 다만 일어서신 자세가 아직 본인 자세는 아니시라서요, 오늘 밤은 여기까지 하는 게 좋을 것 같네요.
        expression: tense
      - speaker: thought
        text: 결정이 늦었다. 미영이 안 본 척했지만 본 게 분명했고, 카운터 끝에서 그 사람의 자세는 다시 낮의 변호사로 돌아가 있었다.
    next: depart
  night-held:
    id: night-held
    cast:
      - npc: miyoung
        position: center
        expression: weary
    lines:
      - speaker: narration
        text: 잔에 얼음 한 조각을 더 넣고 카운터 자리에서 두 사람 다 자세를 그대로 두었다. 미영이 시바스 잔을 두 번째로 절반쯤 비웠고, 카운터 너머 바텐더가 음악 한 곡을 한 번 바꿨다.
      - speaker: miyoung
        text: 오늘 밤 자리는 이 카운터 끝까지인 걸로 두 사람 다 받는 거예요. 그 자세 받아 주신 거, 제 쪽에서 한 번 빚지는 자리로 정리할게요.
        expression: weary
      - speaker: thought
        text: 자리를 옮기지 않는 쪽이 미영의 결과 같은 박자였다. 둘 다 어깨를 내리고 카운터 끝에 그대로 앉아 있는 것 — 오늘 밤은 그게 가장 무거운 형태였다.
    next: depart
  night-cold:
    id: night-cold
    cast:
      - npc: miyoung
        position: center
        expression: tense
    lines:
      - speaker: miyoung
        text: 자리는 두자고 하시는데, 실장님 본인보다 톤이 식어 계세요. 오늘 밤은 그만큼 일찍 정리하는 쪽이 둘 다 편할 것 같네요.
        expression: tense
      - speaker: thought
        text: 뚝심이 식었고 그걸 미영이 봤다. 다음 자리에서 그 식음이 어떻게 청구될지는 모른다.
    next: depart

  night-clean-walk:
    id: night-clean-walk
    cast:
      - npc: miyoung
        position: center
        expression: neutral
    lines:
      - speaker: miyoung
        text: 일정 안 자리로 돌려 주신 거 알겠어요. 그 자세, 오늘 밤의 가장 단단한 자세예요. 다음에 일정 잡아 드리는 건 제 쪽에서.
        expression: neutral
      - speaker: thought
        text: 한 번 뒤로 한 발 물러서 두 사람 다 자기 자리로 돌아가는 자세. 다음 자리가 오늘 밤보다 가벼울지 무거울지는 양쪽 다 모름.
    next: depart

  depart:
    id: depart
    cast: []
    lines:
      - speaker: narration
        text: 청담 골목을 나오자 새벽 공기에 빗방울이 한두 줄 섞여 떨어지기 시작했다. 큰길 쪽으로 두 블록 더 걸어 택시를 잡았고, 기사한테 정확한 주소를 부르지 않고 그냥 "을지로 쪽이요" 한 마디로 답했다.

      - speaker: thought
        requires:
          flagEquals:
            key: c2_intimate
            value: shared
        text: 오늘 밤 자리의 무게가 코트 안주머니가 아니라 어깨에 걸려 있다. 광화문 자리에서 차 상무 앞에 앉을 때, 이 무게가 도움이 될지 짐이 될지를 양쪽 다 알아보고 들어갈 거다.
      - speaker: thought
        requires:
          flagEquals:
            key: c2_intimate
            value: held
        text: 어깨를 내려 본 자리에 서 본 사실이 오늘 밤 이후 며칠의 결정을 더 차분하게 만들 거다. 그 차분함이 차 상무 앞에서 어떤 형태로 박힐지가 다음의 변수.
      - speaker: thought
        requires:
          flagEquals:
            key: c2_intimate
            value: walked
        text: 일찍 일어선 자세가 미영의 자세와 같은 박자로 정리됐다. 다음 자리는 미영이 잡는다, 그것도 일정 안 자리로.

      - speaker: narration
        text: 택시 안에서 코트 안주머니 휴대폰을 한 번 켰다. 새벽 알림 두 통, 둘 다 모르는 번호. 받지 않고 잠금 화면 그대로 다시 안주머니에 넣었다.
        effects:
          - kind: chapterComplete
            chapter: chapter-2
            nextChapter: chapter-3
